<script>
/* cloud city — rusted spires stand out of a rolling cloud sea, three giant moons
   sunk to their shoulders in haze behind them. Walkways, girders, cables and chains
   strung between the spire tops; masts rise from the clouds, tip lights blinking;
   vines hang off the decks. TIME: dawn/day/dusk/night. FLOOD: the cloud-sea level.
   Original artwork © Marko Manriquez, all rights reserved. r128. */
const PAL={rustLo:0x1E130A,rust:0x4E3018,rustHi:0x8E6030,girder:0x6A4626,gold:0xE0B060,cream:0xF4E0B0,
  moonLo:0x7A5A34,moonDark:0x1A120A,halo:0xE8C488,vine:0x34361A,vineHi:0x8A8438,
  win:0xFFD08A,winCool:0xBFE0FF,tip:0xA8D8FF,tipWarm:0xFF9A50,sea:0xD4AE76,mote:0xE4F0FF,pale:0xC9B48E};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng=mulberry32(20261024);
const rand=(a=0,b=1)=>a+(b-a)*rng(),pick=a=>a[(rng()*a.length)|0],lerpC=(c1,c2,t)=>new THREE.Color(c1).lerp(new THREE.Color(c2),t),MU=THREE.MathUtils,ss=x=>{x=MU.clamp(x,0,1);return x*x*(3-2*x);},C=h=>new THREE.Color(h);
function glowSprite(){const s=64,cv=document.createElement('canvas');cv.width=cv.height=s;const g=cv.getContext('2d'),gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.28,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(cv);}
const GLOW=glowSprite();
/* additive glow fades INTO the fog instead of adding fog colour (keeps the horizon clean) */
const FOGFADE=THREE.ShaderChunk.fog_fragment.replace(/gl_FragColor\.rgb\s*=\s*mix\([^;]*\);/,'gl_FragColor.rgb *= (1.0-fogFactor);');
function addFade(m){m.onBeforeCompile=sh=>{sh.fragmentShader=sh.fragmentShader.replace('#include <fog_fragment>',FOGFADE);};return m;}
function mkGeo(pos,col){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));return g;}
function glowPoints(pos,col,size,op){return new THREE.Points(mkGeo(pos,col),addFade(new THREE.PointsMaterial({size,vertexColors:true,map:GLOW,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true})));}
function rockPoints(pos,col,size,op){return new THREE.Points(mkGeo(pos,col),new THREE.PointsMaterial({size,vertexColors:true,transparent:true,opacity:op||0.92}));}
function dynBuf(n){const a=new Float32Array(n*3),g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));return {a,g};}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0E0A07);scene.fog=new THREE.FogExp2(0x0E0A07,0.0036);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,4000);
const renderer=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
const world=new THREE.Group();scene.add(world);
let seaY=40;

/* ---------- accumulators: spire shells, fine detail, static girder/cable lines, windows, tip lights, vines ---------- */
const S={p:[],c:[]},D={p:[],c:[]},L={p:[],c:[]},W={p:[],c:[],ph:[]},T={p:[],c:[],per:[],ph:[]},vines=[],decks=[];
function pt(B,x,y,z,col){B.p.push(x,y,z);B.c.push(col.r,col.g,col.b);}
function seg(x1,y1,z1,x2,y2,z2,c1,c2){c2=c2||c1;L.p.push(x1,y1,z1,x2,y2,z2);L.c.push(c1.r,c1.g,c1.b,c2.r,c2.g,c2.b);}
function win(x,y,z){const c=rng()<0.12?C(PAL.winCool):lerpC(PAL.win,0xFFF0D0,rng()*0.5);W.p.push(x,y,z);W.c.push(c.r,c.g,c.b);W.ph.push(rand(0,6.28));}
function tip(x,y,z,warm){const c=C(warm?PAL.tipWarm:PAL.tip);T.p.push(x,y,z);T.c.push(c.r,c.g,c.b);T.per.push(rand(1.4,3.2));T.ph.push(rand(0,1));}
function vine(x,y,z,len){vines.push({ax:x,ay:y,az:z,len,ph:rand(0,6.28),sway:rand(0.5,1.6)});}
function curve(A,B,sag,n,fn){for(let i=0;i<=n;i++){const u=i/n;fn(MU.lerp(A[0],B[0],u),MU.lerp(A[1],B[1],u)-sag*4*u*(1-u),MU.lerp(A[2],B[2],u),u,i);}}
function cable(A,B,sag,col){let pv=null;curve(A,B,sag,18,(x,y,z)=>{if(pv)seg(pv[0],pv[1],pv[2],x,y,z,col);pv=[x,y,z];});}
function chain(A,B,sag){const len=Math.hypot(B[0]-A[0],B[1]-A[1],B[2]-A[2]),n=Math.max(8,(len/0.55)|0);curve(A,B,sag,n,(x,y,z,u,i)=>{const c=lerpC(PAL.rustLo,i%2?PAL.rustHi:PAL.rust,0.6+0.4*rng());pt(D,x+(i%2?0.12:-0.12),y,z,c);});}
function dangle(x,y,z,len){for(let s=0;s<len;s+=0.55){const c=lerpC(PAL.rustLo,PAL.rustHi,(s/0.55|0)%2?0.7:0.35);pt(D,x,y-s,z,c);}}
/* lattice mast: three legs, ring + zig-zag bracing, points on the legs so it reads at 1px */
function truss(x,z,y0,y1,r0,r1,step,c1,c2,dots){const rot=rand(0,6.28);let prev=null;
  for(let y=y0;y<=y1+0.01;y+=step){const f=(y-y0)/(y1-y0),r=MU.lerp(r0,r1,f),cur=[0,1,2].map(k=>[x+r*Math.cos(rot+k*2.094),y,z+r*Math.sin(rot+k*2.094)]),cc=lerpC(c1,c2,f);
    for(let k=0;k<3;k++){const A=cur[k],B=cur[(k+1)%3];seg(A[0],A[1],A[2],B[0],B[1],B[2],cc);}
    if(prev)for(let k=0;k<3;k++){const A=prev[k],B=cur[k],E=cur[(k+1)%3];seg(A[0],A[1],A[2],B[0],B[1],B[2],cc);seg(A[0],A[1],A[2],E[0],E[1],E[2],cc);
      if(dots)for(let s=0.34;s<1;s+=0.33)pt(D,MU.lerp(A[0],B[0],s),MU.lerp(A[1],B[1],s),MU.lerp(A[2],B[2],s),lerpC(PAL.rustLo,PAL.rust,0.5+0.5*rng()));}
    prev=cur;}
  const ap=[x,y1+step*0.8,z];for(const A of prev)seg(A[0],A[1],A[2],ap[0],ap[1],ap[2],lerpC(c1,c2,1));return ap;}

/* ---------- the spires ---------- */
const SP=[[0,0,140],[30,-17,116],[-27,13,100],[13,34,86],[-17,-33,108],[46,21,66],[-48,-10,62],[33,-48,76],[-33,42,72],[60,-4,94],[-6,58,64],[-54,-42,84]]
  .map(a=>({x:a[0],z:a[1],top:a[2],rb:3.0+a[2]/48,seed:rand(0,6.28)}));
function rAt(s,y){const f=MU.clamp(y/s.top,0,1);return s.rb*(1-0.4*f)*(1+0.6*Math.pow(MU.clamp((y-(s.top-6))/6,0,1),2));}
function surf(s,h,dx,dz){const r=rAt(s,h);return [s.x+dx*r,h,s.z+dz*r];}
for(const s of SP){
  // ribbed shaft
  for(let y=14;y<s.top;y+=1.25){const band=(y%13)<1.25,r=rAt(s,y),n=Math.max(10,(2*Math.PI*r/(band?0.7:1.3))|0),f=y/s.top;
    for(let k=0;k<n;k++){const a=k/n*Math.PI*2,rr=r*(1+0.1*Math.cos(4*a+s.seed))+rand(-.08,.08);let c;
      if(band)c=lerpC(PAL.rust,PAL.rustHi,0.3+0.4*rng());
      else if(Math.sin(a*9+s.seed+y*0.02)>0.93)c=lerpC(PAL.rustLo,0x000000,0.4);
      else if(rng()<0.1)c=lerpC(PAL.rust,PAL.rustHi,rng());
      else if(rng()<0.05*(1-f)+0.04)c=lerpC(PAL.vine,PAL.vineHi,rng()*0.6);
      else c=lerpC(PAL.rustLo,PAL.rust,0.25+0.6*rng()*(0.6+0.4*f));
      pt(S,s.x+rr*Math.cos(a),y,s.z+rr*Math.sin(a),c);}}
  // rib girders
  for(let k=0;k<4;k++){const a=k*Math.PI/2-s.seed/4;let pv=null;for(let y=14;y<=s.top;y+=6){const r=rAt(s,y)*1.12,q=[s.x+r*Math.cos(a),y,s.z+r*Math.sin(a)];if(pv)seg(pv[0],pv[1],pv[2],q[0],q[1],q[2],C(PAL.girder));pv=q;}}
  for(let w=0;w<5+(s.top/16|0);w++){const y=rand(22,s.top-3),a=rand(0,6.28),r=rAt(s,y)+0.35;win(s.x+r*Math.cos(a),y,s.z+r*Math.sin(a));}
  // deck
  const y0=s.top,rd=s.rb*2.1+rand(1.5,3.5);s.rd=rd;decks.push({x:s.x,y:y0,z:s.z,rd});
  for(let i=0;i<rd*rd*1.5;i++){const r=rd*Math.sqrt(rng()),a=rand(0,6.28);pt(S,s.x+r*Math.cos(a),y0,s.z+r*Math.sin(a),lerpC(PAL.rustLo,PAL.rust,0.4+0.5*rng()));}
  {const n=(2*Math.PI*rd/0.55)|0;for(let k=0;k<n;k++){const a=k/n*Math.PI*2;pt(S,s.x+rd*Math.cos(a),y0-0.5,s.z+rd*Math.sin(a),lerpC(PAL.rust,PAL.rustHi,0.3+0.5*rng()));pt(S,s.x+rd*Math.cos(a),y0,s.z+rd*Math.sin(a),lerpC(PAL.rust,PAL.gold,0.15*rng()));
    if(k%2===0)pt(D,s.x+rd*Math.cos(a),y0+1.5,s.z+rd*Math.sin(a),C(PAL.rustHi));}
   const np=Math.max(10,(2*Math.PI*rd/3)|0);for(let k=0;k<np;k++){const a=k/np*Math.PI*2,a2=(k+1)/np*Math.PI*2;seg(s.x+rd*Math.cos(a),y0,s.z+rd*Math.sin(a),s.x+rd*Math.cos(a),y0+1.5,s.z+rd*Math.sin(a),C(PAL.girder));seg(s.x+rd*Math.cos(a),y0+1.5,s.z+rd*Math.sin(a),s.x+rd*Math.cos(a2),y0+1.5,s.z+rd*Math.sin(a2),C(PAL.girder));}
   for(let k=0;k<8;k++){const a=k/8*Math.PI*2+s.seed,r1=rAt(s,y0-9);seg(s.x+r1*Math.cos(a),y0-9,s.z+r1*Math.sin(a),s.x+rd*0.95*Math.cos(a),y0-0.4,s.z+rd*0.95*Math.sin(a),C(PAL.girder));}}
  // huts with lit windows
  for(let h=0;h<1+(rng()<0.65?1:0)+(rd>11?1:0);h++){const w=rand(3,5.5),d=rand(3,5),hh=rand(2.6,4.8),a=rand(0,6.28),r=rand(0,Math.max(0,rd-5)),cx=s.x+r*Math.cos(a),cz=s.z+r*Math.sin(a),ro=rand(0,3.14),ux=Math.cos(ro),uz=Math.sin(ro),vx=-uz,vz=ux;
    const P=(i,j,k)=>[cx+ux*i+vx*j,y0+k,cz+uz*i+vz*j];
    const nP=((2*(w+d)*hh+w*d)*2.2)|0;for(let i=0;i<nP;i++){const f=(rng()*5)|0;let q;if(f===0)q=P(w/2,rand(-d/2,d/2),rand(0,hh));else if(f===1)q=P(-w/2,rand(-d/2,d/2),rand(0,hh));else if(f===2)q=P(rand(-w/2,w/2),d/2,rand(0,hh));else if(f===3)q=P(rand(-w/2,w/2),-d/2,rand(0,hh));else q=P(rand(-w/2,w/2),rand(-d/2,d/2),hh);
      pt(D,q[0],q[1],q[2],rng()<0.2?lerpC(PAL.rust,PAL.rustHi,rng()):lerpC(PAL.rustLo,PAL.rust,0.4+0.5*rng()));}
    const E=[[-1,-1],[1,-1],[1,1],[-1,1]];for(let k=0;k<4;k++){const A=E[k],B=E[(k+1)%4],a0=P(A[0]*w/2,A[1]*d/2,0),a1=P(A[0]*w/2,A[1]*d/2,hh),b1=P(B[0]*w/2,B[1]*d/2,hh);seg(a0[0],a0[1],a0[2],a1[0],a1[1],a1[2],C(PAL.girder));seg(a1[0],a1[1],a1[2],b1[0],b1[1],b1[2],C(PAL.girder));}
    for(let k=0;k<2+(rng()*3|0);k++){const side=rng()<0.5?1:-1,q=rng()<0.5?P(side*(w/2+0.2),rand(-d/3,d/3),rand(0.8,hh-0.6)):P(rand(-w/3,w/3),side*(d/2+0.2),rand(0.8,hh-0.6));win(q[0],q[1],q[2]);}
    if(rng()<0.6){const ap=P(rand(-w/3,w/3),rand(-d/3,d/3),hh),ht=rand(4,9);seg(ap[0],ap[1],ap[2],ap[0],ap[1]+ht,ap[2],C(PAL.girder));tip(ap[0],ap[1]+ht+0.2,ap[2],rng()<0.3);}}
  // overgrowth mounds + hanging vines off the rim
  for(let m=0;m<2+(rng()*3|0);m++){const a=rand(0,6.28),r=rd*rand(0.6,0.95),mr=rand(1.6,3.2),cx=s.x+r*Math.cos(a),cz=s.z+r*Math.sin(a);
    for(let i=0;i<mr*mr*12;i++){const u=rand(0,6.28),rr=mr*Math.sqrt(rng()),hgt=mr*0.7*Math.sqrt(Math.max(0,1-(rr/mr)**2))*rng();pt(D,cx+rr*Math.cos(u),y0+hgt,cz+rr*Math.sin(u),lerpC(PAL.vine,PAL.vineHi,rng()*0.8));}}
  for(let v=0;v<4+(rng()*4|0);v++){const a=rand(0,6.28);vine(s.x+rd*Math.cos(a),y0-0.5,s.z+rd*Math.sin(a),rand(4,s.top>100?22:14));}
  // main antenna
  const mh=s.top>105?rand(30,46):rand(14,28);s.ap=truss(s.x,s.z,y0,y0+mh,1.7,0.3,2.6,C(PAL.rust),C(PAL.rustHi),false);tip(s.ap[0],s.ap[1]+0.4,s.ap[2],false);
  if(mh>20){const ya=y0+mh*0.7;seg(s.x-5,ya,s.z,s.x+5,ya,s.z,C(PAL.girder));tip(s.x-5,ya,s.z,true);tip(s.x+5,ya,s.z,true);}
  for(let k=0;k<1+(rng()*2|0);k++){const a=rand(0,6.28),r=rd*rand(0.4,0.8),ht=rand(6,14),x=s.x+r*Math.cos(a),z=s.z+r*Math.sin(a);seg(x,y0,z,x,y0+ht,z,C(PAL.girder));seg(x,y0+ht*0.8,z,x+1.4,y0+ht*0.8,z,C(PAL.girder));tip(x,y0+ht+0.2,z,rng()<0.25);}
}
/* ---------- walkways, girders, cables, chains between the tops ---------- */
const pairs=new Set();
for(let i=0;i<SP.length;i++){const ds=SP.map((s,j)=>[j,Math.hypot(s.x-SP[i].x,s.z-SP[i].z)]).filter(q=>q[0]!==i).sort((a,b)=>a[1]-b[1]);for(let k=0;k<2;k++){const j=ds[k][0];pairs.add(Math.min(i,j)+'-'+Math.max(i,j));}}
const PAIRS=[...pairs].map(k=>k.split('-').map(Number));
for(const [i,j] of PAIRS){const A=SP[i],B=SP[j];const len=Math.hypot(B.x-A.x,B.z-A.z),dx=(B.x-A.x)/len,dz=(B.z-A.z)/len,px2=-dz,pz2=dx;
  const h=Math.max(30,Math.min(A.top,B.top)-rand(3,13)),a0=surf(A,h,dx,dz),b0=surf(B,h,-dx,-dz),wl=Math.hypot(b0[0]-a0[0],b0[2]-a0[2]),sag=wl*0.03,n=Math.max(6,Math.ceil(wl/1.6));
  const at=u=>[MU.lerp(a0[0],b0[0],u),h-sag*4*u*(1-u),MU.lerp(a0[2],b0[2],u)];const rail=C(PAL.girder),under=rng()<0.55;let pv=null;
  for(let s=0;s<=n;s++){const u=s/n,q=at(u);
    if(pv){for(const sd of [-1.3,1.3]){seg(pv[0]+px2*sd,pv[1],pv[2]+pz2*sd,q[0]+px2*sd,q[1],q[2]+pz2*sd,rail);seg(pv[0]+px2*sd,pv[1]+1.5,pv[2]+pz2*sd,q[0]+px2*sd,q[1]+1.5,q[2]+pz2*sd,rail);}
      if(under){seg(pv[0],pv[1]-2.4,pv[2],q[0],q[1]-2.4,q[2],rail);seg(pv[0]+px2*1.3,pv[1],pv[2]+pz2*1.3,q[0],q[1]-2.4,q[2],rail);seg(pv[0]-px2*1.3,pv[1],pv[2]-pz2*1.3,q[0],q[1]-2.4,q[2],rail);}}
    seg(q[0]-px2*1.3,q[1],q[2]-pz2*1.3,q[0]+px2*1.3,q[1],q[2]+pz2*1.3,rail);

  {let k=0;for(let w=0;w<WSP.length;w++){const s=WSP[w];s.x+=s.v*dt;if(s.x>190)s.x=-190;const cy=seaY+s.dy;for(let i=0;i<WPN;i++,k++){wsP[k*3]=s.x+wOff[k*3]*s.sx;wsP[k*3+1]=cy+wOff[k*3+1]*s.sy;wsP[k*3+2]=s.z+wOff[k*3+2]*s.sz;}}wsGeo.attributes.position.needsUpdate=true;}
  // motes
  {const ca=mGeo.attributes.color.array;for(let i=0;i<MN;i++){const m=motes[i];m.a+=m.sp*dt;mP[i*3]=m.d.x+m.r*Math.cos(m.a);mP[i*3+1]=m.d.y+m.h+0.8*Math.sin(t*0.9+m.ph);mP[i*3+2]=m.d.z+m.r*Math.sin(m.a);const b=(0.35+0.65*Math.max(0,Math.sin(t*0.6+m.ph)))*(0.3+0.7*par.lights);ca[i*3]=0.89*b;ca[i*3+1]=0.94*b;ca[i*3+2]=b;}mGeo.attributes.position.needsUpdate=true;mGeo.attributes.color.needsUpdate=true;}
  // vines sway
  {let i=0;for(const v of vines){let pv0=v.ax,pv1=v.ay,pv2=v.az;for(let s=1;s<=VS;s++){const f=s/VS,x=v.ax+v.sway*f*Math.sin(t*0.7+v.ph-f*1.4),y=v.ay-f*v.len,z=v.az+v.sway*0.5*f*Math.cos(t*0.6+v.ph);vP[i*6]=pv0;vP[i*6+1]=pv1;vP[i*6+2]=pv2;vP[i*6+3]=x;vP[i*6+4]=y;vP[i*6+5]=z;pv0=x;pv1=y;pv2=z;i++;}}vGeo.attributes.position.needsUpdate=true;}
  // stars twinkle
  if(par.star>0.01){const arr=stars.geometry.attributes.color.array;for(let i=0;i<starPh.length;i++){const tw=0.5+0.5*Math.sin(t*1.2+starPh[i]);arr[i*3]=starBase[i*3]*tw;arr[i*3+1]=starBase[i*3+1]*tw;arr[i*3+2]=starBase[i*3+2]*tw;}stars.geometry.attributes.color.needsUpdate=true;}
  renderer.render(scene,camera);}
animate();
