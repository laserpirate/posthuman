<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas of Lost Moons and Future Forests (study)</title>
<style>
  :root{--bg:#05070C;--silver:#D8DEE6;--moon:#F4F6F8;--pale:#AEC2D6;--cream:#ECEAE0;
    --mono:'DM Mono','Courier New',ui-monospace,monospace;--serif:Cambria,Georgia,'Times New Roman',serif;}
  *{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--cream)}
  #c{display:block;width:100vw;height:100vh;cursor:grab}#c:active{cursor:grabbing}
  .ui{position:fixed;pointer-events:none;user-select:none;z-index:10}
  #title{top:26px;left:28px;max-width:66vw}
  #title h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(20px,2.5vw,32px);line-height:1.12;margin:0;text-shadow:0 2px 40px #000,0 0 60px rgba(174,194,214,.25)}
  #title .sub{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--pale);opacity:.9;margin-top:11px}
  #legend{bottom:24px;left:28px;font-family:var(--mono);font-size:11px;line-height:1.9;opacity:.86;text-shadow:0 1px 12px #000}
  #legend .row{display:flex;align-items:center;gap:10px}#legend .sw{width:11px;height:11px;border-radius:2px;flex:0 0 auto}#legend .v{opacity:.55}
  #foot{bottom:22px;right:26px;text-align:right;font-family:var(--mono);font-size:10px;letter-spacing:.08em;opacity:.4}
  #tt{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:20;pointer-events:auto;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);background:rgba(20,26,34,.5);border:1px solid rgba(174,194,214,.35);border-radius:20px;padding:8px 16px;backdrop-filter:blur(6px)}
  #tt.off{opacity:.5;border-color:rgba(174,194,214,.18)}
  #hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:12px;letter-spacing:.1em;opacity:0;transition:opacity .6s;text-transform:uppercase;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="title"><h1>Atlas of Lost Moons and Future Forests.</h1>
  <div class="sub">VA·NA · vana-kodama study &nbsp;·&nbsp; a map whose size was that of the empire</div></div>
<div class="ui" id="legend"></div><div id="hint">drag to look · scroll closer</div>
<button id="tt">◉ turntable</button>
<div class="ui" id="foot">SymbiOS™ | Inflorescence Intelligence™ · study, provisional name</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Atlas of Lost Moons and Future Forests — a dendrogram/percolation section.
   Ranked conifers -> root columns percolating down through strata -> suspended
   moon-spheres -> wells at the bottom. Monochrome, color-breath, turntable. r128. */
const PAL={bg:0x05070C,silver:0xD8DEE6,pale:0xAEC2D6,moon:0xF4F6F8,moonLo:0x8A96A2,
  water:0x1A2430,waterHi:0xCFE0F0,treeHi:0xAEB8C4,treeLo:0x323A44,root:0xB6BEC8,rootLo:0x2A323C,
  strata:0x232A33,spirit:0xE6ECF2};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng=mulberry32(20260714);
const rand=(a=0,b=1)=>a+(b-a)*rng(),pick=a=>a[(rng()*a.length)|0],lerpC=(c1,c2,t)=>new THREE.Color(c1).lerp(new THREE.Color(c2),t),MU=THREE.MathUtils,ss=x=>{x=MU.clamp(x,0,1);return x*x*(3-2*x);};
function glowSprite(){const s=64,cv=document.createElement('canvas');cv.width=cv.height=s;const g=cv.getContext('2d'),gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.28,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(cv);}
const GLOW=glowSprite();
function glowPoints(pos,col,size,op){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));return new THREE.Points(g,new THREE.PointsMaterial({size,vertexColors:true,map:GLOW,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));}
const scene=new THREE.Scene();scene.background=new THREE.Color(PAL.bg);scene.fog=new THREE.FogExp2(0x070A12,0.0038);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,4000);
const renderer=new THREE.WebGLRenderer({canvas:c,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
const world=new THREE.Group();scene.add(world);
const GROUND=38;

/* strata bands */
{const p=[],col=[];for(const yb of [30,22,14,7]){for(let i=0;i<900;i++){const x=rand(-72,72),z=rand(-14,14);p.push(x,yb+rand(-1.4,1.4),z);const c=lerpC(PAL.strata,PAL.pale,0.1+0.25*rng());col.push(c.r,c.g,c.b);}}world.add(glowPoints(p,col,0.6,0.4));}

/* ranked conifers + root columns (percolation) */
const rootP=[],rootBase=[],rootY=[];
function conifer(x,z){const p=[],col=[];const h=rand(20,30);
  for(let s=0;s<26;s++){const f=s/25;p.push(x+rand(-.4,.4),GROUND+f*h,z+rand(-.4,.4));const c=lerpC(PAL.treeLo,PAL.treeHi,0.3+0.6*f);col.push(c.r,c.g,c.b);}          // trunk
  for(let tier=0;tier<5;tier++){const ty=GROUND+h*(0.25+tier*0.15),tw=(1-tier/6)*rand(4,6);for(let k=0;k<70;k++){const a=rand(0,6.28),r=tw*Math.sqrt(rng());p.push(x+r*Math.cos(a),ty-r*0.5+rand(0,2.5),z+r*Math.sin(a));const c=lerpC(PAL.treeLo,PAL.treeHi,0.3+0.5*rng());col.push(c.r,c.g,c.b);}}
  world.add(glowPoints(p,col,0.7,0.8));
  // root column: bundle of dotted strands down to the wells
  const nS=5+(rand(0,3)|0);for(let s=0;s<nS;s++){let rx=x+rand(-2,2),rz=z+rand(-2,2),y=GROUND-0.5;while(y>4){rx+=rand(-0.3,0.3);rz+=rand(-0.3,0.3);rootP.push(rx,y,rz);const c=new THREE.Color(PAL.root);rootBase.push(c.r,c.g,c.b);rootY.push(y);
    if(rng()<0.25)for(let f=0;f<2;f++){rootP.push(rx+rand(-1.2,1.2),y+rand(-.8,.8),rz+rand(-1.2,1.2));const fc=lerpC(PAL.rootLo,PAL.root,0.5);rootBase.push(fc.r,fc.g,fc.b);rootY.push(y);}
    y-=rand(0.8,1.4);}}}
let tx=-64;const treeXs=[];while(tx<=64){const z=pick([-9,0,9,0]);conifer(tx,z);treeXs.push([tx,z]);tx+=rand(7,9.5);}
const rootGeo=new THREE.BufferGeometry();rootGeo.setAttribute('position',new THREE.Float32BufferAttribute(rootP,3));rootGeo.setAttribute('color',new THREE.Float32BufferAttribute(rootBase.slice(),3));
const roots=new THREE.Points(rootGeo,new THREE.PointsMaterial({size:0.9,vertexColors:true,map:GLOW,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending,depthWrite:false}));world.add(roots);
const rootBaseF=new Float32Array(rootBase),rootYF=new Float32Array(rootY),rootN=rootYF.length;

/* suspended moon-spheres (varying sizes, horizon ring) */
const moons=[];
function makeMoon(cx,cy,cz,R){const g=new THREE.Group();const p=[],col=[],N=(R*R*10)|0;
  for(let i=0;i<N;i++){const u=rand(0,6.28),v=Math.acos(rand(-1,1)),x=R*Math.sin(v)*Math.cos(u),y=R*Math.cos(v),z=R*Math.sin(v)*Math.sin(u);const cr=0.5+0.5*Math.sin(x*0.9)*Math.cos(y*0.7);const c=lerpC(PAL.moonLo,PAL.moon,MU.clamp(0.55+0.45*cr,0.4,1));p.push(x,y,z);col.push(c.r,c.g,c.b);}
  g.add(glowPoints(p,col,1.2,0.9));
  const rp=[],rc=[];for(let k=0;k<60;k++){const a=k/60*Math.PI*2;rp.push(R*1.02*Math.cos(a),rand(-0.3,0.3),R*1.02*Math.sin(a));const c=new THREE.Color(PAL.waterHi);rc.push(c.r,c.g,c.b);}g.add(glowPoints(rp,rc,1.0,0.7));  // horizon line
  g.position.set(cx,cy,cz);world.add(g);moons.push({g,ph:rand(0,6.28),spin:rand(-0.3,0.3),baseY:cy});}
for(let i=0;i<11;i++)makeMoon(rand(-58,58),rand(11,32),rand(-8,8),rand(2,6));

/* wells at the bottom */
const wells=[];const wP=[],wC=[],rimP=[],rimC=[];
let wx=-48;while(wx<=48){const cx=wx,cz=rand(-3,3),R=rand(5,8);wells.push({cx,cz,R,rr:rand(0,R),spd:rand(0.04,0.08),refPh:rand(0,6.28)});
  for(let i=0;i<Math.floor(R*R*2.4);i++){const rr=R*Math.sqrt(rng()),a=rand(0,6.28);wP.push(cx+rr*Math.cos(a),4,cz+rr*Math.sin(a));const c=lerpC(PAL.water,PAL.pale,0.12+0.2*rng());wC.push(c.r,c.g,c.b);}
  for(let k=0;k<Math.floor(R*7);k++){const a=k/Math.floor(R*7)*Math.PI*2;rimP.push(cx+R*Math.cos(a),4.2,cz+R*Math.sin(a));const c=new THREE.Color(PAL.waterHi);rimC.push(c.r,c.g,c.b);}
  wx+=rand(13,17);}
world.add(new THREE.Points((()=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(wP,3));g.setAttribute('color',new THREE.Float32BufferAttribute(wC,3));return g;})(),new THREE.PointsMaterial({size:1.3,vertexColors:true,map:GLOW,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false})));
world.add(glowPoints(rimP,rimC,1.2,0.6));
const refN=wells.length*16,rfp=[],refPos=new Float32Array(refN*3),refCol=new Float32Array(refN*3);
let rc2=0;for(const W of wells){for(let i=0;i<16;i++){const rr=W.R*0.5*Math.sqrt(rng()),a=rand(0,6.28);rfp.push({cx:W.cx,cz:W.cz,x0:rr*Math.cos(a),z0:rr*Math.sin(a),ph:rand(0,6.28)});const c=lerpC(PAL.waterHi,PAL.moon,rng());refCol[rc2*3]=c.r;refCol[rc2*3+1]=c.g;refCol[rc2*3+2]=c.b;rc2++;}}
const refGeo=new THREE.BufferGeometry();refGeo.setAttribute('position',new THREE.BufferAttribute(refPos,3));refGeo.setAttribute('color',new THREE.BufferAttribute(refCol,3));
const refl=new THREE.Points(refGeo,new THREE.PointsMaterial({size:1.2,vertexColors:true,map:GLOW,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false}));world.add(refl);
const RPP=40,ringPos=new Float32Array(wells.length*RPP*3),ringCol=new Float32Array(wells.length*RPP*3);
const ringGeo=new THREE.BufferGeometry();ringGeo.setAttribute('position',new THREE.BufferAttribute(ringPos,3));ringGeo.setAttribute('color',new THREE.BufferAttribute(ringCol,3));
world.add(new THREE.Points(ringGeo,new THREE.PointsMaterial({size:1.0,vertexColors:true,map:GLOW,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false})));

/* kodamas on the ground line */
const spirits=[];
function makeSpirit(){const g=new THREE.Group();const hp=[],hc=[];for(let i=0;i<70;i++){const u=rand(0,6.28),v=Math.acos(rand(-1,1)),r=1.9*(0.9+rand(0,0.1));hp.push(r*Math.sin(v)*Math.cos(u),r*Math.cos(v)+2,r*Math.sin(v)*Math.sin(u));const c=new THREE.Color(PAL.spirit);hc.push(c.r,c.g,c.b);}const head=glowPoints(hp,hc,1.3,0);g.add(head);
  const fp=[-0.5,2.3,1.7,0.5,2.3,1.7,0,1.6,1.8],fc=[0.02,0.02,0.04,0.02,0.02,0.04,0.02,0.02,0.04];const fg=new THREE.BufferGeometry();fg.setAttribute('position',new THREE.Float32BufferAttribute(fp,3));fg.setAttribute('color',new THREE.Float32BufferAttribute(fc,3));const face=new THREE.Points(fg,new THREE.PointsMaterial({size:0.95,vertexColors:true,transparent:true,opacity:0}));g.add(face);
  g.visible=false;world.add(g);const sp={g,head,face,state:'wait',timer:rand(0,5),op:0};spirits.push(sp);repos(sp);return sp;}
function repos(sp){sp.g.position.set(rand(-58,58),GROUND+rand(0,2),pick([-9,0,9]));}
for(let i=0;i<5;i++)makeSpirit();
function updSpirits(t,dt){for(const sp of spirits){sp.timer-=dt;
  if(sp.state==='wait'){if(sp.timer<=0){sp.state='in';sp.timer=1.4;sp.g.visible=true;}}
  else if(sp.state==='in'){sp.op=MU.clamp(sp.op+dt/1.4,0,1);if(sp.timer<=0){sp.state='hold';sp.timer=rand(3,6);}}
  else if(sp.state==='hold'){if(sp.timer<=0){sp.state='out';sp.timer=1.6;}}
  else if(sp.state==='out'){sp.op=MU.clamp(sp.op-dt/1.6,0,1);if(sp.timer<=0){sp.state='wait';sp.timer=rand(2,6);sp.g.visible=false;repos(sp);}}
  sp.head.material.opacity=0.85*sp.op;sp.face.material.opacity=0.9*sp.op;sp.g.rotation.z=Math.sin(t*0.8+sp.g.position.x)*0.05;}}

/* motes */
const mN=280,mPos=new Float32Array(mN*3),mCol=[];for(let i=0;i<mN;i++){mPos[i*3]=rand(-70,70);mPos[i*3+1]=rand(4,GROUND+28);mPos[i*3+2]=rand(-14,14);const c=lerpC(PAL.pale,PAL.silver,rng());mCol.push(c.r,c.g,c.b);}
const mGeo=new THREE.BufferGeometry();mGeo.setAttribute('position',new THREE.BufferAttribute(mPos,3));mGeo.setAttribute('color',new THREE.Float32BufferAttribute(mCol,3));
const motes=new THREE.Points(mGeo,new THREE.PointsMaterial({size:0.5,vertexColors:true,map:GLOW,transparent:true,opacity:0.4,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(motes);

/* color-breath + turntable */
const tint=new THREE.Color(),CYC=36;
function updTint(t){const p=(t%CYC)/CYC;let s,l;
  if(p<0.34){s=0;l=0.82;}else if(p<0.56){const k=ss((p-0.34)/0.22);s=k;l=MU.lerp(0.82,0.6,k);}
  else if(p<0.72){s=1;l=0.6;}else if(p<0.86){const k=ss((p-0.72)/0.14);s=1;l=MU.lerp(0.6,0.06,k);}
  else{const k=ss((p-0.86)/0.14);s=1-k;l=MU.lerp(0.06,0.82,k);}
  tint.setHSL((0.5+p*0.9+t*0.008)%1,s,l);scene.traverse(o=>{if(o.material&&o.material.color)o.material.color.copy(tint);});}
let turntable=true;const ttBtn=document.getElementById('tt');ttBtn.addEventListener('click',()=>{turntable=!turntable;ttBtn.textContent=(turntable?'◉':'○')+' turntable';ttBtn.classList.toggle('off',!turntable);});

/* camera */
const target=new THREE.Vector3(0,18,0);let camA=Math.PI*0.5,camR=132,camY=32,drag=false,px=0,py=0;
c.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;});addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;camA-=(e.clientX-px)*.005;camY=MU.clamp(camY-(e.clientY-py)*.4,10,90);px=e.clientX;py=e.clientY;});
addEventListener('wheel',e=>{camR=MU.clamp(camR+e.deltaY*.05,80,220);},{passive:true});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
document.getElementById('legend').innerHTML=[[PAL.treeHi,'ranked forest','the future canopy'],[PAL.root,'roots percolate','down through strata'],[PAL.moon,'lost moons','suspended, adrift'],[PAL.waterHi,'the wells','where it all collects']]
  .map(r=>`<div class="row"><span class="sw" style="background:#${new THREE.Color(r[0]).getHexString()};box-shadow:0 0 10px #${new THREE.Color(r[0]).getHexString()}"></span><span>${r[1]}</span><span class="v">${r[2]}</span></div>`).join('');
const hint=document.getElementById('hint');hint.style.opacity=1;setTimeout(()=>hint.style.opacity=0,4200);

/* animate */
const clock=new THREE.Clock();let last=0;
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime(),dt=Math.min(0.05,t-last);last=t;
  if(turntable&&!drag)camA+=0.0009;camera.position.set(Math.cos(camA)*camR,camY,Math.sin(camA)*camR);camera.lookAt(target);
  // percolation pulse down the roots
  {const arr=rootGeo.attributes.color.array;for(let i=0;i<rootN;i++){const pul=0.35+0.65*Math.max(0,Math.sin(t*1.6-rootYF[i]*0.35));arr[i*3]=rootBaseF[i*3]*pul;arr[i*3+1]=rootBaseF[i*3+1]*pul;arr[i*3+2]=rootBaseF[i*3+2]*pul;}rootGeo.attributes.color.needsUpdate=true;}
  for(const m of moons){m.g.position.y=m.baseY+1.4*Math.sin(t*0.3+m.ph);m.g.rotation.y+=m.spin*0.01;}
  updSpirits(t,dt);
  // wells: reflection shimmer + ripple rings
  for(let i=0;i<refN;i++){const p=rfp[i],rip=Math.sin(t*2.2+p.ph)*0.7;refPos[i*3]=p.cx+p.x0+rip;refPos[i*3+1]=4.1;refPos[i*3+2]=p.cz+p.z0+rip*0.5;}refGeo.attributes.position.needsUpdate=true;
  let idx=0;for(const W of wells){W.rr+=W.spd;if(W.rr>W.R)W.rr=rand(0,1.5);const fade=1-W.rr/W.R;for(let k=0;k<RPP;k++){const a=k/RPP*Math.PI*2;ringPos[idx*3]=W.cx+W.rr*Math.cos(a);ringPos[idx*3+1]=4.15;ringPos[idx*3+2]=W.cz+W.rr*Math.sin(a);const c=new THREE.Color(PAL.waterHi);ringCol[idx*3]=c.r*fade;ringCol[idx*3+1]=c.g*fade;ringCol[idx*3+2]=c.b*fade;idx++;}}ringGeo.attributes.position.needsUpdate=true;ringGeo.attributes.color.needsUpdate=true;
  const mp=motes.geometry.attributes.position;for(let i=0;i<mN;i++){let y=mp.getY(i)+0.015;if(y>GROUND+28)y=4;mp.setY(i,y);}mp.needsUpdate=true;
  updTint(t);renderer.render(scene,camera);}
animate();
</script>
</body>
</html>
