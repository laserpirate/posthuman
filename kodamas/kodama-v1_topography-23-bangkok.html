  {const arr=windows.geometry.attributes.color.array;for(let i=0;i<winN;i++){const fl=0.6+0.4*Math.sin(t*1.4+winPh[i]);arr[i*3]=winBase[i*3]*fl;arr[i*3+1]=winBase[i*3+1]*fl;arr[i*3+2]=winBase[i*3+2]*fl;}windows.geometry.attributes.color.needsUpdate=true;}
  // palms + vines sway
  for(const pm of palms){const arr=pm.o.geometry.attributes.position.array,B=pm.base,M=pm.meta;for(let i=0;i<arr.length/3;i++){const a=M[i*2],u=M[i*2+1],sw=(0.6+chop*0.4)*u*0.7*Math.sin(t*1.2+pm.ph+a);arr[i*3]=B[i*3]+sw*Math.cos(a+1.57);arr[i*3+1]=B[i*3+1]+0.2*sw;arr[i*3+2]=B[i*3+2]+sw*Math.sin(a+1.57);}pm.o.geometry.attributes.position.needsUpdate=true;}
  {let i=0;for(const v of vines){let prev=[v.ax,v.ay,v.az];for(let s=1;s<=8;s++){const f=s/8,x=v.ax+v.sway*f*Math.sin(t*0.7+v.ph-f*1.4),y=v.ay-f*v.len,z=v.az+v.sway*0.5*f*Math.cos(t*0.6+v.ph);vP2[i*6]=prev[0];vP2[i*6+1]=prev[1];vP2[i*6+2]=prev[2];vP2[i*6+3]=x;vP2[i*6+4]=y;vP2[i*6+5]=z;prev=[x,y,z];i++;}}vGeo2.attributes.position.needsUpdate=true;}
  // stars twinkle
  {const arr=stars.geometry.attributes.color.array;for(let i=0;i<starPh.length;i++){const tw=0.5+0.5*Math.sin(t*1.2+starPh[i]);arr[i*3]=starBase[i*3]*tw;arr[i*3+1]=starBase[i*3+1]*tw;arr[i*3+2]=starBase[i*3+2]*tw;}stars.geometry.attributes.color.needsUpdate=true;}
  renderer.render(scene,camera);}
animate();
