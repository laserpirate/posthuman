/* gund trays — a design-school studio long after the people left. Four open
   terraces (the trays) step down under a cascading roof of sloping steel
   trusses and glass, eight structural bays long: a truss, a row of concrete
   columns, a fin at the east glass and a roof fin on every column line, and a
   raised glazed roof unit over the top tray in every bay. About half the
   glazing is gone and the rain comes through the holes. Desks, drafting stools, chipboard and foam models, rolled drawings,
   saplings growing out of the desks, moss on the board-formed concrete, water
   pooling on the lower trays. A few monitors still flicker, one laser cutter
   still glows, one desk lamp was left on. Moon and stars through the broken roof.
   Massing stylized after Gund Hall (John Andrews, 1972); not survey-accurate.

const NT=4,DY=3.2,G=18,RS=0.1,TD=1.8,REC=4,NB=8,BAY=13,HW=NB*BAY/2;
const XF=[25,11,0,-11,-22];              // XF[k] = east (front) edge of tray k, XF[k+1] = its west edge; tray 0 meets the east glass
const CL=[];for(let i=0;i<=NB;i++)CL.push(-HW+i*BAY);   // the nine column lines: truss, columns, east fin and roof fin on each
const yT=k=>k*DY;
function bayAt(x){if(x>=XF[1])return 0;for(let k=1;k<NT;k++)if(x>=XF[k+1])return k;return NT-1;}   // tray index under x
const floorAt=x=>yT(bayAt(x));
const GK=k=>G-1.4*k;                    // headroom under the roof, tighter on the upper trays
const roofBay=(k,x)=>yT(k)+GK(k)-RS*(x-XF[k+1]);
const roofAt=x=>roofBay(bayAt(x),x);
const chordT=x=>19.8-0.1636*x-0.15;      // sloping truss top chord, under the high (west) end of every roof step
const TZ=CL;
const SAG=[{z:-39,k:0,a:1.4},{z:13,k:0,a:1.0},{z:39,k:1,a:0.9},{z:26,k:2,a:0.8},{z:-52,k:1,a:0.6}];   // all clear of the orbit (bays 2-4)

const MD=V(0.78,0.44,0.3).normalize();   // toward the moon: east, over the low end of the roof
const MC=MD.clone().multiplyScalar(380);

/* ---------- accumulators ---------- */
const MG={p:[],c:[],i:[]},GQ={p:[],c:[],i:[]};
const acc=()=>({p:[],c:[]});

function put(B,x,y,z,col){B.p.push(x,y,z);B.c.push(col.r,col.g,col.b);}
function seg(B,A,Bv,c1,c2){c2=c2||c1;B.p.push(A.x,A.y,A.z,Bv.x,Bv.y,Bv.z);B.c.push(c1.r,c1.g,c1.b,c2.r,c2.g,c2.b);}
const _m4=new THREE.Matrix4(),_eu=new THREE.Euler(),_v3=new THREE.Vector3(),_up=V(0,1,0);
const BOXF=[[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]];
/* boxes that sit level drop their underside: the camera is always above them (keepBot for the roof fins) */
function box(cx,cy,cz,sx,sy,sz,col,rx,ry,rz,kt,kb,keepBot){const skipBot=!keepBot&&Math.abs(rx||0)<0.2&&Math.abs(rz||0)<0.2;_m4.makeRotationFromEuler(_eu.set(rx||0,ry||0,rz||0));_m4.setPosition(cx,cy,cz);const b=MG.p.length/3,t=kt||1.2,bo=kb||0.65;
  for(let i=0;i<8;i++){_v3.set((i&1?.5:-.5)*sx,(i&2?.5:-.5)*sy,(i&4?.5:-.5)*sz).applyMatrix4(_m4);MG.p.push(_v3.x,_v3.y,_v3.z);const k=i&2?t:bo;MG.c.push(col.r*k,col.g*k,col.b*k);}
  for(const f of BOXF){if(skipBot&&f===BOXF[2])continue;MG.i.push(b+f[0],b+f[1],b+f[2],b+f[0],b+f[2],b+f[3]);}}
function gquad(O,U,W2,nu,nv,colF){const b=MG.p.length/3;for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){const u=i/nu,v=j/nv,x=O.x+U.x*u+W2.x*v,y=O.y+U.y*u+W2.y*v,z=O.z+U.z*u+W2.z*v;MG.p.push(x,y,z);const cc=colF(u,v,x,y,z);MG.c.push(cc.r,cc.g,cc.b);}
  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const a=b+j*(nu+1)+i,cc=a+nu+1;MG.i.push(a,a+1,cc+1,a,cc+1,cc);}}

  for(let k=0;k<n;k++){const T=new THREE.Vector3().subVectors(path[Math.min(n-1,k+1)],path[Math.max(0,k-1)]).normalize();
    if(!N)N=Math.abs(T.y)>0.9?V(1,0,0):_up.clone();N.sub(T.clone().multiplyScalar(N.dot(T))).normalize();const B=new THREE.Vector3().crossVectors(T,N);
    for(let j=0;j<sg;j++){const an=j/sg*Math.PI*2+Math.PI/4,dir=N.clone().multiplyScalar(Math.cos(an)).add(B.clone().multiplyScalar(Math.sin(an)));

for(let k=0;k<NT;k++){const y=yT(k),xa=k<NT-1?XF[k+1]-REC:XF[NT],xb=XF[k];
  gquad(V(xa,y,-HW),V(xb-xa,0,0),V(0,0,2*HW),Math.ceil((xb-xa)/2),48,(u,v,x)=>{const cc=C(PAL.floor).lerp(C(PAL.floorHi),rng()*0.4);if(k<NT-1&&x<XF[k+1])cc.multiplyScalar(0.3+0.4*(x-xa)/REC);return cc.multiplyScalar(0.8);});

    gquad(V(xb-0.25,y,-HW),V(0,0.9,0),V(0,0,2*HW),1,48,(u,v,x,yy)=>concC(yy).multiplyScalar(0.85));

gquad(V(XF[NT],yT(NT-1),-HW),V(0,GK(NT-1)+0.4,0),V(0,0,2*HW),9,48,(u,v,x,yy)=>concC(yy));

document.getElementById('legend').innerHTML=[[PAL.scr,'monitors','a few still flicker'],[PAL.laser,'laser cutter','one job never finished'],[PAL.lamp,'desk lamp','left on'],[PAL.beam,'moonlight','through the missing panes'],[PAL.leafHi,'overgrowth','saplings in the desks'],[PAL.glint,'standing water','rises with the flood']]
  .map(r=>`<div class="row"><span class="sw" style="background:#${C(r[0]).getHexString()};box-shadow:0 0 10px #${C(r[0]).getHexString()}"></span><span>${r[1]}</span><span class="v">${r[2]}</span></div>`).join('');
scene.traverse(o=>{o.frustumCulled=false;});

/* ---------- animate ---------- */
const clock=new THREE.Clock();let last=0,frame=0;const _c1=new THREE.Color();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime(),dt=Math.min(0.05,t-last);last=t;frame++;
  if(turntable&&!drag)camA+=0.0007;
  camera.position.set(Math.cos(camA)*camR,camY,Math.sin(camA)*camR);camera.lookAt(target);
  const lcx=camera.position.x-OX,lcy=camera.position.y,lcz=camera.position.z-OZ;
  if(timeAuto)P=(P+dt/110)%1;else{let d=((targetP-P+0.5)%1+1)%1-0.5;P=((P+d*Math.min(1,dt*1.4))%1+1)%1;}
  if(floodAuto)F=0.5+0.5*Math.sin(t*0.045-0.4);else F+=(targetF-F)*Math.min(1,dt*1.2);
  const par=tparams(P);
  RLv+=((rainAuto?par.rain:targetR)-RLv)*Math.min(1,dt*1.5);
  scene.background.copy(par.sky);scene.fog.color.copy(par.fog);scene.fog.density=par.fd;
  for(const A of AMB)A.m.color.copy(A.base).multiplyScalar(par.amb);
  W=0.25+F*4.6;waterPlane.position.y=W;wg.position.y=W;waterMat.color.copy(par.wat);
  glassMat.color.copy(par.gl);
  litFloor.material.color.copy(par.bc).multiplyScalar(par.bi*(0.45+0.55*par.amb));
  ruEdge.material.color.copy(par.bc).multiplyScalar(0.5+0.5*Math.max(par.moon,1-par.star));ruGlow.material.color.copy(par.bc);ruGlow.material.opacity=0.07+0.09*Math.max(par.moon,1-par.star);ruShaft.material.color.copy(par.bc);ruShaft.material.opacity=0.09*par.bi*(0.5+0.5*Math.max(par.moon,1-par.star));
  shards.material.color.copy(par.bc);shards.material.opacity=0.3+0.5*par.bi;floorGlass.material.color.copy(par.bc);floorGlass.material.opacity=(0.25+0.5*par.moon)*(0.6+0.4*Math.sin(t*0.7));
  beamVol.material.color.copy(par.bc);beamVol.material.opacity=0.055*par.bi*(0.5+0.5*Math.max(par.moon,1-par.star));beamDust.material.color.copy(par.bc);beamDust.material.opacity=0.8*par.bi;
  moonMat.opacity=0.95*par.moon;haloMat.opacity=0.3*par.moon;starMat.opacity=0.9*par.star;cloudMat.opacity=0.25+0.2*par.moon;
  clouds.rotation.y=0.12*Math.sin(t*0.01);
  for(const m of mists)m.o.material.opacity=m.op*(0.6+0.4*par.amb);mistLo.position.y=W;
  phaseEl.textContent='— '+NAMES[Math.round(P*4)%4]+' · water '+((F*100)|0)+'% · rain '+((RLv*100)|0)+'% —';
  // glints on the flooded trays
  GL0.o.material.opacity=0.75*(0.5+0.5*par.bi);GL1.o.material.opacity=0.75*ss((W-3.25)/0.3);
  for(const S of [GL0,GL1]){if(S.o.material.opacity<0.01)continue;const a=S.arr,bb=S.base;for(let i=0;i<S.n;i++){const tw=0.2+0.8*Math.pow(Math.max(0,Math.sin(t*1.7+S.ph[i])),3);a[i*3]=bb[i*3]*tw;a[i*3+1]=bb[i*3+1]*tw;a[i*3+2]=bb[i*3+2]*tw;}S.o.geometry.attributes.color.needsUpdate=true;}
  // moon glitter: where the moon's image meets the water, stretched toward the camera
  {const h1=Math.max(0.5,lcy-W),h2=MC.y-W,lx=MC.x-OX-lcx,lz=MC.z-OZ-lcz,f0=h1/(h1+h2),ll=Math.hypot(lx,lz),nx=-lz/ll,nz=lx/ll,mo=par.moon;
    for(let i=0;i<refN;i++){const r=refItems[i],u=f0*r.m,w=(0.3+u*ll*0.08)*r.xj+0.25*Math.sin(t*2+r.ph);let x=lcx+lx*u+nx*w,z=lcz+lz*u+nz*w,y=W+0.04;if(x>XF[0]-0.2||Math.abs(z)>HW-0.2||mo<0.02)y=-60;refPos[i*3]=x;refPos[i*3+1]=y;refPos[i*3+2]=z;}
    refGeo.attributes.position.needsUpdate=true;moonRef.material.opacity=0.8*mo;}
  // rain
  {const nIn=RIN*RLv,nOut=ROUT*RLv;for(let i=0;i<RN;i++){const d=RD[i],o=i*6,on=d.out?(i-RIN)<nOut:i<nIn;
      if(!on){raPos[o]=raPos[o+3]=0;raPos[o+1]=raPos[o+4]=-200;raPos[o+2]=raPos[o+5]=0;continue;}
      d.y-=d.v*dt;d.x-=0.5*dt;const gr=d.out?-1:Math.max(d.g,W);
      if(d.y<=gr){if(!d.out&&rng()<0.55)ripple(d.x,gr+0.03,d.z,gr===W?rand(0.4,1.1):rand(0.12,0.3),gr===W?1:0.55);spawn(d,false);}
      raPos[o]=d.x+0.03;raPos[o+1]=d.y+0.6;raPos[o+2]=d.z;raPos[o+3]=d.x;raPos[o+4]=d.y;raPos[o+5]=d.z;}
    raGeo.attributes.position.needsUpdate=true;rainObj.material.opacity=0.25+0.3*RLv;}
  // ripples + splashes
  {let idx=0;for(const r of RIP){if(r.on){r.rr+=r.spd*dt;if(r.rr>r.max)r.on=false;}const fade=r.on?Math.pow(1-r.rr/r.max,1.3)*r.b:0;
    for(let k=0;k<RRP;k++){const a=k/RRP*Math.PI*2;rpPos[idx*3]=r.x+r.rr*Math.cos(a);rpPos[idx*3+1]=r.on?r.y:-60;rpPos[idx*3+2]=r.z+r.rr*Math.sin(a);rpCol[idx*3]=0.6*fade;rpCol[idx*3+1]=0.8*fade;rpCol[idx*3+2]=0.85*fade;idx++;}}
    rpGeo.attributes.position.needsUpdate=true;rpGeo.attributes.color.needsUpdate=true;}
  // dust drifting down the moonbeams
  for(let b=0;b<BN;b++){const B=BEAMS[b],L=bL[b];for(let i=0;i<SHD;i++){const k=b*SHD+i,q=k*5,s=(bdSeed[q+2]+t*0.01*bdSeed[q+3])%1,x=B.x0+(B.x1-B.x0)*bdSeed[q]+0.2*Math.sin(t*0.5+bdSeed[q+4]),z=B.z0+(B.z1-B.z0)*bdSeed[q+1]+0.2*Math.cos(t*0.4+bdSeed[q+4]),y=roofBay(B.k,x);
      bdPos[k*3]=x-MD.x*L*s;bdPos[k*3+1]=y-MD.y*L*s;bdPos[k*3+2]=z-MD.z*L*s;}}
  if(BN)bdGeo.attributes.position.needsUpdate=true;
  // monitors
  for(let i=0;i<MNn;i++){const m=MONS[i],ph=t+m.ph;let b;
    if(m.mode===0)b=0.8+0.2*Math.sin(t*31+m.ph)*Math.sin(t*7);else if(m.mode===1)b=(Math.sin(ph*2.3)*Math.sin(ph*5.1)>0.3)?0.08:0.9;else if(m.mode===2)b=0.55;else b=(ph%6)<0.25?1:0.04;
    b*=par.mon;for(let j=0;j<MP;j++){const o=(i*MP+j)*3;let bj=b;if(m.mode===2){const row=j/4|0;bj=b*(0.35+0.65*(((t*1.6+m.ph)%3|0)===row?1:0.25));}msCol[o]=m.c.r*bj;msCol[o+1]=m.c.g*bj;msCol[o+2]=m.c.b*bj;}
    mhCol[i*3]=m.c.r*b*0.6;mhCol[i*3+1]=m.c.g*b*0.6;mhCol[i*3+2]=m.c.b*b*0.6;}
  if(MNn){msGeo.attributes.color.needsUpdate=true;mhGeo.attributes.color.needsUpdate=true;}
  // laser cutter: the head rasters the lid, the glow breathes
  {const u=(t*0.9)%1,row=((t*0.9)|0)%9,hp=laserHead.geometry.attributes.position.array;hp[0]=LASER.x-0.4+0.8*(row%2?1-u:u);hp[2]=LASER.z-0.7+row*0.16;laserHead.geometry.attributes.position.needsUpdate=true;
    const br=0.75+0.25*Math.sin(t*2.1);laserHead.material.opacity=Math.sin(t*40)>-0.3?1:0.3;laserLid.material.opacity=0.35*br;laserHalo.material.opacity=0.28*br;}
  // the desk lamp, bulb going
  {const fl=(Math.sin(t*0.37)>0.9&&Math.sin(t*23)>0)?0.3:1;lampHead.material.opacity=fl;lampPool.material.opacity=0.6*fl;lampHalo.material.opacity=0.3*fl;}
  // vines + leaves
  {let i=0,li=0;for(const v of vines){let x0=v.ax,y0=v.ay,z0=v.az;for(let s=1;s<=VS;s++){const f=s/VS,x=v.ax+v.sway*f*Math.sin(t*0.6+v.ph-f*1.4),y=v.ay-f*v.len,z=v.az+v.sway*0.5*f*Math.cos(t*0.5+v.ph);
      vP[i*6]=x0;vP[i*6+1]=y0;vP[i*6+2]=z0;vP[i*6+3]=x;vP[i*6+4]=y;vP[i*6+5]=z;x0=x;y0=y;z0=z;i++;
      for(let q=0;q<LF;q++){lfPos[li*3]=x+lfJ[li*3];lfPos[li*3+1]=y+lfJ[li*3+1];lfPos[li*3+2]=z+lfJ[li*3+2];li++;}}}
    vGeo.attributes.position.needsUpdate=true;lfGeo.attributes.position.needsUpdate=true;}
  // spirit motes over the trays
  for(let m=0;m<MN;m++){const M=MO[m],ph=M.ph,mx=2+18*Math.sin(t*0.021*M.dir+ph),mz=-OZ+30*Math.sin(t*0.017+ph*2),my=Math.max(floorAt(mx),W)+1.6+1.2*Math.sin(t*0.07+ph),op=ss(Math.sin(t*0.11+ph*3)*1.6+0.4)*(0.4+0.6*par.star);
    for(let k=0;k<MQ;k++){const o=(m*MQ+k)*3,b=op*(k===0?1:0.55)*(0.8+0.2*Math.sin(t*3+k));moPos[o]=mx+moOff[o];moPos[o+1]=my+moOff[o+1]+0.15*Math.sin(t*1.3+ph);moPos[o+2]=mz+moOff[o+2];moCol[o]=0.85*b;moCol[o+1]=0.96*b;moCol[o+2]=0.92*b;}}
  moGeo.attributes.position.needsUpdate=true;moGeo.attributes.color.needsUpdate=true;
  // stars twinkle (every other frame)
  if(par.star>0.01&&frame%2===0){const arr=stars.geometry.attributes.color.array;for(let i=0;i<starPh.length;i++){const tw=0.55+0.45*Math.sin(t*1.2+starPh[i]);arr[i*3]=starBase[i*3]*tw;arr[i*3+1]=starBase[i*3+1]*tw;arr[i*3+2]=starBase[i*3+2]*tw;}stars.geometry.attributes.color.needsUpdate=true;}
  renderer.render(scene,camera);}
animate();
