 for(const lat of [0.25,0.5,0.75]){const r=R*Math.sin(lat*Math.PI/2)*1.0,y=4+R*Math.cos(lat*Math.PI/2)*0.0+R*(1-lat)*0.9;const rr=R*Math.sqrt(1-Math.pow(1-lat,2)*0.999);

 for(let m=0;m<10;m++){const a=m/10*Math.PI*2;let prev=null;for(let s=0;s<=8;s++){const u=s/8,ring=R*Math.sin(u*Math.PI/2),ry=4+R*Math.cos(u*Math.PI/2);const q=[cx+ring*Math.cos(a),ry,cz+ring*Math.sin(a)];if(prev){sp.push(prev[0],prev[1],prev[2],q[0],q[1],q[2]);const c=new THREE.Color(PAL.dome);for(let e=0;e<2;e++)sc.push(c.r,c.g,c.b);}prev=q;}}
 world.add(new THREE.LineSegments(mkGeo(sp,sc),new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.5})));
 const gp=[],gc=[];for(let i=0;i<60;i++){const rr=R*0.7*Math.sqrt(rng()),a=rand(0,6.28);gp.push(cx+rr*Math.cos(a),4+rand(0,4),cz+rr*Math.sin(a));const c=lerpC(PAL.win,pick(GOODS),rng()*0.5);gc.push(c.r,c.g,c.b);}
 const o=glowPoints(gp,gc,1.4,0.7);domeGlow=o.material;world.add(o);}

/* SKYTRAIN — viaduct + running train */

{const p=[],col=[],sp=[],sc=[];for(let s=0;s<=120;s++){const q=railP(s/120);p.push(q.x-1.4,q.y,q.z,q.x+1.4,q.y,q.z);const c=lerpC(0x38424A,PAL.rail,0.3+0.4*rng());col.push(c.r,c.g,c.b,c.r,c.g,c.b);

 world.add(rockPoints(p,col,0.7,0.85));world.add(new THREE.LineSegments(mkGeo(sp,sc),new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.5})));}

for(let i=0;i<refN;i++){refItems.push({x:rand(-70,70),ph:rand(0,6.28)});const c=lerpC(PAL.ref,PAL.moon,rng());refCol[i*3]=c.r;refCol[i*3+1]=c.g;refCol[i*3+2]=c.b;}

{let i=0;for(const b of bangkas){for(let k=0;k<BPTS;k++){const c=lerpC(PAL.wood,0x6A5238,rng()*0.5);bkCol[i*3]=c.r;bkCol[i*3+1]=c.g;bkCol[i*3+2]=c.b;i++;}

{const ac=[];for(let i=0;i<bangkas.length*4*2;i++){const c=new THREE.Color(0x4A3A28);ac.push(c.r,c.g,c.b);}armG.setAttribute('color',new THREE.Float32BufferAttribute(ac,3));}
