{let p=0;for(const k of kois){for(let i=0;i<SN;i++){const c=k.nodeCols[i];for(let e=0;e<2;e++){koiColArr[p*3]=c.r;koiColArr[p*3+1]=c.g;koiColArr[p*3+2]=c.b;p++;}}}}

  {const arr=stars.geometry.attributes.color.array;for(let i=0;i<starPh.length;i++){const tw=0.5+0.5*Math.sin(t*1.2+starPh[i]);arr[i*3]=starBase[i*3]*tw;arr[i*3+1]=starBase[i*3+1]*tw;arr[i*3+2]=starBase[i*3+2]*tw;}stars.geometry.attributes.color.needsUpdate=true;}

  for(const cb of cloudBands){const arr=cb.o.geometry.attributes.position.array,B=cb.base,off=(t*(cb.near?1.4:0.9))%(cb.w*4)-cb.w*2;for(let i=0;i<arr.length/3;i++)arr[i*3]=B[i*3]+off;cb.o.geometry.attributes.position.needsUpdate=true;if(cb.near)cb.o.material.opacity=(0.28+0.16*Math.sin(t*0.3+cb.cx))*(0.4+0.6*par.moonO);}
