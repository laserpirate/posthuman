<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* drowned towers — abandoned skyscrapers standing in fog and floodwater. Vines spill
   down the façades, trees root on the broken crowns, bent masts still blink, rusted
   girders, cables and chains sag between the towers. Fog banks layer near to far.
   Near single-hue rose palette, tiny pale accents. Time + flood cycles. r128. */
const PAL={tLo:0x22081C,tHi:0x5A1E46,fLo:0x3E1636,fHi:0x74305E,rust:0x8E2C40,rustHi:0xC25A60,
  vine:0x7A2454,vineHi:0xC8588E,leaf:0xB0407A,canopy:0x9A3468,canopyHi:0xEE8AB6,
  win:0xFFE8F0,win2:0xFFF2E4,lamp:0xFF9CB6,moon:0xFFF2F6,moonLo:0xE2B0C6,mote:0xFFD8E8,foam:0xF8D0DE,cable:0x2E0C24};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng=mulberry32(20261024);
const rand=(a=0,b=1)=>a+(b-a)*rng(),pick=a=>a[(rng()*a.length)|0],lerpC=(c1,c2,t)=>new THREE.Color(c1).lerp(new THREE.Color(c2),t),MU=THREE.MathUtils,ss=x=>{x=MU.clamp(x,0,1);return x*x*(3-2*x);};
function glowSprite(){const s=64,cv=document.createElement('canvas');cv.width=cv.height=s;const g=cv.getContext('2d'),gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.28,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(cv);}
const GLOW=glowSprite();
function mkGeo(pos,col){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));return g;}
function glowPoints(pos,col,size,op){return new THREE.Points(mkGeo(pos,col),new THREE.PointsMaterial({size,vertexColors:true,map:GLOW,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));}
function rockPoints(pos,col,size){return new THREE.Points(mkGeo(pos,col),new THREE.PointsMaterial({size,vertexColors:true}));}
function dynBuf(n){const a=new Float32Array(n*3),g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));return {a,g};}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x4A1A40);scene.fog=new THREE.FogExp2(0x4A1A40,0.0055);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.5,4000);
const renderer=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.localClippingEnabled=true;
const world=new THREE.Group();scene.add(world);
let waterY=8;
const FL=3.2;

/* ---------- sky dome (single-hue gradient) ---------- */
const skyU={top:{value:new THREE.Color(0x12060F)},bot:{value:new THREE.Color(0x4A1A40)}};
const dome=new THREE.Mesh(new THREE.SphereGeometry(1600,24,12),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying float vh;void main(){vh=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 top;uniform vec3 bot;varying float vh;void main(){gl_FragColor=vec4(mix(bot,top,smoothstep(0.02,0.55,vh)),1.0);}'}));
dome.renderOrder=-10;scene.add(dome);

/* ---------- towers ---------- */
const TP={core:{p:[],c:[]},ring:{p:[],c:[]},far:{p:[],c:[]}};
const SL=[],SC=[];// static structure lines (towers, girders, masts, cables, trunks)
function seg(a,b,c1,c2){c2=c2||c1;SL.push(a[0],a[1],a[2],b[0],b[1],b[2]);SC.push(c1.r,c1.g,c1.b,c2.r,c2.g,c2.b);}
const towers=[];
function tower(cx,cz,w,d,h,rot,tier){
  const far=tier==='far',S=tier==='core'?0.72:tier==='ring'?0.95:1.75,slabEvery=far?2:1,colStep=far?8:4.4,vStep=far?2.4:S*1.15;
  const ca=Math.cos(rot),sa=Math.sin(rot),P=2*(w+d);
  const W=(lx,lz)=>[cx+lx*ca-lz*sa,cz+lx*sa+lz*ca];
  const per=u=>{u=((u%P)+P)%P;if(u<w)return [u-w/2,-d/2,0,-1];u-=w;if(u<d)return [w/2,u-d/2,1,0];u-=d;if(u<w)return [w/2-u,d/2,0,1];u-=w;return [-w/2,d/2-u,-1,0];};
  const at=(u,y,o)=>{o=o||0;const q=per(u),r=W(q[0]+q[2]*o,q[1]+q[3]*o);return [r[0],y,r[1]];};
  const nrm=u=>{const q=per(u);return [q[2]*ca-q[3]*sa,q[2]*sa+q[3]*ca];};
  const brk=rng()<0.72,bA=rand(4,15),bF=rand(0.12,0.4),bPh=rand(0,6.28);
  const top=u=>brk?h-bA*Math.max(0,Math.sin(u*bF+bPh))*(0.55+0.45*Math.sin(u*0.31+bPh*2)):h;
  const minTop=brk?h-bA:h;
  const holes=[];for(let k=0;k<(far?2:5);k++){const u0=rand(0,P),y0=rand(6,h*0.85);holes.push([u0,u0+rand(3,8),y0,y0+rand(4,12)]);}
  const hole=(u,y)=>{for(const H of holes)if(u>H[0]&&u<H[1]&&y>H[2]&&y<H[3])return true;return false;};
  const dst=TP[tier],lo=far?PAL.fLo:PAL.tLo,hi=far?PAL.fHi:PAL.tHi;
  const add=(u,y,c)=>{const q=at(u,y,0);dst.p.push(q[0]+rand(-.07,.07),y,q[2]+rand(-.07,.07));dst.c.push(c.r,c.g,c.b);};
  for(let f=1;f*FL<h;f++){if(f%slabEvery)continue;const y=f*FL;for(let u=0;u<P;u+=S){if(y>top(u)||hole(u,y))continue;
    const c=rng()<0.1?lerpC(PAL.rust,PAL.rustHi,rng()*0.6):lerpC(lo,hi,0.15+0.7*rng()*(0.5+0.5*y/h));add(u,y,c);}}
  const cols=[];for(let u=0;u<P;u+=colStep)cols.push(u);cols.push(w,w+d,2*w+d);
  for(const u of cols){const tu=top(u),rs=rng()<0.25;for(let y=0;y<tu;y+=vStep){if(hole(u,y))continue;const c=(rs&&rng()<0.6)?lerpC(PAL.rust,PAL.rustHi,rng()*0.5):lerpC(lo,hi,0.25+0.5*rng());add(u,y,c);}}
  if(!brk){for(let i=0;i<w*d*(far?0.06:0.18);i++){const r=W(rand(-w/2,w/2),rand(-d/2,d/2));dst.p.push(r[0],h,r[1]);const c=lerpC(lo,hi,0.4*rng());dst.c.push(c.r,c.g,c.b);}}
  const lc=lerpC(lo,hi,0.45),cs=[0,w,w+d,2*w+d,P];
  for(let k=0;k<4;k++)seg(at(cs[k],0,0),at(cs[k],top(cs[k]),0),lc);
  for(let f=3;f*FL<minTop;f+=far?4:3){const y=f*FL;for(let k=0;k<4;k++)seg(at(cs[k],y,0),at(cs[k+1],y,0),lc);}
  return {cx,cz,w,d,h,rot,ca,sa,P,W,per,at,nrm,top,minTop,brk,tier,rad:Math.hypot(w,d)/2,roofY:brk?minTop+1:h};}
function place(n,r0,r1,wr,hr,tier,gap){let tries=0,k=0;while(k<n&&tries<600){tries++;const a=rand(0,6.28),r=r0+(r1-r0)*Math.sqrt(rng()),cx=r*Math.cos(a),cz=r*Math.sin(a),w=rand(wr[0],wr[1]),d=rand(wr[0],wr[1]),rad=Math.hypot(w,d)/2;
  if(towers.some(T=>Math.hypot(T.cx-cx,T.cz-cz)<T.rad+rad+gap))continue;towers.push(tower(cx,cz,w,d,rand(hr[0],hr[1]),rand(0,3.14),tier));k++;}}
place(4,0,30,[12,17],[80,118],'core',6);place(7,44,86,[10,15],[42,84],'ring',9);place(12,238,330,[14,24],[60,135],'far',12);
const nearT=towers.filter(T=>T.tier!=='far');
// street-level rubble mounds (visible only at low water)
for(const T of nearT)for(let i=0;i<110;i++){const u=rand(0,T.P),o=rand(0.3,5),y=Math.max(0,rand(0,3.4)*(1-o/5.5));const q=T.at(u,y,o);TP.ring.p.push(q[0],q[1],q[2]);const c=rng()<0.3?lerpC(PAL.vine,PAL.leaf,rng()):lerpC(PAL.tLo,PAL.rust,rng()*0.6);TP.ring.c.push(c.r,c.g,c.b);}
const towerObjs=[];
for(const [k,sz] of [['core',0.85],['ring',1.0],['far',1.9]]){const o=rockPoints(TP[k].p,TP[k].c,sz);world.add(o);towerObjs.push(o);}

/* ---------- overgrowth: vines spilling down façades, moss on the crowns ---------- */
const VL=[],VC=[],LFp=[],LFc=[];
for(const T of towers){const far=T.tier==='far',n=Math.round(T.P*(T.tier==='core'?0.62:T.tier==='ring'?0.55:0.14));
  for(let i=0;i<n;i++){const u=rand(0,T.P),roof=rng()<0.62,tu=T.top(u),y0=roof?tu:Math.min(tu,FL*Math.floor(rand(4,T.h/FL))),
    len=rand(4,Math.max(6,y0*(far?0.3:0.7))),ph=rand(0,6.28),step=far?2:1.1;
    let prev=T.at(u,y0,0.25);
    for(let m=0;m<(far?2:5);m++){LFp.push(prev[0]+rand(-.8,.8),prev[1]+rand(-.3,.6),prev[2]+rand(-.8,.8));const c=lerpC(PAL.leaf,PAL.vineHi,rng());LFc.push(c.r,c.g,c.b);}
    for(let s=step;s<len;s+=step){const f=s/len,q=T.at(u+0.45*Math.sin(s*0.45+ph),y0-s,0.25+0.4*f*f);
      const c1=lerpC(PAL.vineHi,PAL.vine,f);VL.push(prev[0],prev[1],prev[2],q[0],q[1],q[2]);VC.push(c1.r,c1.g,c1.b,c1.r,c1.g,c1.b);
      if(rng()<(far?0.4:0.65)){LFp.push(q[0]+rand(-.45,.45),q[1]+rand(-.4,.4),q[2]+rand(-.45,.45));const c=lerpC(PAL.leaf,PAL.vineHi,rng()*0.7);LFc.push(c.r,c.g,c.b);}
      prev=q;}}}
const vineObj=new THREE.LineSegments(mkGeo(VL,VC),new THREE.LineBasicMaterial({vertexColors:true}));world.add(vineObj);
const leafObj=rockPoints(LFp,LFc,0.75);world.add(leafObj);

/* ---------- rooftop trees ---------- */
const canopies=[],perches=[];
{const hosts=nearT.slice().sort(()=>rng()-0.5).slice(0,8);
  for(const T of hosts){const r=T.W(rand(-T.w/4,T.w/4),rand(-T.d/4,T.d/4)),base=[r[0],T.roofY-0.5,r[1]],th=rand(3,7),lean=rand(-.6,.6),tc=lerpC(PAL.tLo,PAL.vine,0.6);
    const tp=[base[0]+lean,base[1]+th,base[2]+lean*0.5];seg(base,tp,tc);
    const p=[],col=[],S=rand(0.8,1.25);
    for(let l=0;l<5;l++){const lc=[tp[0]+rand(-3.5,3.5)*S,tp[1]+rand(0,3.5)*S,tp[2]+rand(-3.5,3.5)*S],R=rand(2,4.2)*S;seg(tp,lc,tc);
      for(let i=0;i<70;i++){const u=rand(0,6.28),v=Math.acos(rand(-1,1)),rr=R*Math.pow(rng(),0.35);const y=rr*Math.cos(v)*0.7;
        p.push(lc[0]+rr*Math.sin(v)*Math.cos(u)-base[0],lc[1]+y-base[1],lc[2]+rr*Math.sin(v)*Math.sin(u)-base[2]);const c=lerpC(PAL.canopy,PAL.canopyHi,MU.clamp(0.25+y/R*0.6+rand(-.2,.2),0,1));col.push(c.r,c.g,c.b);}}
    const o=rockPoints(p,col,0.95);o.position.set(base[0],base[1],base[2]);world.add(o);canopies.push({o,ph:rand(0,6.28)});
    perches.push([tp[0],tp[1]+5*S,tp[2]]);}}

/* ---------- masts and antennas (some bent, some broken) + warning lamps ---------- */
const lampP=[],lampPh=[];
function mast(b,H,bend,lattice,broken){const dir=rand(0,6.28),dx=Math.cos(dir),dz=Math.sin(dir),bAt=rand(0.45,0.8),mc=lerpC(PAL.rust,PAL.tHi,0.55),gc=lerpC(PAL.tLo,PAL.tHi,0.6);
  let p=b.slice(),ang=0;const pts=[p];
  for(let s=1;s<=H;s++){const f=s/H;if(f>bAt)ang=Math.min(bend,ang+bend*0.25);const np=[p[0]+Math.sin(ang)*dx,p[1]+Math.cos(ang),p[2]+Math.sin(ang)*dz];seg(p,np,mc);
    if(s%3===0&&rng()<0.8){const L=rand(0.8,2.2)*(1-f*0.6);seg([np[0]+dz*L,np[1],np[2]-dx*L],[np[0]-dz*L,np[1],np[2]+dx*L],mc);}
    p=np;pts.push(p);}
  if(lattice){const n=Math.floor(H*bAt),R=0.8;for(let k=0;k<3;k++){const a0=k*2.094,a1=a0+2.094;for(let s=0;s<n;s+=2){const y=b[1]+s;
      seg([b[0]+R*Math.cos(a0),y,b[2]+R*Math.sin(a0)],[b[0]+R*Math.cos(a0),y+2,b[2]+R*Math.sin(a0)],mc);seg([b[0]+R*Math.cos(a0),y,b[2]+R*Math.sin(a0)],[b[0]+R*Math.cos(a1),y+2,b[2]+R*Math.sin(a1)],mc);}}}
  const g=pts[Math.floor(pts.length*0.55)];for(let k=0;k<3;k++){const a=dir+k*2.1+0.5;seg(g,[b[0]+6*Math.cos(a),b[1],b[2]+6*Math.sin(a)],gc);}
  if(broken){let q=p;for(let s=1;s<=8;s++){const nq=[p[0]+0.5*s*dx*0.4,p[1]-s*1.1,p[2]+0.5*s*dz*0.4];seg(q,nq,gc);q=nq;}}
  else{lampP.push(p[0],p[1]+0.4,p[2]);lampPh.push(rng());}
  if(H>18){const m=pts[Math.floor(pts.length*0.5)];lampP.push(m[0],m[1],m[2]);lampPh.push(rng());}}
for(const T of towers){const far=T.tier==='far',n=T.tier==='core'?(rng()<0.6?2:1):(rng()<(far?0.6:0.55)?1:0);
  for(let i=0;i<n;i++){const r=T.W(rand(-T.w/3,T.w/3),rand(-T.d/3,T.d/3)),H=far?rand(20,46):T.tier==='core'?rand(12,34):rand(8,22);
    mast([r[0],T.roofY-1,r[1]],Math.round(H),rng()<0.42?rand(0.35,1.35):0,H>22&&rng()<0.6,rng()<0.18);}}

/* ---------- rusted girders between towers ---------- */
function edgeToward(A,B){const dx=B.cx-A.cx,dz=B.cz-A.cz,L=Math.hypot(dx,dz);return [A.cx+dx/L*Math.min(A.w,A.d)*0.5,A.cz+dz/L*Math.min(A.w,A.d)*0.5];}
const pairs=[];for(let i=0;i<nearT.length;i++)for(let j=i+1;j<nearT.length;j++){const A=nearT[i],B=nearT[j],dd=Math.hypot(A.cx-B.cx,A.cz-B.cz);pairs.push({A,B,dd});}
pairs.sort((a,b)=>a.dd-b.dd);
{let made=0;for(const pr of pairs){if(made>=10||pr.dd>62)break;const nG=rng()<0.4?2:1;
  for(let g=0;g<nG;g++){const y=rand(14,Math.min(pr.A.minTop,pr.B.minTop)*0.85),pa=edgeToward(pr.A,pr.B),pb=edgeToward(pr.B,pr.A),broken=rng()<0.35,span=broken?rand(0.35,0.7):1,drop=broken?rand(2,8):0;
    const L=Math.hypot(pb[0]-pa[0],pb[1]-pa[1]),n=Math.max(4,Math.round(L*span/2.6)),rc=()=>lerpC(PAL.rust,PAL.rustHi,rng()*0.5);
    const P=(s,dy)=>{const f=s*span;return [pa[0]+(pb[0]-pa[0])*f,y+dy-drop*s*s,pa[1]+(pb[1]-pa[1])*f];};
    for(let k=0;k<n;k++){const s0=k/n,s1=(k+1)/n,a1=P(s0,1.2),a2=P(s1,1.2),b1=P(s0,-1.2),b2=P(s1,-1.2);seg(a1,a2,rc());seg(b1,b2,rc());seg(k%2?a1:b1,k%2?b2:a2,rc());seg(a1,b1,rc());}
    made++;}}}

/* ---------- cables (static, dangling, swaying) and chains ---------- */
const catP=(a,b,sag,s)=>[a[0]+(b[0]-a[0])*s,a[1]+(b[1]-a[1])*s-sag*4*s*(1-s),a[2]+(b[2]-a[2])*s];
function anchor(A,B,y){const e=edgeToward(A,B);return [e[0],y,e[1]];}
const cablePairs=pairs.filter(p=>p.dd<95);
for(let i=0;i<28;i++){const pr=pick(cablePairs),mt=Math.min(pr.A.minTop,pr.B.minTop),a=anchor(pr.A,pr.B,rand(10,mt)),b=anchor(pr.B,pr.A,MU.clamp(a[1]+rand(-12,12),8,mt)),cc=lerpC(PAL.cable,PAL.tHi,rng()*0.5);
  if(rng()<0.25){let q=a;const dx=(b[0]-a[0])/pr.dd,dz=(b[2]-a[2])/pr.dd,L=rand(8,22);for(let s=1;s<=14;s++){const f=s/14,nq=[a[0]+dx*6*Math.sqrt(f),a[1]-L*f*f,a[2]+dz*6*Math.sqrt(f)];seg(q,nq,cc);q=nq;}}

    const x=v.ax+v.nx*out+v.tx*tg,y=v.ay-f*v.len,z=v.az+v.nz*out+v.tz*tg;svP[i*6]=x0;svP[i*6+1]=y0;svP[i*6+2]=z0;svP[i*6+3]=x;svP[i*6+4]=y;svP[i*6+5]=z;x0=x;y0=y;z0=z;i++;}}svGeo.attributes.position.needsUpdate=true;}
  // tree canopies sway
  for(const cn of canopies){cn.o.rotation.z=0.025*Math.sin(t*0.9+cn.ph);cn.o.rotation.x=0.02*Math.sin(t*0.7+cn.ph*1.3);}
  // spirit motes
  for(let i=0;i<MN;i++){const m=motes[i];m.h+=m.v*dt*0.6;if(m.h>48)m.h=1;moPos[i*3]=m.x+1.5*Math.sin(t*0.3+m.ph);moPos[i*3+1]=waterY+m.h;moPos[i*3+2]=m.z+1.5*Math.cos(t*0.27+m.ph);}
  moGeo.attributes.position.needsUpdate=true;moteObj.material.opacity=0.25+0.6*par.star;
  // stars twinkle
  if(par.star>0.01){const arr=stars.geometry.attributes.color.array;for(let i=0;i<starPh.length;i++){const tw=0.5+0.5*Math.sin(t*1.2+starPh[i]);arr[i*3]=starBase[i*3]*tw;arr[i*3+1]=starBase[i*3+1]*tw;arr[i*3+2]=starBase[i*3+2]*tw;}stars.geometry.attributes.color.needsUpdate=true;}
  updSpirits(t,dt);
  renderer.render(scene,camera);}
animate();
</script></body></html>
