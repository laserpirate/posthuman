<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poems of Future Subsidence (study)</title>
<style>
  :root{--bg:#0A0D12;--silver:#D8DEE6;--pale:#AEBCCA;--moon:#F0F4F8;--cream:#ECEAE0;
    --mono:'DM Mono','Courier New',ui-monospace,monospace;--serif:Cambria,Georgia,'Times New Roman',serif;}
  *{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--cream)}
  #c{display:block;width:100vw;height:100vh;cursor:grab}#c:active{cursor:grabbing}
  .ui{position:fixed;pointer-events:none;user-select:none;z-index:10}
  #title{top:26px;left:28px;max-width:66vw}
  #title h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(20px,2.5vw,32px);line-height:1.12;margin:0;text-shadow:0 2px 40px #000,0 0 60px rgba(174,188,202,.2)}
  #title .sub{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--pale);opacity:.9;margin-top:11px}
  #legend{bottom:24px;left:28px;font-family:var(--mono);font-size:11px;line-height:1.9;opacity:.86;text-shadow:0 1px 12px #000}
  #legend .row{display:flex;align-items:center;gap:10px}#legend .sw{width:11px;height:11px;border-radius:2px;flex:0 0 auto}#legend .v{opacity:.55}
  #foot{bottom:22px;right:26px;text-align:right;font-family:var(--mono);font-size:10px;letter-spacing:.08em;opacity:.4}
  #tt{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:20;pointer-events:auto;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);background:rgba(20,26,34,.5);border:1px solid rgba(174,188,202,.35);border-radius:20px;padding:8px 16px;backdrop-filter:blur(6px)}
  #tt.off{opacity:.5;border-color:rgba(174,188,202,.18)}
  #hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:12px;letter-spacing:.1em;opacity:0;transition:opacity .6s;text-transform:uppercase;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="title"><h1>Poems of Future Subsidence.</h1>
  <div class="sub">VA·NA · vana-kodama study &nbsp;·&nbsp; the land keeps drafting, and slowly settling, its own contour</div></div>
<div class="ui" id="legend"></div><div id="hint">drag to look · scroll closer</div>
<button id="tt">◉ turntable</button>
<div class="ui" id="foot">SymbiOS™ | Inflorescence Intelligence™ · study, provisional name</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Poems of Future Subsidence — abstract contour-line topography. A field of
   isolines undulates and slowly SUBSIDES (sinks, then recovers); a void-moon with
   faint rings hangs above; the field recedes to a bright horizon. r128. */
const PAL={bg:0x0A0D12,silver:0xD8DEE6,pale:0xAEBCCA,dim:0x4A5563,dark:0x1A2028,moon:0xF0F4F8,moonLo:0x9AA6B2,spirit:0xE6ECF2,mist:0xC4D0DC};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng=mulberry32(20260716);
const rand=(a=0,b=1)=>a+(b-a)*rng(),lerpC=(c1,c2,t)=>new THREE.Color(c1).lerp(new THREE.Color(c2),t),MU=THREE.MathUtils,ss=x=>{x=MU.clamp(x,0,1);return x*x*(3-2*x);};
function glowSprite(){const s=64,cv=document.createElement('canvas');cv.width=cv.height=s;const g=cv.getContext('2d'),gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.28,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(cv);}
const GLOW=glowSprite();
function glowPoints(pos,col,size,op){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));return new THREE.Points(g,new THREE.PointsMaterial({size,vertexColors:true,map:GLOW,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));}
const scene=new THREE.Scene();scene.background=new THREE.Color(PAL.bg);scene.fog=new THREE.FogExp2(0x9DAAB8,0.0052);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,5000);
const renderer=new THREE.WebGLRenderer({canvas:c,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
const world=new THREE.Group();scene.add(world);

/* bright horizon band */
{const p=[],col=[];for(let i=0;i<1600;i++){const x=rand(-200,200),z=-165+rand(-8,8),y=rand(2,20);p.push(x,y,z);const c=lerpC(PAL.mist,PAL.moon,rng());col.push(c.r,c.g,c.b);}world.add(glowPoints(p,col,1.2,0.4));}

/* CONTOUR FIELD — many isolines, animated + subsiding */
function hf(x,z,t){let h=7*Math.sin(x*0.028+z*0.02)+5*Math.sin(x*0.016-z*0.031+1.3)+3*Math.sin(x*0.05+0.7);h+=2.2*Math.sin(x*0.04+t*0.5+z*0.012)+1.5*Math.cos(z*0.05-t*0.3);return h;}
const P=140,XW=150;const lines=[];
function mkLine(z,near){const pos=new Float32Array(P*3),col=new Float32Array(P*3);
  const base=near?PAL.dark:lerpC(PAL.dim,PAL.silver,MU.clamp(1-(-z)/165,0,1));
  for(let i=0;i<P;i++){const c=new THREE.Color(base);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const o=new THREE.Line(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:near?0.85:0.7}));world.add(o);lines.push({z,near,pos,geo:g});}
for(let z=-160;z<=6;z+=3.4)mkLine(z,z>0);           // field + a few dark foreground ridges

/* void-moon with faint rings */
(function(){const cx=34,cy=64,cz=-120,R=15;const p=[],col=[],N=(R*R*6)|0;for(let i=0;i<N;i++){const u=rand(0,6.28),v=Math.acos(rand(-1,1)),x=R*Math.sin(v)*Math.cos(u),y=R*Math.cos(v),z=R*Math.sin(v)*Math.sin(u);const cr=0.5+0.5*Math.sin(x*0.5)*Math.cos(y*0.4);const c=lerpC(PAL.moonLo,PAL.moon,MU.clamp(0.5+0.5*cr,0.35,1));p.push(cx+x,cy+y,cz+z);col.push(c.r,c.g,c.b);}world.add(glowPoints(p,col,1.4,0.9));
  for(let ring=0;ring<3;ring++){const rp=[],rc=[],RR=R*(1.4+ring*0.5);for(let k=0;k<120;k++){const a=k/120*Math.PI*2;rp.push(cx+RR*Math.cos(a),cy+RR*Math.sin(a),cz);const c=new THREE.Color(PAL.pale);rc.push(c.r,c.g,c.b);}world.add(glowPoints(rp,rc,0.8,0.28-ring*0.06));}})();

/* sparse drifting spirits */
const spirits=[];
function makeSpirit(){const g=new THREE.Group();const hp=[],hc=[];for(let i=0;i<64;i++){const u=rand(0,6.28),v=Math.acos(rand(-1,1)),r=1.8*(0.9+rand(0,0.1));hp.push(r*Math.sin(v)*Math.cos(u),r*Math.cos(v)+2,r*Math.sin(v)*Math.sin(u));const c=new THREE.Color(PAL.spirit);hc.push(c.r,c.g,c.b);}const head=glowPoints(hp,hc,1.3,0);g.add(head);g.visible=false;world.add(g);const sp={g,head,state:'wait',timer:rand(0,6),op:0};spirits.push(sp);repos(sp);return sp;}
function repos(sp){sp.g.position.set(rand(-80,80),rand(6,30),rand(-120,-10));}
for(let i=0;i<4;i++)makeSpirit();
function updSpirits(t,dt){for(const sp of spirits){sp.timer-=dt;
  if(sp.state==='wait'){if(sp.timer<=0){sp.state='in';sp.timer=1.6;sp.g.visible=true;}}
  else if(sp.state==='in'){sp.op=MU.clamp(sp.op+dt/1.6,0,1);if(sp.timer<=0){sp.state='hold';sp.timer=rand(3,6);}}
  else if(sp.state==='hold'){if(sp.timer<=0){sp.state='out';sp.timer=1.8;}}
  else if(sp.state==='out'){sp.op=MU.clamp(sp.op-dt/1.8,0,1);if(sp.timer<=0){sp.state='wait';sp.timer=rand(3,7);sp.g.visible=false;repos(sp);}}
  sp.head.material.opacity=0.7*sp.op;sp.g.position.y+=Math.sin(t*0.5+sp.g.position.x)*0.01;}}

/* color-breath + turntable */
const tint=new THREE.Color(),CYC=36;
function updTint(t){const p=(t%CYC)/CYC;let s,l;if(p<0.34){s=0;l=0.82;}else if(p<0.56){const k=ss((p-0.34)/0.22);s=k;l=MU.lerp(0.82,0.6,k);}else if(p<0.72){s=1;l=0.6;}else if(p<0.86){const k=ss((p-0.72)/0.14);s=1;l=MU.lerp(0.6,0.06,k);}else{const k=ss((p-0.86)/0.14);s=1-k;l=MU.lerp(0.06,0.82,k);}tint.setHSL((0.55+p*0.9+t*0.008)%1,s,l);scene.traverse(o=>{if(o.material&&o.material.color)o.material.color.copy(tint);});}
let turntable=true;const ttBtn=document.getElementById('tt');ttBtn.addEventListener('click',()=>{turntable=!turntable;ttBtn.textContent=(turntable?'◉':'○')+' turntable';ttBtn.classList.toggle('off',!turntable);});

/* subsidence loop */
const SUBP=42,SUBAMP=11;
function subsidence(t){const tp=(t%SUBP)/SUBP;let s;if(tp<0.38)s=ss(tp/0.38);else if(tp<0.62)s=1;else s=ss(1-(tp-0.62)/0.38);return -SUBAMP*s;}

/* camera */
const target=new THREE.Vector3(0,12,-46);let camA=Math.PI*0.5,camR=104,camY=46,drag=false,px=0,py=0;
c.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;});addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;camA-=(e.clientX-px)*.004;camY=MU.clamp(camY-(e.clientY-py)*.35,18,92);px=e.clientX;py=e.clientY;});
addEventListener('wheel',e=>{camR=MU.clamp(camR+e.deltaY*.05,60,200);},{passive:true});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
document.getElementById('legend').innerHTML=[[PAL.silver,'contour field','drafting itself'],[PAL.dim,'the subsidence','it settles, and recovers'],[PAL.moon,'the void-moon','ringed, watching'],[PAL.mist,'the horizon','where lines dissolve']]
  .map(r=>`<div class="row"><span class="sw" style="background:#${new THREE.Color(r[0]).getHexString()};box-shadow:0 0 10px #${new THREE.Color(r[0]).getHexString()}"></span><span>${r[1]}</span><span class="v">${r[2]}</span></div>`).join('');
const hint=document.getElementById('hint');hint.style.opacity=1;setTimeout(()=>hint.style.opacity=0,4200);

/* animate */
const clock=new THREE.Clock();let last=0;
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime(),dt=Math.min(0.05,t-last);last=t;
  if(turntable&&!drag)camA+=0.0006;camera.position.set(Math.cos(camA)*camR,camY,-46+Math.sin(camA)*camR);camera.lookAt(target);
  const sub=subsidence(t);
  for(const ln of lines){const pos=ln.pos;for(let i=0;i<P;i++){const x=-XW+ (i/(P-1))*2*XW;const y=hf(x,ln.z,t)+(ln.near?0:sub);pos[i*3]=x;pos[i*3+1]=y+(ln.near?-2:0);pos[i*3+2]=ln.z;}ln.geo.attributes.position.needsUpdate=true;}
  updSpirits(t,dt);
  updTint(t);renderer.render(scene,camera);}
animate();
</script>
</body>
</html>
