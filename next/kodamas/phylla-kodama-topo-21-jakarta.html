<script>
/* Jakarta 2046 — the megalopolis as circuit. Streets are traces, towers are

const PAL={board:0x0C1612,trace:0x1E6656,traceHi:0x3AC8A0,pad:0x2E9A7C,
  water:0x123634,waterHi:0x2E8C8C,cur:0x4EC8B0,bio:0x74D6AE,

  head:0xDFF6FF,tail:0xFF5A4A,rail:0x8FE0FF,gold:0xF6C544,
  moon:0xF4F6F8,moonLo:0xAEB8B6,pale:0xAEC2BC,sun:0xFFC080,rain:0xAEC8C4,foam:0xCFEFE8};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const rand=(a=0,b=1)=>a+(b-a)*rng(),pick=a=>a[(rng()*a.length)|0],lerpC=(c1,c2,t)=>new THREE.Color(c1).lerp(new THREE.Color(c2),t),MU=THREE.MathUtils,ss=x=>{x=MU.clamp(x,0,1);return x*x*(3-2*x);};
function glowSprite(){const s=64,cv=document.createElement('canvas');cv.width=cv.height=s;const g=cv.getContext('2d'),gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.28,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(cv);}
const GLOW=glowSprite();
function mkGeo(pos,col){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));return g;}

function dynBuf(n){const a=new Float32Array(n*3),g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));return {a,g};}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070C0A);scene.fog=new THREE.FogExp2(0x070C0A,0.0034);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,4000);
const renderer=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
const world=new THREE.Group();scene.add(world);

/* the board — dark substrate */
{const p=[],col=[];for(let x=-124;x<=124;x+=5)for(let z=-124;z<=124;z+=5){if(z<-98)continue;p.push(x+rand(-1,1),0.05,z+rand(-1,1));const c=lerpC(0x060B09,PAL.board,rng()*0.6);col.push(c.r,c.g,c.b);}
 world.add(new THREE.Points(mkGeo(p,col),new THREE.PointsMaterial({size:0.8,vertexColors:true,transparent:true,opacity:0.75})));}

/* STREET CIRCUIT — trace grid + pads + travelling pulses */
let traceMat,padMat;
{const p=[],col=[];const push=(x1,z1,x2,z2,hex)=>{p.push(x1,0.25,z1,x2,0.25,z2);const c=new THREE.Color(hex);for(let e=0;e<2;e++)col.push(c.r,c.g,c.b);};
 for(let x=-120;x<=120;x+=24)push(x,-96,x,124,PAL.trace);
 for(let z=-96;z<=120;z+=24)push(-124,z,124,z,PAL.trace);
 for(let x=-124;x<=124;x+=8){if(((x+124)%24)===0)continue;push(x,-96,x,124,0x123A30);}
 for(let z=-96;z<=124;z+=8){if(((z+96)%24)===0)continue;push(-124,z,124,z,0x123A30);}
 const o=lineSegs(p,col,0.5);traceMat=o.material;world.add(o);}
{const p=[],col=[];for(let x=-120;x<=120;x+=24)for(let z=-96;z<=120;z+=24){p.push(x,0.32,z);const c=new THREE.Color(PAL.pad);col.push(c.r,c.g,c.b);}
 const o=glowPoints(p,col,1.4,0.5);padMat=o.material;world.add(o);}
const TP=150,tps=[],{a:tpPos,g:tpGeo}=dynBuf(TP),tpCol=new Float32Array(TP*3);
for(let i=0;i<TP;i++){const axis=rng()<0.5?0:1,coord=-120+24*((rng()*11)|0);tps.push({axis,coord,s:rng(),spd:rand(0.001,0.003)*(rng()<0.5?1:-1)});const c=lerpC(PAL.traceHi,PAL.bio,rng());tpCol[i*3]=c.r;tpCol[i*3+1]=c.g;tpCol[i*3+2]=c.b;}
tpGeo.setAttribute('color',new THREE.BufferAttribute(tpCol,3));
const tpulse=new THREE.Points(tpGeo,new THREE.PointsMaterial({size:1.3,vertexColors:true,map:GLOW,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false}));world.add(tpulse);

/* ROUNDABOUTS — pads with rings; Bundaran HI with its fountain column */
let fountMat;
{const p=[],col=[];for(const [rx,rz,R] of [[0,24,6.5],[-48,-24,5],[48,48,5],[72,-48,4.5],[-72,24,4.5],[24,-72,4.5]]){
  const n=(2*Math.PI*R/0.9)|0;for(let k=0;k<n;k++){const a=k/n*Math.PI*2;p.push(rx+R*Math.cos(a),0.35,rz+R*Math.sin(a));const c=lerpC(PAL.traceHi,PAL.pad,rng()*0.4);col.push(c.r,c.g,c.b);}}
 world.add(glowPoints(p,col,1.1,0.7));}
{const p=[],col=[];for(let k=0;k<8;k++){p.push(0,0.6+k*0.5,24);const c=lerpC(PAL.gold,0xFFFFFF,k/8);col.push(c.r,c.g,c.b);}
 const o=glowPoints(p,col,1.6,0.9);fountMat=o.material;world.add(o);}

/* MONAS — the golden pin at her heart */
let flameMat;
{const p=[],col=[];for(const s of [[-1.2,-1.2],[1.2,-1.2],[-1.2,1.2],[1.2,1.2]]){p.push(-8+s[0],1,-10+s[1],-8+s[0]*0.22,23,-10+s[1]*0.22);const c=new THREE.Color(0xC8C4B8);for(let e=0;e<2;e++)col.push(c.r,c.g,c.b);}
 world.add(lineSegs(p,col,0.8));
 const rp=[],rc=[];for(let k=0;k<30;k++){const a=k/30*Math.PI*2;rp.push(-8+7*Math.cos(a),0.35,-10+7*Math.sin(a));const c=new THREE.Color(PAL.pad);rc.push(c.r,c.g,c.b);}
 world.add(glowPoints(rp,rc,1.0,0.55));
 const f=glowPoints([-8,24,-10],[...new THREE.Color(PAL.gold).toArray()],4.5,0.95);flameMat=f.material;world.add(f);}

/* TOWER JUNGLE — wireframe components, windows, beacons */
const canalFns=[u=>[ -140+200*u, -20+150*u+14*Math.sin(u*5)],u=>[ 140-190*u, -6+140*u-12*Math.sin(u*4.2)],u=>[ -24+10*Math.sin(u*6), 64-176*u]];
const canalSamp=[];for(const f of canalFns)for(let s=0;s<=20;s++)canalSamp.push(f(s/20));
function nearCanal(x,z){for(const q of canalSamp){const dx=x-q[0],dz=z-q[1];if(dx*dx+dz*dz<49)return true;}return false;}
const winArr=[],winColArr=[],beacons=[];
{const p=[],col=[];let placed=0,tries=0;
 while(placed<160&&tries<900){tries++;
  const spine=rng()<0.55;const cx=spine?rand(-30,30):rand(-118,118),cz=spine?rand(-78,72):rand(-92,118);
  if(cz<-92||nearCanal(cx,cz))continue;
  const h=spine?rand(12,44):rand(5,18),w=rand(1.6,3.6);
  const cc=lerpC(PAL.twr,PAL.twrHi,MU.clamp(h/44,0,1));
  for(const s of [[-w,-w],[w,-w],[-w,w],[w,w]]){p.push(cx+s[0],0.3,cz+s[1],cx+s[0],h,cz+s[1]);for(let e=0;e<2;e++)col.push(cc.r,cc.g,cc.b);}
  const tq=[[-w,-w,w,-w],[w,-w,w,w],[w,w,-w,w],[-w,w,-w,-w]];
  for(const q of tq){p.push(cx+q[0],h,cz+q[1],cx+q[2],h,cz+q[3]);for(let e=0;e<2;e++)col.push(cc.r,cc.g,cc.b);}
  if(h>24)for(const q of tq){p.push(cx+q[0],h*0.55,cz+q[1],cx+q[2],h*0.55,cz+q[3]);for(let e=0;e<2;e++)col.push(cc.r*0.7,cc.g*0.7,cc.b*0.7);}
  const nw=2+((rng()*3)|0);for(let k=0;k<nw;k++){winArr.push(cx+rand(-w,w),rand(2,h*0.92),cz+(rng()<0.5?w:-w)*1.02);const c=new THREE.Color(rng()<0.55?PAL.winW:PAL.winC);winColArr.push(c.r,c.g,c.b);}
  if(h>34)beacons.push([cx,h+0.8,cz,rand(0,6.28)]);
  placed++;}
 world.add(lineSegs(p,col,0.6));}
const windows=glowPoints(winArr,winColArr,1.2,0.85);world.add(windows);
const bcN=beacons.length,{a:bcPos,g:bcGeo}=dynBuf(bcN),bcCol=new Float32Array(bcN*3);
for(let i=0;i<bcN;i++){bcPos[i*3]=beacons[i][0];bcPos[i*3+1]=beacons[i][1];bcPos[i*3+2]=beacons[i][2];const c=new THREE.Color(PAL.beacon);bcCol[i*3]=c.r;bcCol[i*3+1]=c.g;bcCol[i*3+2]=c.b;}
bcGeo.setAttribute('color',new THREE.BufferAttribute(bcCol,3));
const beaconPts=new THREE.Points(bcGeo,new THREE.PointsMaterial({size:1.6,vertexColors:true,map:GLOW,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false}));world.add(beaconPts);

/* kampung memory-fields — dense low districts between the components */
{const p=[],col=[];for(let d=0;d<12;d++){let cx,cz,tries=0;do{cx=rand(-108,108);cz=rand(-84,108);tries++;}while(nearCanal(cx,cz)&&tries<20);
  const W=rand(10,20),D=rand(8,16);for(let x=-W;x<=W;x+=1.5)for(let z=-D;z<=D;z+=1.5){if(rng()<0.2)continue;p.push(cx+x+rand(-.3,.3),0.9+rand(0,0.5),cz+z+rand(-.3,.3));const c=lerpC(0x5A3220,0xB0662E,rng()*0.6);col.push(c.r,c.g,c.b);}}
 world.add(new THREE.Points(mkGeo(p,col),new THREE.PointsMaterial({size:0.8,vertexColors:true,transparent:true,opacity:0.8})));}

/* HIGHWAYS — elevated arteries + the JORR ring + traffic */
const HWS=[
 {fn:u=>new THREE.Vector3(-140+280*u,6+2*Math.sin(u*3),-40+18*Math.sin(u*2.2)),n:80},
 {fn:u=>new THREE.Vector3(-140+280*u,7,52-26*u+14*Math.sin(u*3)),n:80},
 {fn:u=>new THREE.Vector3(30+20*Math.sin(u*2.5),5.5+2.5*Math.sin(u*4),-130+260*u),n:80},
 {fn:u=>new THREE.Vector3(84*Math.cos(u*Math.PI*2),6,10+84*Math.sin(u*Math.PI*2)),n:150,ring:true}];
{const p=[],col=[];for(const H of HWS){let prevL=null,prevR=null;
  for(let s=0;s<=140;s++){const u=s/140,q=H.fn(u),q2=H.fn(Math.min(1,u+0.004));let tx=q2.x-q.x,tz=q2.z-q.z;const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;const px=-tz,pz=tx;

    if(prevL){p.push(prevL[0],prevL[1],prevL[2],L[0],L[1],L[2],prevR[0],prevR[1],prevR[2],R[0],R[1],R[2]);const c=new THREE.Color(0x2E6A7A);for(let e=0;e<4;e++)col.push(c.r,c.g,c.b);}

    if(s%14===0&&q.z>-96){p.push(q.x,q.y,q.z,q.x,0.3,q.z);const c=new THREE.Color(0x1E3A44);for(let e=0;e<2;e++)col.push(c.r,c.g,c.b);}}}
 world.add(lineSegs(p,col,0.55));}
let TN=0;for(const H of HWS)TN+=H.n;
const cars=[],{a:carPos,g:carGeo}=dynBuf(TN),carCol=new Float32Array(TN*3);
{let i=0;for(const H of HWS)for(let k=0;k<H.n;k++){const dir=rng()<0.5?1:-1;cars.push({H,u:rng(),dir,spd:rand(0.0009,0.0018)});
  const c=new THREE.Color(dir>0?PAL.head:PAL.tail);carCol[i*3]=c.r;carCol[i*3+1]=c.g;carCol[i*3+2]=c.b;i++;}}

const traffic=new THREE.Points(carGeo,new THREE.PointsMaterial({size:1.2,vertexColors:true,map:GLOW,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false}));world.add(traffic);

/* trains — two transit traces with running light-strings */
const railFns=[u=>new THREE.Vector3(-124+248*u,2.4,-58+6*Math.sin(u*3)),u=>new THREE.Vector3(-58+4*Math.sin(u*4),2.4,-124+248*u)];
{const p=[],col=[];for(const f of railFns){let prev=null;for(let s=0;s<=90;s++){const q=f(s/90);if(q.z<-96&&Math.abs(q.x)<200&&f===railFns[1]&&q.z<-96){prev=q;continue;}if(prev){p.push(prev.x,prev.y,prev.z,q.x,q.y,q.z);const c=new THREE.Color(0x1E4A56);for(let e=0;e<2;e++)col.push(c.r,c.g,c.b);}prev=q;}}

const TRN=7,trains=[{f:railFns[0],u:0.2},{f:railFns[1],u:0.7}],{a:trPos,g:trGeo}=dynBuf(TRN*2),trCol=new Float32Array(TRN*2*3);

trGeo.setAttribute('color',new THREE.BufferAttribute(trCol,3));

/* THE CANALS — the water layer of the board */
const canals=[];
{const p=[],col=[];for(const f of canalFns){for(let s=0;s<=90;s++){const u=s/90,q=f(u);if(q[1]<-98)continue;
   for(const w of [-1.8,-0.6,0.6,1.8]){p.push(q[0],0.3,q[1]+w);const c=lerpC(PAL.water,PAL.waterHi,0.2+0.3*rng());col.push(c.r,c.g,c.b);}}}
 world.add(glowPoints(p,col,1.1,0.5));}
for(const f of canalFns){const S=80,pos=new Float32Array(S*3),cl=new Float32Array(S*3);
 for(let k=0;k<S;k++){const c=lerpC(PAL.cur,PAL.bio,rng()*0.5);cl[k*3]=c.r;cl[k*3+1]=c.g;cl[k*3+2]=c.b;}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(cl,3));
 world.add(new THREE.Line(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.55,blending:THREE.AdditiveBlending,depthWrite:false})));
 canals.push({f,pos,geo:g,base:cl.slice(),phase:rand(0,6.28)});}

/* banjir flood layer — the water that takes the board */
const fpP=[],fpC=[],fpPh=[];for(let x=-124;x<=124;x+=7)for(let z=-96;z<=124;z+=7){fpP.push(x,0.3,z);fpPh.push(rand(0,6.28));const c=lerpC(PAL.water,PAL.waterHi,0.15+0.25*rng());fpC.push(c.r,c.g,c.b);}

{const R=10,p=[],col=[];for(let i=0;i<(R*R*7|0);i++){const u=rand(0,6.28),v=Math.acos(rand(-1,1)),x=R*Math.sin(v)*Math.cos(u),y=R*Math.cos(v),z=R*Math.sin(v)*Math.sin(u);const cr=0.5+0.5*Math.sin(x*0.5)*Math.cos(y*0.4);const c=lerpC(PAL.moonLo,PAL.moon,MU.clamp(0.55+0.45*cr,0.4,1));p.push(MC.x+x,MC.y+y,MC.z+z);col.push(c.r,c.g,c.b);}

{const R0=300,N=48,linP=[],linC=[],dots=[],dotCol=[];

  const wtr=par.wtr;phaseEl.textContent='— '+NAMES[Math.round(P*4)%4]+' · air '+((wtr*100)|0)+'% —';

    if(q.axis===0){tpPos[i*3]=q.coord;tpPos[i*3+2]=c2;}else{tpPos[i*3]=-124+248*q.s;tpPos[i*3+2]=q.coord;}tpPos[i*3+1]=0.4;}

  {const arr=bcGeo.attributes.color ? bcGeo.attributes.color.array : null;if(arr)for(let i=0;i<bcN;i++){const bl=Math.pow(0.5+0.5*Math.sin(t*2.2+beacons[i][3]),6);arr[i*3]=1.0*bl;arr[i*3+1]=0.29*bl;arr[i*3+2]=0.23*bl;}bcGeo.attributes.color.needsUpdate=true;}
