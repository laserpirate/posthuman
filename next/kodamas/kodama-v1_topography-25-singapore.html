{const R0=300,N=54,linP=[],linC=[],dots=[],dotCol=[];
 function prof(kind,hw,h){if(kind==='mbs')return [[-hw,0],[-hw,h*0.82],[-hw*1.0,h*0.9],[-hw*0.55,h*0.86],[-hw*0.55,h*0.82],[-hw*0.35,h*0.82],[-hw*0.35,h*0.9],[0,h]];
  if(kind==='lotus')return [[-hw,0],[-hw*0.85,h*0.6],[-hw*0.5,h*0.85],[-hw*0.2,h*0.95],[0,h]];
  if(kind==='stower')return [[-hw,0],[-hw*0.8,h*0.3],[-hw*0.95,h*0.34],[-hw*0.7,h*0.62],[-hw*0.85,h*0.66],[-hw*0.5,h*0.9],[0,h]];
  if(kind==='stree')return [[-hw*0.2,0],[-hw*0.2,h*0.6],[-hw,h*0.85],[-hw*0.5,h*0.95],[0,h]];
  return [[-hw*0.6,0],[-hw*0.6,h*0.5],[-hw*0.3,h*0.75],[0,h]];}
 for(let i=0;i<N;i++){const a=i/N*Math.PI*2,bx=R0*Math.cos(a),bz=R0*Math.sin(a),tx=-Math.sin(a),tz=Math.cos(a);
  const r=rng();let kind,h,hw,dcol;
  if(r<0.14){kind='mbs';h=rand(26,34);hw=rand(12,16);dcol=new THREE.Color(PAL.win);}
  else if(r<0.26){kind='lotus';h=rand(10,16);hw=rand(8,12);dcol=new THREE.Color(0xD8DEE0);}
  else if(r<0.56){kind='stower';h=rand(30,54);hw=rand(6,9);dcol=new THREE.Color(PAL.greenHi);}
  else if(r<0.76){kind='stree';h=rand(12,20);hw=rand(6,9);dcol=new THREE.Color(PAL.bio);}
  else{kind='spire';h=rand(24,44);hw=rand(4,7);dcol=new THREE.Color(0x8FD8E8);}
  const half=prof(kind,hw,h),full=half.concat(half.slice(0,-1).reverse().map(q=>[-q[0],q[1]]));
  for(const q of full){linP.push(bx+tx*q[0],q[1],bz+tz*q[0]);const c=lerpC(0x2E6E6E,0x6E9AC8,MU.clamp(q[1]/50,0,1));linC.push(c.r,c.g,c.b);}
  linP.push(R0*Math.cos(a+Math.PI/N),0,R0*Math.sin(a+Math.PI/N));linC.push(0.28,0.42,0.42);
  for(let k=0;k<3;k++){dots.push(bx+tx*rand(-hw*0.6,hw*0.6),rand(h*0.2,h*0.8),bz+tz*rand(-hw*0.6,hw*0.6));dotCol.push(dcol.r,dcol.g,dcol.b);}}
 const eo=new THREE.LineLoop(mkGeo(linP,linC),new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.28,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));skyEdgeMat=eo.material;skyline.add(eo);
 const do2=new THREE.Points(mkGeo(dots,dotCol),new THREE.PointsMaterial({size:1.1,vertexColors:true,map:GLOW,transparent:true,opacity:0.4,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));skyDotMat=do2.material;skyline.add(do2);}

/* climate cycle */
const CK=[
 {p:0.00,sky:0x22343A,moonO:0.4,veil:0.3,rain:0.0,wtr:0.15,star:0.25,win:0.45,ref:0.5,chop:0.7,sunO:0.55,fire:0.1,spl:0.5},
 {p:0.25,sky:0x28343C,moonO:0.12,veil:0.9,rain:1.0,wtr:0.5,star:0.0,win:0.6,ref:0.3,chop:1.5,sunO:0.1,fire:0.0,spl:0.8},
 {p:0.50,sky:0x12262E,moonO:0.65,veil:0.4,rain:0.35,wtr:1.0,star:0.5,win:0.7,ref:0.7,chop:1.1,sunO:0.0,fire:0.3,spl:1.0},
 {p:0.75,sky:0x0A141A,moonO:1.0,veil:0.25,rain:0.0,wtr:0.5,star:1.0,win:1.0,ref:1.0,chop:0.7,sunO:0.0,fire:1.0,spl:0.6}];
function cparams(p){p=((p%1)+1)%1;let i=0;for(let k=0;k<CK.length;k++)if(CK[k].p<=p)i=k;const A=CK[i],B=CK[(i+1)%CK.length];let span=B.p-A.p;if(span<=0)span+=1;let f=(p-A.p);if(f<0)f+=1;f=ss(f/span);const o={};for(const k2 of ['moonO','veil','rain','wtr','star','win','ref','chop','sunO','fire','spl'])o[k2]=MU.lerp(A[k2],B[k2],f);o.sky=lerpC(A.sky,B.sky,f);return o;}
let P=0.75,auto=true,targetP=0.75;const NAMES=['dry season','monsoon','the flood','night'];
document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(b.dataset.m==='auto')auto=true;else{auto=false;targetP=parseFloat(b.dataset.m);}}));
let turntable=true;const ttBtn=document.getElementById('tt');ttBtn.addEventListener('click',()=>{turntable=!turntable;ttBtn.textContent=(turntable?'◉':'○')+' turntable';ttBtn.classList.toggle('on',turntable);});
const phaseEl=document.getElementById('phase');
const target=new THREE.Vector3(0,20,-20);let camA=Math.PI*0.5,camR=120,camY=18,drag=false,px=0,py=0;
c.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;});addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;camA-=(e.clientX-px)*.005;camY=MU.clamp(camY-(e.clientY-py)*.4,5,96);px=e.clientX;py=e.clientY;});
addEventListener('wheel',e=>{camR=MU.clamp(camR+e.deltaY*.05,60,200);},{passive:true});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
document.getElementById('legend').innerHTML=[[PAL.foam,'the barrier','the sea, poured politely'],[PAL.greenHi,'garden towers','green all the way up'],[PAL.bio,'supertrees','her newer canopy'],[PAL.win,'the Flyer','still turning, slowly']]
  .map(r=>`<div class="row"><span class="sw" style="background:#${new THREE.Color(r[0]).getHexString()};box-shadow:0 0 10px #${new THREE.Color(r[0]).getHexString()}"></span><span>${r[1]}</span><span class="v">${r[2]}</span></div>`).join('');

const clock=new THREE.Clock();let last=0;
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime(),dt=Math.min(0.05,t-last);last=t;
  if(turntable&&!drag)camA+=0.0007;camera.position.set(Math.cos(camA)*camR,camY,Math.sin(camA)*camR);camera.lookAt(target);
  if(auto)P=(P+dt/108)%1;else{let d=((targetP-P+0.5)%1+1)%1-0.5;P=((P+d*Math.min(1,dt*1.4))%1+1)%1;}
  const par=cparams(P);scene.background.copy(par.sky);scene.fog.color.copy(par.sky);
  moonMat.opacity=0.9*par.moonO*(1-0.5*par.veil);haloMat.opacity=0.26*par.moonO*(1-0.4*par.veil);sunMat.opacity=0.8*par.sunO;starMat.opacity=0.85*par.star;
  mbsWin.opacity=0.2+0.7*par.win;stWin.opacity=0.15+0.6*par.win;for(const m of strees)m.opacity=0.35+0.55*par.fire;
  rainObj.material.opacity=0.5*par.rain;moonRef.material.opacity=0.5*par.ref*par.moonO;
  waterY=1.0+par.wtr*5.5;const chop=par.chop,outerY=waterY+3.4+par.wtr*2.2;
  phaseEl.textContent='— '+NAMES[Math.round(P*4)%4]+' · flood '+((par.wtr*100)|0)+'% —';
  const sSc=MU.clamp(0.72*Math.pow(camR/110,1.5),0.32,2.0);skyline.position.set(camera.position.x,0,camera.position.z);skyline.scale.setScalar(sSc);skyEdgeMat.opacity=0.24+0.06*Math.sin(t*0.25);skyDotMat.opacity=0.34;
  for(let i=0;i<wN;i++)wPos[i*3+1]=waterY+chop*0.4*Math.sin(t*1.4+wPh[i]);wGeo.attributes.position.needsUpdate=true;
  {const arr=outerMat.geometry.attributes.position.array;for(let i=0;i<arr.length/3;i++)arr[i*3+1]=outerY+chop*0.5*Math.sin(t*1.2+i);outerMat.geometry.attributes.position.needsUpdate=true;}
  for(const L of curLines){const arr=L.pos,ca=L.geo.attributes.color.array;for(let k=0;k<CLP;k++){const x=-130+k/(CLP-1)*260,z=L.z0+8*Math.sin(x*0.02+t*0.25+L.phase)+3*Math.sin(x*0.05-t*0.15);arr[k*3]=x;arr[k*3+1]=waterY+0.6;arr[k*3+2]=z;const pulse=0.4+0.6*Math.max(0,Math.sin(t*0.8-x*0.05+L.phase));ca[k*3]=L.base[k*3]*pulse;ca[k*3+1]=L.base[k*3+1]*pulse;ca[k*3+2]=L.base[k*3+2]*pulse;}L.geo.attributes.position.needsUpdate=true;L.geo.attributes.color.needsUpdate=true;}
  {let idx=0;for(const R of ripState){R.rr+=R.spd;if(R.rr>R.max){R.rr=0;R.x=rand(-80,80);R.z=rand(-80,80);R.max=rand(16,38);}const fade=1-R.rr/R.max;for(let k=0;k<RRP;k++){const a=k/RRP*Math.PI*2;ripPos[idx*3]=R.x+R.rr*Math.cos(a);ripPos[idx*3+1]=waterY+0.4;ripPos[idx*3+2]=R.z+R.rr*Math.sin(a);const c=ripGeo.attributes.color.array;c[idx*3]=0.22*fade;c[idx*3+1]=0.5*fade;c[idx*3+2]=0.5*fade;idx++;}}ripGeo.attributes.position.needsUpdate=true;ripGeo.attributes.color.needsUpdate=true;}
  for(let i=0;i<refN;i++){const r=refItems[i];refPos[i*3]=MC.x*0.55+r.xj+2.5*Math.sin(t*2+r.ph);refPos[i*3+1]=waterY+0.5;refPos[i*3+2]=r.z*0.9;}refGeo.attributes.position.needsUpdate=true;
  // spillway pours from the barrier rim to the basin
  for(let i=0;i<SN;i++){const s=spill[i];s.y-=s.vy*par.spl;if(s.y<waterY){s.y=10.4;s.a=rand(A0,A1);}const inw=RB-(10.4-s.y)*0.5;spPos[i*3]=inw*Math.cos(s.a);spPos[i*3+1]=s.y;spPos[i*3+2]=inw*Math.sin(s.a);}spGeo.attributes.position.needsUpdate=true;
  for(let i=0;i<FMN;i++){const f=fmPh[i],rr=RB-4.6;fmPos[i*3]=rr*Math.cos(f.a);fmPos[i*3+1]=waterY+0.4+0.3*Math.sin(t*3+f.ph);fmPos[i*3+2]=rr*Math.sin(f.a);}fmGeo.attributes.position.needsUpdate=true;
  flyer.rotation.z=t*0.05;
  for(const pd of pods){pd.o.position.y=waterY-1+0.25*Math.sin(t*0.8+pd.ph);pd.o.rotation.y=Math.sin(t*0.1+pd.ph)*0.2;}
  if(par.rain>0.02)for(let i=0;i<raN;i++){const p2=ra[i];p2.y-=p2.v*2.6;p2.x-=p2.v*0.5;if(p2.y<waterY){p2.y=100;p2.x=rand(-140,140);}raPos[i*6]=p2.x;raPos[i*6+1]=p2.y;raPos[i*6+2]=p2.z;raPos[i*6+3]=p2.x-1.2;raPos[i*6+4]=p2.y-4.5;raPos[i*6+5]=p2.z;}raGeo.attributes.position.needsUpdate=true;
  for(const cb of cloudBands){const arr=cb.o.geometry.attributes.position.array,B=cb.base,off=(t*(cb.near?2.2:1.3))%(cb.w*4)-cb.w*2;for(let i=0;i<arr.length/3;i++)arr[i*3]=B[i*3]+off;cb.o.geometry.attributes.position.needsUpdate=true;if(cb.near)cb.o.material.opacity=(0.3+0.18*Math.sin(t*0.3+cb.cx))*(0.4+0.6*par.moonO);}
  {const arr=stars.geometry.attributes.color.array;for(let i=0;i<starPh.length;i++){const tw=0.5+0.5*Math.sin(t*1.2+starPh[i]);arr[i*3]=starBase[i*3]*tw;arr[i*3+1]=starBase[i*3+1]*tw;arr[i*3+2]=starBase[i*3+2]*tw;}stars.geometry.attributes.color.needsUpdate=true;}
  for(let i=0;i<fiN;i++){const f=fi[i];f.x+=0.04*Math.sin(t*0.5+f.ph);f.z+=0.04*Math.cos(t*0.4+f.ph);fiPos[i*3]=f.x;fiPos[i*3+1]=f.y+2*Math.sin(t*0.5+f.ph);fiPos[i*3+2]=f.z;const pu=Math.pow(0.5+0.5*Math.sin(t*f.freq+f.ph),3)*par.fire;fiCol[i*3]=fireC.r*pu;fiCol[i*3+1]=fireC.g*pu;fiCol[i*3+2]=fireC.b*pu;}fiGeo.attributes.position.needsUpdate=true;fiGeo.attributes.color.needsUpdate=true;
  renderer.render(scene,camera);}
animate();
</script></body></html>
