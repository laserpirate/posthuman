<script>
/* hanging city — the under-city turned over and hung from the bottom of the cloud sea.
   Rusted spires root into the cloud deck and point down into open air, each ending in a
   platform whose huts hang beneath it. Pipes, roots, cables and chains dangle out of the
   cloud; walkways and conduits strung between the spires; drips and pipe spill fall away
   into nothing. Below it all, three giant moons sit low in the haze.
   TIME: dawn/day/dusk/night. FLOOD: the cloud deck thickens and sags over the spires,
   mammatus lobes deepen, rain-veils and drips fall from it.
   Original artwork © Marko Manriquez, all rights reserved. r128. */
const PAL={rustLo:0x1C1209,rust:0x4E3018,rustHi:0x96643A,girder:0x684828,gold:0xE0B060,cream:0xF4E4BC,
  moonLo:0x6E6048,halo:0xE6D2A4,vine:0x2E3A1E,vineHi:0x84903E,root:0x2A1C10,rootHi:0x6A5230,
  win:0xFFD08A,winCool:0xBFE8E0,tip:0x9FF2E2,tipWarm:0xFF9A50,sea:0xCFC6AC,mote:0xE4F6F0,pale:0xB4C6C0,
  pipe:0x1A1109,pipeHi:0x8A5A32,moss:0x2E3A1E,mossHi:0x7E8C40,drip:0xD6F0E8,cable:0x0A0A08};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng=mulberry32(20261033);
const rand=(a=0,b=1)=>a+(b-a)*rng(),pick=a=>a[(rng()*a.length)|0],lerpC=(c1,c2,t)=>new THREE.Color(c1).lerp(new THREE.Color(c2),t),MU=THREE.MathUtils,ss=x=>{x=MU.clamp(x,0,1);return x*x*(3-2*x);},C=h=>new THREE.Color(h);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function glowSprite(){const s=64,cv=document.createElement('canvas');cv.width=cv.height=s;const g=cv.getContext('2d'),gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.28,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(cv);}
const GLOW=glowSprite();
/* additive glow fades INTO the fog instead of adding fog colour */
const FOGFADE=THREE.ShaderChunk.fog_fragment.replace(/gl_FragColor\.rgb\s*=\s*mix\([^;]*\);/,'gl_FragColor.rgb *= (1.0-fogFactor);');
function addFade(m){m.onBeforeCompile=sh=>{sh.fragmentShader=sh.fragmentShader.replace('#include <fog_fragment>',FOGFADE);};return m;}
function mkGeo(pos,col){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));return g;}
function glowPoints(pos,col,size,op){return new THREE.Points(mkGeo(pos,col),addFade(new THREE.PointsMaterial({size,vertexColors:true,map:GLOW,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true})));}
function rockPoints(pos,col,size,op){return new THREE.Points(mkGeo(pos,col),new THREE.PointsMaterial({size,vertexColors:true,transparent:true,opacity:op||0.92}));}
function dynBuf(n){const a=new Float32Array(n*3),g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));return {a,g};}
function dynCol(g,n){const a=new Float32Array(n*3);g.setAttribute('color',new THREE.BufferAttribute(a,3));return a;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0A1A1C);scene.fog=new THREE.FogExp2(0x0A1A1C,0.0028);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,4000);
const renderer=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
const world=new THREE.Group();scene.add(world);
let seaY=0;

/* ---------- accumulators: spire shells, fine detail, static lines, windows, tip lights, hanging strands ---------- */
const S={p:[],c:[]},D={p:[],c:[]},L={p:[],c:[]},W={p:[],c:[],ph:[]},T={p:[],c:[],per:[],ph:[]},vines=[],decks=[],DSRC=[];
function pt(B,x,y,z,col){B.p.push(x,y,z);B.c.push(col.r,col.g,col.b);}
function seg(x1,y1,z1,x2,y2,z2,c1,c2){c2=c2||c1;L.p.push(x1,y1,z1,x2,y2,z2);L.c.push(c1.r,c1.g,c1.b,c2.r,c2.g,c2.b);}
function win(x,y,z){const c=rng()<0.14?C(PAL.winCool):lerpC(PAL.win,0xFFF0D0,rng()*0.5);W.p.push(x,y,z);W.c.push(c.r,c.g,c.b);W.ph.push(rand(0,6.28));}
function tip(x,y,z,warm){const c=C(warm?PAL.tipWarm:PAL.tip);T.p.push(x,y,z);T.c.push(c.r,c.g,c.b);T.per.push(rand(1.4,3.2));T.ph.push(rand(0,1));}
/* kind 0 vine, 1 root tendril, 2 dangling cable */
function vine(x,y,z,len,kind,sway){vines.push({ax:x,ay:y,az:z,len,kind:kind||0,ph:rand(0,6.28),sway:sway||rand(0.5,1.6)});}
function curve(A,B,sag,n,fn){for(let i=0;i<=n;i++){const u=i/n;fn(MU.lerp(A[0],B[0],u),MU.lerp(A[1],B[1],u)-sag*4*u*(1-u),MU.lerp(A[2],B[2],u),u,i);}}
function cable(A,B,sag,col){let pv=null;curve(A,B,sag,18,(x,y,z)=>{if(pv)seg(pv[0],pv[1],pv[2],x,y,z,col);pv=[x,y,z];});}
function chain(A,B,sag){const len=Math.hypot(B[0]-A[0],B[1]-A[1],B[2]-A[2]),n=Math.max(8,(len/0.55)|0);curve(A,B,sag,n,(x,y,z,u,i)=>{const c=lerpC(PAL.rustLo,i%2?PAL.rustHi:PAL.rust,0.6+0.4*rng());pt(D,x+(i%2?0.12:-0.12),y,z,c);});}
function dangle(x,y,z,len){for(let s=0;s<len;s+=0.55){const c=lerpC(PAL.rustLo,PAL.rustHi,(s/0.55|0)%2?0.7:0.35);pt(D,x,y-s,z,c);}DSRC.push(V(x,y-len,z));}
/* lattice mast from yA to yB (either direction): three legs, rings + zig-zag bracing */
function truss(x,z,yA,yB,r0,r1,step,c1,c2,dots){const rot=rand(0,6.28),n=Math.max(2,Math.round(Math.abs(yB-yA)/step));let prev=null;
  for(let i=0;i<=n;i++){const f=i/n,y=MU.lerp(yA,yB,f),r=MU.lerp(r0,r1,f),cur=[0,1,2].map(k=>[x+r*Math.cos(rot+k*2.094),y,z+r*Math.sin(rot+k*2.094)]),cc=lerpC(c1,c2,f);
    for(let k=0;k<3;k++){const A=cur[k],B=cur[(k+1)%3];seg(A[0],A[1],A[2],B[0],B[1],B[2],cc);}
    if(prev)for(let k=0;k<3;k++){const A=prev[k],B=cur[k],E=cur[(k+1)%3];seg(A[0],A[1],A[2],B[0],B[1],B[2],cc);seg(A[0],A[1],A[2],E[0],E[1],E[2],cc);
      if(dots)for(let s=0.34;s<1;s+=0.33)pt(D,MU.lerp(A[0],B[0],s),MU.lerp(A[1],B[1],s),MU.lerp(A[2],B[2],s),lerpC(PAL.rustLo,PAL.rust,0.5+0.5*rng()));}
    prev=cur;}
  const ap=[x,yB+Math.sign(yB-yA)*step*0.8,z];for(const A of prev)seg(A[0],A[1],A[2],ap[0],ap[1],ap[2],lerpC(c1,c2,1));return ap;}

/* ---------- the inverted spires: rooted in the cloud deck, pointing down ---------- */
const SP=[[0,0,132],[24,-15,104],[-23,11,94],[9,29,80],[-13,-28,100],[38,15,62],[-40,-9,58],[26,-37,72],[-28,33,68],[43,-8,88]]
  .map(a=>({x:a[0],z:a[1],len:a[2],rb:2.8+a[2]/52,seed:rand(0,6.28)}));
function rAt(s,d){const f=MU.clamp(d/s.len,0,1);return s.rb*(1-0.42*f)*(1+0.9*Math.exp(-d/7))*(1+0.6*Math.pow(MU.clamp((d-(s.len-6))/6,0,1),2));}
function surf(s,d,dx,dz){const r=rAt(s,d);return [s.x+dx*r,-d,s.z+dz*r];}
function inSpire(x,z,pad){for(const s of SP)if(Math.hypot(x-s.x,z-s.z)<rAt(s,0)+pad)return true;return false;}
for(const s of SP){
  // ribbed shaft, flaring into roots at the cloud
  for(let d=1.5;d<s.len;d+=1.25){const y=-d,band=(d%13)<1.25,r=rAt(s,d),n=Math.max(10,(2*Math.PI*r/(band?0.7:1.35))|0),f=d/s.len;
    for(let k=0;k<n;k++){const a=k/n*Math.PI*2,rr=r*(1+0.1*Math.cos(4*a+s.seed))+rand(-.08,.08);let c;
      if(band)c=lerpC(PAL.rust,PAL.rustHi,0.3+0.4*rng());
      else if(Math.sin(a*9+s.seed-d*0.02)>0.93)c=lerpC(PAL.rustLo,0x000000,0.4);
      else if(rng()<0.1)c=lerpC(PAL.rust,PAL.rustHi,rng());
      else if(rng()<0.16*(1-f)+0.03)c=lerpC(PAL.vine,PAL.vineHi,rng()*0.6);
      else c=lerpC(PAL.rustLo,PAL.rust,0.25+0.6*rng()*(0.6+0.4*f));
      pt(S,s.x+rr*Math.cos(a),y,s.z+rr*Math.sin(a),c);}}
  for(let k=0;k<4;k++){const a=k*Math.PI/2-s.seed/4;let pv=null;for(let d=2;d<=s.len;d+=6){const r=rAt(s,d)*1.12,q=[s.x+r*Math.cos(a),-d,s.z+r*Math.sin(a)];if(pv)seg(pv[0],pv[1],pv[2],q[0],q[1],q[2],C(PAL.girder));pv=q;}}
  for(let w=0;w<5+(s.len/16|0);w++){const d=rand(8,s.len-3),a=rand(0,6.28),r=rAt(s,d)+0.35;win(s.x+r*Math.cos(a),-d,s.z+r*Math.sin(a));}
  // the platform at the tip; huts hang under it
  const y0=-s.len,rd=s.rb*1.75+rand(1.2,2.8);s.rd=rd;decks.push({x:s.x,y:y0,z:s.z,rd});
  for(let i=0;i<rd*rd*1.5;i++){const r=rd*Math.sqrt(rng()),a=rand(0,6.28);pt(S,s.x+r*Math.cos(a),y0,s.z+r*Math.sin(a),lerpC(PAL.rustLo,PAL.rust,0.4+0.5*rng()));}
  {const n=(2*Math.PI*rd/0.55)|0;for(let k=0;k<n;k++){const a=k/n*Math.PI*2;pt(S,s.x+rd*Math.cos(a),y0-0.5,s.z+rd*Math.sin(a),lerpC(PAL.rust,PAL.rustHi,0.3+0.5*rng()));pt(S,s.x+rd*Math.cos(a),y0,s.z+rd*Math.sin(a),lerpC(PAL.rust,PAL.gold,0.15*rng()));
    if(k%2===0)pt(D,s.x+rd*Math.cos(a),y0+1.5,s.z+rd*Math.sin(a),C(PAL.rustHi));}
   const np=Math.max(10,(2*Math.PI*rd/3)|0);for(let k=0;k<np;k++){const a=k/np*Math.PI*2,a2=(k+1)/np*Math.PI*2;seg(s.x+rd*Math.cos(a),y0,s.z+rd*Math.sin(a),s.x+rd*Math.cos(a),y0+1.5,s.z+rd*Math.sin(a),C(PAL.girder));seg(s.x+rd*Math.cos(a),y0+1.5,s.z+rd*Math.sin(a),s.x+rd*Math.cos(a2),y0+1.5,s.z+rd*Math.sin(a2),C(PAL.girder));}
   for(let k=0;k<8;k++){const a=k/8*Math.PI*2+s.seed,r1=rAt(s,s.len-10);seg(s.x+r1*Math.cos(a),y0+10,s.z+r1*Math.sin(a),s.x+rd*0.95*Math.cos(a),y0+0.4,s.z+rd*0.95*Math.sin(a),C(PAL.girder));}}
  for(let h=0;h<1+(rng()<0.7?1:0)+(rd>10?1:0);h++){const w=rand(2.6,4.8),d=rand(2.6,4.4),hh=rand(2.4,4.4),a=rand(0,6.28),r=rand(0,Math.max(0,rd-4.5)),cx=s.x+r*Math.cos(a),cz=s.z+r*Math.sin(a),ro=rand(0,3.14),ux=Math.cos(ro),uz=Math.sin(ro),vx=-uz,vz=ux;
    const P=(i,j,k)=>[cx+ux*i+vx*j,y0-0.4-k,cz+uz*i+vz*j];
    const nP=((2*(w+d)*hh+w*d)*2.2)|0;for(let i=0;i<nP;i++){const f=(rng()*5)|0;let q;if(f===0)q=P(w/2,rand(-d/2,d/2),rand(0,hh));else if(f===1)q=P(-w/2,rand(-d/2,d/2),rand(0,hh));else if(f===2)q=P(rand(-w/2,w/2),d/2,rand(0,hh));else if(f===3)q=P(rand(-w/2,w/2),-d/2,rand(0,hh));else q=P(rand(-w/2,w/2),rand(-d/2,d/2),hh);
      pt(D,q[0],q[1],q[2],rng()<0.2?lerpC(PAL.rust,PAL.rustHi,rng()):lerpC(PAL.rustLo,PAL.rust,0.4+0.5*rng()));}
    const E=[[-1,-1],[1,-1],[1,1],[-1,1]];for(let k=0;k<4;k++){const A=E[k],B=E[(k+1)%4],a0=P(A[0]*w/2,A[1]*d/2,0),a1=P(A[0]*w/2,A[1]*d/2,hh),b1=P(B[0]*w/2,B[1]*d/2,hh);seg(a0[0],a0[1],a0[2],a1[0],a1[1],a1[2],C(PAL.girder));seg(a1[0],a1[1],a1[2],b1[0],b1[1],b1[2],C(PAL.girder));}
    for(let k=0;k<2+(rng()*3|0);k++){const side=rng()<0.5?1:-1,q=rng()<0.5?P(side*(w/2+0.2),rand(-d/3,d/3),rand(0.6,hh-0.6)):P(rand(-w/3,w/3),side*(d/2+0.2),rand(0.6,hh-0.6));win(q[0],q[1],q[2]);}
    if(rng()<0.65){const ap=P(rand(-w/3,w/3),rand(-d/3,d/3),hh),ht=rand(4,9);seg(ap[0],ap[1],ap[2],ap[0],ap[1]-ht,ap[2],C(PAL.girder));tip(ap[0],ap[1]-ht-0.2,ap[2],rng()<0.3);DSRC.push(V(ap[0],ap[1]-ht-0.4,ap[2]));}}
  // moss beards under the platform + vines off the rim
  for(let m=0;m<2+(rng()*3|0);m++){const a=rand(0,6.28),r=rd*rand(0.55,0.95),mr=rand(1.4,2.8),cx=s.x+r*Math.cos(a),cz=s.z+r*Math.sin(a);
    for(let i=0;i<mr*mr*11;i++){const u=rand(0,6.28),rr=mr*Math.sqrt(rng()),hgt=mr*1.1*Math.sqrt(Math.max(0,1-(rr/mr)**2))*rng();pt(D,cx+rr*Math.cos(u),y0-0.5-hgt,cz+rr*Math.sin(u),lerpC(PAL.vine,PAL.vineHi,rng()*0.8));}}
  for(let v=0;v<4+(rng()*4|0);v++){const a=rand(0,6.28);vine(s.x+rd*Math.cos(a),y0-0.5,s.z+rd*Math.sin(a),rand(5,s.len>95?28:16));}
  // main antenna pointing down
  const mh=s.len>95?rand(26,40):rand(12,24);s.ap=truss(s.x,s.z,y0,y0-mh,1.6,0.3,2.6,C(PAL.rust),C(PAL.rustHi),false);tip(s.ap[0],s.ap[1]-0.4,s.ap[2],false);DSRC.push(V(s.ap[0],s.ap[1]-0.6,s.ap[2]));
  if(mh>18){const ya=y0-mh*0.7;seg(s.x-4.5,ya,s.z,s.x+4.5,ya,s.z,C(PAL.girder));tip(s.x-4.5,ya,s.z,true);tip(s.x+4.5,ya,s.z,true);}
  // roots: crawl out along the cloud underside, then drop
  for(let k=0;k<11+(s.len/14|0);k++){const a=rand(0,6.28);let d=rand(1,7),r=rAt(s,d),x=s.x+r*Math.cos(a),y=-d,z=s.z+r*Math.sin(a),aa=a;const cr=lerpC(PAL.root,PAL.rootHi,rng()*0.6);
    const crawl=4+(rng()*9|0);for(let i=0;i<crawl;i++){aa+=rand(-.35,.35);const st=rand(1.1,2.2),nx=x+st*Math.cos(aa),nz=z+st*Math.sin(aa);if(Math.hypot(nx,nz)>60)break;const ny=MU.clamp(y+rand(-0.7,0.9),-6,-0.5);seg(x,y,z,nx,ny,nz,cr);x=nx;y=ny;z=nz;
      if(rng()<0.22){let bx=x,by=y,bz=z;const bl=rand(3,12);for(let q=0;q<bl;q+=1.8){const qx=bx+rand(-.5,.5),qy=by-1.8,qz=bz+rand(-.5,.5);seg(bx,by,bz,qx,qy,qz,cr);bx=qx;by=qy;bz=qz;}}}
    const drop=rand(3,26);for(let q=0;q<drop;q+=2){const qx=x+rand(-.6,.6),qy=y-2,qz=z+rand(-.6,.6);seg(x,y,z,qx,qy,qz,cr);x=qx;y=qy;z=qz;}
    if(rng()<0.45)vine(x,y,z,rand(4,18),1,rand(0.3,0.9));else DSRC.push(V(x,y-0.2,z));}
}
/* ---------- walkways, conduits, cables, chains between the spires ---------- */

const pourObj=new THREE.Points(poGeo,addFade(new THREE.PointsMaterial({size:0.9,vertexColors:true,map:GLOW,transparent:true,opacity:0.8,blending:THREE.AdditiveBlending,depthWrite:false})));pourObj.frustumCulled=false;world.add(pourObj);
// kodama spirit motes — abstract glow under the platforms, nothing more
const MN=26,motes=[];for(let i=0;i<MN;i++){const d=pick(decks);motes.push({d,a:rand(0,6.28),r:rand(1,d.rd*0.9),h:rand(2,9),sp:rand(0.1,0.35),ph:rand(0,6.28)});}
const {a:mP,g:mGeo}=dynBuf(MN),mCol=dynCol(mGeo,MN);
const moteObj=new THREE.Points(mGeo,addFade(new THREE.PointsMaterial({size:1.6,vertexColors:true,map:GLOW,transparent:true,opacity:0.8,blending:THREE.AdditiveBlending,depthWrite:false})));moteObj.frustumCulled=false;world.add(moteObj);

/* ---------- sky below: three giant moons low in the haze, cloud banks across them, stars. follows the camera ---------- */
const sky=new THREE.Group();scene.add(sky);
const moonPts=[],moonBody=[],moonHalo=[],moonG=[],_q=new THREE.Quaternion();
function moonAlb(x,y,seed,cr){let alb=0.8-0.34*ss((Math.sin(x*3.1+seed)*Math.cos(y*2.4+seed*1.7)+0.45*Math.sin(x*7+y*5+seed))*0.8+0.3);
  alb+=0.05*Math.sin(x*13+seed)*Math.sin(y*11-seed)+0.035*(rng()-0.5);
  for(const k of cr){const dd=Math.hypot(x-k[0],y-k[1])/k[2];if(dd<0.82)alb*=0.8+0.1*dd;else if(dd<1.12)alb+=0.13*(1-Math.abs(dd-0.97)/0.15);}
  return MU.clamp(alb,0,1);}
function moon(R,Dd,th,y,Lx,Ly,Lz,seed){const g=new THREE.Group();g.position.set(Math.cos(th)*Dd,y,Math.sin(th)*Dd);sky.add(g);moonG.push(g);
  const Lv=new THREE.Vector3(Lx,Ly,Lz).normalize(),cr=[],lo=C(PAL.moonLo),hi=C(PAL.cream);
  for(let i=0;i<26;i++){const a=rand(0,6.28),r=Math.sqrt(rng())*0.93;cr.push([r*Math.cos(a),r*Math.sin(a),rand(0.025,0.13)]);}
  const shade=(x,yy)=>{const d2=x*x+yy*yy,nz=Math.sqrt(Math.max(0,1-d2)),lam=Math.max(0,x*Lv.x+yy*Lv.y+nz*Lv.z);return (0.16+0.84*Math.pow(lam,0.7))*(0.7+0.3*nz);};
  const N=R>150?512:256,cv=document.createElement('canvas');cv.width=cv.height=N;const g2=cv.getContext('2d'),im=g2.createImageData(N,N),dd=im.data;
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const x=(i+0.5)/N*2-1,yy=1-(j+0.5)/N*2,d2=x*x+yy*yy,k=(j*N+i)*4;if(d2>1){dd[k+3]=0;continue;}
    const al=moonAlb(x,yy,seed,cr),sh=shade(x,yy);dd[k]=255*Math.min(1,(lo.r+(hi.r-lo.r)*al)*sh);dd[k+1]=255*Math.min(1,(lo.g+(hi.g-lo.g)*al)*sh);dd[k+2]=255*Math.min(1,(lo.b+(hi.b-lo.b)*al)*sh);dd[k+3]=255*MU.clamp((1-Math.sqrt(d2))*N*0.5,0,1);}
  g2.putImageData(im,0,0);
  const body=new THREE.Mesh(new THREE.CircleGeometry(R,72),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true,opacity:1,fog:false,depthWrite:false,depthTest:false}));body.renderOrder=-3;g.add(body);moonBody.push(body.material);
  const hs=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:PAL.halo,transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,fog:false}));hs.scale.set(R*3.6,R*3.6,1);hs.position.z=-4;hs.renderOrder=-4;g.add(hs);moonHalo.push(hs.material);
  const p=[],col=[],n=(R>150?2400:R>90?1000:400);
  for(let i=0;i<n;i++){const r=Math.sqrt(rng())*0.98,a=rand(0,6.28),x=r*Math.cos(a),yy=r*Math.sin(a),sh=shade(x,yy);if(sh<0.12&&rng()<0.7)continue;const cc=lerpC(PAL.moonLo,PAL.cream,moonAlb(x,yy,seed,cr)).multiplyScalar(sh*0.36);p.push(x*R,yy*R,0.6);col.push(cc.r,cc.g,cc.b);}
  const m=new THREE.Points(mkGeo(p,col),new THREE.PointsMaterial({size:R/30,vertexColors:true,map:GLOW,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,fog:false}));m.renderOrder=-2;g.add(m);moonPts.push(m.material);}
// lit from above (the sun is somewhere over the cloud sea)
moon(270,800,0.08,-150,0.35,0.75,0.45,1.3);
moon(118,720,-0.62,-232,-0.45,0.8,0.3,4.1);
moon(80,660,0.66,-72,0.5,0.7,0.5,2.2);
// cloud banks drawn over the moons (normal blend: they veil, not glow)
const banks=[],bankMats=[];
function bank(th0,th1,y,ys,n,size,Dd,op){const p=[],col=[];for(let i=0;i<n;i++){const a=rand(th0,th1),r=Dd+rand(-20,20),yy=y+ys*(rng()+rng()+rng()-1.5)*0.8*(1-0.5*Math.abs((a-(th0+th1)/2)/((th1-th0)/2)));p.push(Math.cos(a)*r,yy,Math.sin(a)*r);const b=0.7+0.3*rng();col.push(b,b,b);}
  const o=new THREE.Points(mkGeo(p,col),new THREE.PointsMaterial({size,vertexColors:true,map:GLOW,transparent:true,opacity:op,depthWrite:false,depthTest:false,fog:false,color:0x203030}));o.renderOrder=-1;sky.add(o);banks.push({o,ph:rand(0,6.28),amp:rand(0.04,0.09),sp:rand(0.012,0.03)});bankMats.push({m:o.material,op});}
bank(-0.8,0.95,-176,24,700,46,640,0.5);
bank(-0.95,-0.3,-238,10,240,34,630,0.42);
bank(0.35,1.0,-90,9,220,30,620,0.42);
bank(-1.4,1.4,-300,22,620,56,650,0.6);
let stars,starBase,starPh;
{const p=[],col=[],ph=[];for(let i=0;i<520;i++){const u=rand(-1.7,1.7),v=-rand(0.0,1.0),R=950;p.push(R*Math.cos(v)*Math.cos(u),R*Math.sin(v),R*Math.cos(v)*Math.sin(u));const b=0.4+0.6*rng(),cc=lerpC(PAL.pale,0xFFF6E8,rng());col.push(cc.r*b,cc.g*b,cc.b*b);ph.push(rand(0,6.28));}
  starBase=new Float32Array(col);starPh=ph;stars=new THREE.Points(mkGeo(p,col),new THREE.PointsMaterial({size:2.6,vertexColors:true,map:GLOW,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,fog:false}));stars.renderOrder=-5;sky.add(stars);}

/* ---------- TIME + FLOOD (cloud deck sag) ---------- */
const TK=[
 {p:0.00,sky:0x5E5056,ceil:0x4A4044,bank:0x86706C,tint:0xF6D0AC,seaT:0xFFD8C0,gain:1.0, moonO:0.75,halo:0.28,star:0.25,lit:0.78,lights:0.5, sea:0.85,wisp:0.14},
 {p:0.25,sky:0x86ACA4,ceil:0x6E8E86,bank:0xB4CCC2,tint:0xFFF6E2,seaT:0xF4FFF6,gain:1.1, moonO:0.42,halo:0.12,star:0.0, lit:1.0, lights:0.14,sea:1.05,wisp:0.11},
 {p:0.50,sky:0x4C2C1C,ceil:0x3C2216,bank:0x6E3E22,tint:0xFFB070,seaT:0xFFC090,gain:1.05,moonO:0.88,halo:0.38,star:0.35,lit:0.72,lights:0.8, sea:0.78,wisp:0.13},
 {p:0.75,sky:0x0A1C1E,ceil:0x0C1E20,bank:0x12302E,tint:0xEAF2DE,seaT:0xCFEAE2,gain:1.12,moonO:1.0, halo:0.32,star:1.0, lit:0.52,lights:1.0, sea:0.62,wisp:0.1}];
function tparams(p){p=((p%1)+1)%1;let i=0;for(let k=0;k<TK.length;k++)if(TK[k].p<=p)i=k;const A=TK[i],B=TK[(i+1)%TK.length];let span=B.p-A.p;if(span<=0)span+=1;let f=(p-A.p);if(f<0)f+=1;f=ss(f/span);
  const o={};for(const k2 of ['gain','moonO','halo','star','lit','lights','sea','wisp'])o[k2]=MU.lerp(A[k2],B[k2],f);for(const k2 of ['sky','ceil','bank','tint','seaT'])o[k2]=lerpC(A[k2],B[k2],f);return o;}
let P=0.72,timeAuto=true,targetP=0.72,F=0.4,floodAuto=true,targetF=0.4,boost=0,fPh=-0.2,fallT=0;
const NAMES=['dawn','day','dusk','night'];
function grpSet(sel,btn){document.querySelectorAll(sel).forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
document.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{grpSet('[data-t]',b);if(b.dataset.t==='auto'){timeAuto=true;boost=2;}else{timeAuto=false;targetP=parseFloat(b.dataset.t);}}));
document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{grpSet('[data-f]',b);if(b.dataset.f==='auto'){floodAuto=true;fPh=F>0.5?-Math.PI/2:Math.PI/2;}else{floodAuto=false;targetF=parseFloat(b.dataset.f);}}));
let turntable=true;const ttBtn=document.getElementById('tt');ttBtn.addEventListener('click',()=>{turntable=!turntable;ttBtn.textContent=(turntable?'◉':'○')+' turntable';ttBtn.classList.toggle('on',turntable);});
const phaseEl=document.getElementById('phase');

/* camera — under the cloud deck, looking up at the hanging city with the moons low behind it */
const target=new THREE.Vector3(0,-72,0);
let camA=Math.PI*0.3,camR=200,camY=-104,drag=false,px=0,py=0;
c.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;});addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;camA-=(e.clientX-px)*.005;camY=MU.clamp(camY-(e.clientY-py)*.4,-170,-66);px=e.clientX;py=e.clientY;});
addEventListener('wheel',e=>{camR=MU.clamp(camR+e.deltaY*.05,130,320);},{passive:true});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
document.getElementById('legend').innerHTML=[[PAL.cream,'three moons','low in the haze below'],[PAL.rustHi,'the spires','hung point-down from the cloud'],[PAL.rootHi,'roots, pipes, cables','dangling into open air'],[PAL.sea,'the cloud deck','sags and rains with the flood'],[PAL.tip,'tip lights','still blinking']]
  .map(r=>`<div class="row"><span class="sw" style="background:#${new THREE.Color(r[0]).getHexString()};box-shadow:0 0 10px #${new THREE.Color(r[0]).getHexString()}"></span><span>${r[1]}</span><span class="v">${r[2]}</span></div>`).join('');

/* ---------- animate ---------- */
const clock=new THREE.Clock();let last=0;const _c=new THREE.Color(),_w=new THREE.Color(1,1,1);
function animate(){requestAnimationFrame(animate);
  if(turntable&&!drag)camA+=0.0007;
  camera.position.set(Math.cos(camA)*camR,camY,Math.sin(camA)*camR);camera.lookAt(target);
  const t=clock.getElapsedTime(),dt=Math.min(0.05,t-last);last=t;
  if(timeAuto){P=(P+dt/120+boost*dt*0.08)%1;boost=Math.max(0,boost-dt);}else{let d=((targetP-P+0.5)%1+1)%1-0.5;P=((P+d*Math.min(1,dt*1.4))%1+1)%1;}
  if(floodAuto){fPh+=dt*0.05;F+=((0.5+0.5*Math.sin(fPh))-F)*Math.min(1,dt*0.8);}else F+=(targetF-F)*Math.min(1,dt*1.2);
  const par=tparams(P);seaY=-F*22;const sag=4+32*F;
  scene.background.copy(par.sky);scene.fog.color.copy(par.sky);scene.fog.density=0.0026+0.0012*F;
  // sky follows the camera; moons hold low behind the city with a slow sway
  sky.position.copy(camera.position);sky.rotation.y=-(camA+Math.PI)+0.1*Math.sin(t*0.021);sky.updateMatrixWorld();
  _q.copy(sky.quaternion).invert().multiply(camera.quaternion);for(const g of moonG)g.quaternion.copy(_q);
  for(const m of moonPts){m.opacity=0.3+0.7*par.moonO;m.color.copy(par.tint).multiplyScalar(par.gain);}
  for(const m of moonBody){m.opacity=0.45+0.55*par.moonO;m.color.copy(par.tint).multiplyScalar(par.gain);}
  for(const m of moonHalo){m.opacity=par.halo;m.color.copy(par.tint);}
  for(const b of bankMats){b.m.color.copy(par.bank);b.m.opacity=b.op;}
  for(const b of banks)b.o.rotation.y=b.amp*Math.sin(t*b.sp+b.ph);
  stars.material.opacity=0.9*par.star;
  // city
  _c.copy(par.tint).lerp(_w,0.6).multiplyScalar(par.lit);
  spireObj.material.color.copy(_c);detailObj.material.color.copy(_c);solid.material.color.copy(_c);linesObj.material.color.setScalar(0.6+0.5*par.lit);vineObj.material.color.setScalar(0.6+0.5*par.lit);
  // the cloud deck
  ceil.material.color.copy(par.ceil);ceil.position.y=seaY+1.5;
  SEAU.uT.value=t;SEAU.uSea.value=seaY;SEAU.uDrift.value=t*1.6;SEAU.uB.value=par.sea;SEAU.uMam.value=3+16*F;SEAU.uSag.value=sag;SEAU.uTint.value.copy(par.seaT);THICK.value=0.5+2.4*F;
  fallT+=dt*(0.6+1.2*F);VIRU.uFall.value=fallT;VIRU.uSea.value=seaY;VIRU.uSag.value=sag;virga.material.opacity=0.02+0.3*F;virga.material.color.copy(par.seaT).multiplyScalar(0.5+0.5*par.sea);
  wisps.material.opacity=par.wisp*(0.7+0.8*F);
  phaseEl.textContent='— '+NAMES[Math.round(P*4)%4]+' · cloud deck '+((F*100)|0)+'% —';
  // windows flicker
  {const arr=windows.geometry.attributes.color.array,g=0.15+0.85*par.lights;for(let i=0;i<winN;i++){const fl=g*(0.7+0.3*Math.sin(t*1.3+W.ph[i]))*(Math.sin(t*7.1+W.ph[i]*13)>0.985?0.3:1);arr[i*3]=winBase[i*3]*fl;arr[i*3+1]=winBase[i*3+1]*fl;arr[i*3+2]=winBase[i*3+2]*fl;}windows.geometry.attributes.color.needsUpdate=true;}
  // tip lights blink
  {const arr=tips.geometry.attributes.color.array,g=0.35+0.65*par.lights;for(let i=0;i<tipN;i++){const ph=(t/T.per[i]+T.ph[i])%1,on=ph<0.14?1:0.12;arr[i*3]=tipBase[i*3]*on*g;arr[i*3+1]=tipBase[i*3+1]*on*g;arr[i*3+2]=tipBase[i*3+2]*on*g;}tips.geometry.attributes.color.needsUpdate=true;
   tipHalo.material.opacity=0.35*par.lights;}
  // wisps drift between spires (sink with the deck)
  {let k=0;for(let w=0;w<WSP.length;w++){const s=WSP[w];s.x+=s.v*dt;if(s.x>190)s.x=-190;const cy=seaY-sag*0.4-s.dy;for(let i=0;i<WPN;i++,k++){wsP[k*3]=s.x+wOff[k*3]*s.sx;wsP[k*3+1]=cy+wOff[k*3+1]*s.sy;wsP[k*3+2]=s.z+wOff[k*3+2]*s.sz;}}wsGeo.attributes.position.needsUpdate=true;}
  // drips: bead, let go, fall, fade into the haze (more of them as the deck soaks)
  {const rate=0.35+1.3*F,dc=C(PAL.drip);for(let i=0;i<DN;i++){const d=DR[i];let hx=d.s.x,hy,hz=d.s.z,bri;
    if(!d.f){d.w-=dt*rate;hy=d.s.y-0.1*(1-Math.max(0,Math.min(1,d.w)));bri=0.3+0.4*(1-Math.max(0,Math.min(1,d.w)));if(d.w<=0){d.f=true;d.y=d.s.y;d.vy=0;}}
    else{d.vy=Math.min(d.vy+30*dt,46);d.y-=d.vy*dt;hy=d.y;const fd=(d.s.y-d.y)/d.fall;bri=Math.max(0,1-fd);if(fd>=1){d.f=false;d.s=pick(DSRC);d.w=rand(0.5,4.5);d.fall=rand(40,120);hx=d.s.x;hz=d.s.z;hy=d.s.y;bri=0.3;}}
    drPos[i*3]=hx;drPos[i*3+1]=hy;drPos[i*3+2]=hz;drCol[i*3]=dc.r*bri;drCol[i*3+1]=dc.g*bri;drCol[i*3+2]=dc.b*bri;
    const len=d.f?Math.min(2.2,d.vy*0.07):0;drLn[i*6]=hx;drLn[i*6+1]=hy+len;drLn[i*6+2]=hz;drLn[i*6+3]=hx;drLn[i*6+4]=hy;drLn[i*6+5]=hz;
    drLc[i*6]=drLc[i*6+1]=drLc[i*6+2]=0.05*bri;drLc[i*6+3]=dc.r*bri;drLc[i*6+4]=dc.g*bri;drLc[i*6+5]=dc.b*bri;}
   drGeo.attributes.position.needsUpdate=true;drGeo.attributes.color.needsUpdate=true;drLnGeo.attributes.position.needsUpdate=true;drLnGeo.attributes.color.needsUpdate=true;}
  // spill from the broken mains (heavier in flood)
  {const Tf=4.2,pb=(0.35+0.65*F)*(0.55+0.45*par.sea);let k=0;for(const po of POURS)for(let i=0;i<PN;i++,k++){const s=PR[k];s.age+=dt;if(s.age>Tf)s.age-=Tf;const a=s.age,sp=po.r*0.5+a*1.1,fade=Math.pow(1-a/Tf,1.5)*pb*poB[k];
    poPos[k*3]=po.p.x+s.j1*sp;poPos[k*3+1]=po.p.y-0.5*20*a*a+s.j3*0.5;poPos[k*3+2]=po.p.z+s.j2*sp;poCol[k*3]=0.84*fade;poCol[k*3+1]=0.94*fade;poCol[k*3+2]=0.9*fade;}
   poGeo.attributes.position.needsUpdate=true;poGeo.attributes.color.needsUpdate=true;}
  // motes
  {for(let i=0;i<MN;i++){const m=motes[i];m.a+=m.sp*dt;mP[i*3]=m.d.x+m.r*Math.cos(m.a);mP[i*3+1]=m.d.y-m.h+0.8*Math.sin(t*0.9+m.ph);mP[i*3+2]=m.d.z+m.r*Math.sin(m.a);const b=(0.35+0.65*Math.max(0,Math.sin(t*0.6+m.ph)))*(0.3+0.7*par.lights);mCol[i*3]=0.89*b;mCol[i*3+1]=0.96*b;mCol[i*3+2]=0.94*b;}mGeo.attributes.position.needsUpdate=true;mGeo.attributes.color.needsUpdate=true;}
  // hanging strands sway (long cables swing slower)
  {let i=0;for(const v of vines){let pv0=v.ax,pv1=v.ay,pv2=v.az;const sl=v.kind===2?0.35:1;for(let s=1;s<=VS;s++){const f=s/VS,x=v.ax+v.sway*f*Math.sin(t*0.7*sl+v.ph-f*1.4),y=v.ay-f*v.len,z=v.az+v.sway*0.5*f*Math.cos(t*0.6*sl+v.ph);vP[i*6]=pv0;vP[i*6+1]=pv1;vP[i*6+2]=pv2;vP[i*6+3]=x;vP[i*6+4]=y;vP[i*6+5]=z;pv0=x;pv1=y;pv2=z;i++;}}vGeo.attributes.position.needsUpdate=true;}
  // stars twinkle
  if(par.star>0.01){const arr=stars.geometry.attributes.color.array;for(let i=0;i<starPh.length;i++){const tw=0.5+0.5*Math.sin(t*1.2+starPh[i]);arr[i*3]=starBase[i*3]*tw;arr[i*3+1]=starBase[i*3+1]*tw;arr[i*3+2]=starBase[i*3+2]*tw;}stars.geometry.attributes.color.needsUpdate=true;}
  renderer.render(scene,camera);}
animate();
