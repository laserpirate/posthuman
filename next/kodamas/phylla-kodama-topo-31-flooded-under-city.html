/* cut faces (solid, with the sewer and conduit openings) + bottom */
{const pos=[],idx=[];for(const f of FACES){const s=new THREE.Shape();s.moveTo(-B,BOT);s.lineTo(B,BOT);s.lineTo(B,0);s.lineTo(-B,0);s.lineTo(-B,BOT);for(const h of f.h)s.holes.push(holePath(h,new THREE.Path()));shapeWorld(s,f,0,pos,idx);}

  for(const h of HOLES_ST){const p=new THREE.Path();p.absarc(h.x,-h.z,h.r,0,Math.PI*2,true);s.holes.push(p);}

{const p=[],col=[],S=0.9;

/* ---------- solids under the street: sewers, cistern, shafts, conduits, pipes (one merged mesh) ---------- */
const MG={p:[],c:[],i:[]},_up=V(0,1,0),PIPES=[];
function grid(nu,nv,pos,colF,skip){const base=MG.p.length/3,W=nu+1;
  for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){const P=pos(i,j);MG.p.push(P.x,P.y,P.z);const cc=colF(P,i,j);MG.c.push(cc.r,cc.g,cc.b);}
  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){if(skip&&skip(i+0.5,j+0.5))continue;const a=base+j*W+i;MG.i.push(a,a+1,a+W,a+1,a+W+1,a+W);}}
function tube(path,r,seg,colF,rot){rot=rot||0;const base=MG.p.length/3,n=path.length;let N=null;
  for(let k=0;k<n;k++){const T=new THREE.Vector3().subVectors(path[Math.min(n-1,k+1)],path[Math.max(0,k-1)]).normalize();
    if(!N)N=Math.abs(T.y)>0.9?V(1,0,0):_up.clone();N.sub(T.clone().multiplyScalar(N.dot(T))).normalize();const Bn=new THREE.Vector3().crossVectors(T,N);
    for(let j=0;j<seg;j++){const an=j/seg*Math.PI*2+rot,dir=N.clone().multiplyScalar(Math.cos(an)).add(Bn.clone().multiplyScalar(Math.sin(an)));
      const P=path[k].clone().addScaledVector(dir,r);MG.p.push(P.x,P.y,P.z);const cc=colF(k/((n-1)||1),dir.y,P);MG.c.push(cc.r,cc.g,cc.b);}}
  for(let k=0;k<n-1;k++)for(let j=0;j<seg;j++){const a=base+k*seg+j,b=base+k*seg+(j+1)%seg;MG.i.push(a,a+seg,b,b,a+seg,b+seg);}}

const flCol=(u,up)=>cPipe.clone().lerp(cRustHi,0.25+0.4*ss(up*0.5+0.5));

  if(flange){let acc=0,next=3+rand(0,3);for(let i=1;i<path.length;i++){const A=path[i-1],Bp=path[i],l=A.distanceTo(Bp);while(acc+l>=next){const f=(next-acc)/l,P=A.clone().lerp(Bp,f),T=Bp.clone().sub(A).normalize();

// sewer profile: walls, arch, floor (closed loop)
const PROF=[];for(let y=TF;y<TS;y+=1)PROF.push([-TW,y]);for(let i=0;i<=22;i++){const th=Math.PI-i/22*Math.PI;PROF.push([TW*Math.cos(th),TS+TW*Math.sin(th)]);}

const {a:drLn,g:drLnGeo}=dynBuf(DN*2);{const cc=dynCol(drLnGeo,DN*2),k=C(PAL.drip);for(let i=0;i<DN;i++){cc[i*6]=cc[i*6+1]=cc[i*6+2]=0.1;cc[i*6+3]=k.r;cc[i*6+4]=k.g;cc[i*6+5]=k.b;}}

const dripHeads=glowAdd(new THREE.Points(drGeo,new THREE.PointsMaterial({size:0.5,vertexColors:true,map:GLOW,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false})));

/* ---------- the outfall: pours off the south face into the fog sea, harder with the flood ---------- */
const STN=260,ST=[],{a:stPos,g:stGeo}=dynBuf(STN);
{const cc=dynCol(stGeo,STN);for(let i=0;i<STN;i++){ST.push({age:rand(0,2.6),j1:rand(-1,1),j2:rand(-1,1),v:rand(2.4,3.4)});const c=lerpC(PAL.drip,0xFFFFFF,rng()*0.3),b=0.5+0.5*rng();cc[i*3]=c.r*b;cc[i*3+1]=c.g*b;cc[i*3+2]=c.b*b;}}
const stream=glowAdd(new THREE.Points(stGeo,new THREE.PointsMaterial({size:0.6,vertexColors:true,map:GLOW,transparent:true,opacity:0.75,blending:THREE.AdditiveBlending,depthWrite:false})));
let splash;{const p=[],col=[];for(let i=0;i<40;i++){p.push(OX+rand(-4,4),-54+rand(-2,2),-B-14+rand(-5,5));col.push(0.8,0.9,0.92);}splash=glowAdd(glowPoints(p,col,9,0.15));}

/* ---------- kodama spirit motes (abstract, no creatures) ---------- */
const MN=5,MP=14,{a:moPos,g:moGeo}=dynBuf(MN*MP),moCol=dynCol(moGeo,MN*MP),moOff=[],MO=[];
for(let m=0;m<MN;m++){MO.push({ph:rand(0,6.28),dir:rng()<0.5?-1:1});for(let k=0;k<MP;k++){const u=rand(0,6.28),v=Math.acos(rand(-1,1)),r=k===0?0:0.45*Math.cbrt(rng());moOff.push(r*Math.sin(v)*Math.cos(u),r*Math.cos(v),r*Math.sin(v)*Math.sin(u));}}

/* ---------- TIME + FLOOD ---------- */
const TK=[
 {p:0.00,top:0x3C3E6A,bot:0x8E8AA6,dens:0.0032,amb:0.85,ambU:0.85,lamp:0.75,win:0.35,sunO:0.45,moonO:0.3,star:0.08,fogL:1.0,fogK:0.85,shaft:0.55,wat:0.5},
 {p:0.25,top:0x5E7C9E,bot:0xAEBCCB,dens:0.0026,amb:1.0, ambU:1.0, lamp:0.45,win:0.05,sunO:1.0, moonO:0.1,star:0.0, fogL:0.75,fogK:0.6, shaft:1.0, wat:0.55},
 {p:0.50,top:0x2C2254,bot:0x8A5E7E,dens:0.0032,amb:0.75,ambU:0.8, lamp:0.9, win:0.7, sunO:0.35,moonO:0.7,star:0.3, fogL:0.7, fogK:0.8, shaft:0.45,wat:0.45},
 {p:0.75,top:0x090B18,bot:0x23283F,dens:0.0029,amb:0.55,ambU:0.7, lamp:1.0, win:1.0, sunO:0.0, moonO:1.0,star:1.0, fogL:0.55,fogK:1.0, shaft:0.1, wat:0.42}];
const TKN=['dens','amb','ambU','lamp','win','sunO','moonO','star','fogL','fogK','shaft','wat'];
function tparams(p){p=((p%1)+1)%1;let i=0;for(let k=0;k<TK.length;k++)if(TK[k].p<=p)i=k;const A=TK[i],Bk=TK[(i+1)%TK.length];let span=Bk.p-A.p;if(span<=0)span+=1;let f=(p-A.p);if(f<0)f+=1;f=ss(f/span);
  const o={};for(const k2 of TKN)o[k2]=MU.lerp(A[k2],Bk[k2],f);o.top=lerpC(A.top,Bk.top,f);o.bot=lerpC(A.bot,Bk.bot,f);return o;}
let P=0.55,timeAuto=true,targetP=0.55,F=0.4,floodAuto=true,targetF=0.4;
const NAMES=['dawn','day','dusk','night'];
function grpSet(sel,btn){document.querySelectorAll(sel).forEach(b=>b.classList.remove('on'));btn.classList.add('on');}

document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{grpSet('[data-f]',b);if(b.dataset.f==='auto')floodAuto=true;else{floodAuto=false;targetF=parseFloat(b.dataset.f);}}));
let turntable=true;const ttBtn=document.getElementById('tt');ttBtn.addEventListener('click',()=>{turntable=!turntable;ttBtn.textContent=(turntable?'◉':'○')+' turntable';ttBtn.classList.toggle('on',turntable);});

/* camera — orbiting the cut block from outside */
const target=new THREE.Vector3(0,6,0);
let camA=Math.PI*0.27,camR=182,camY=34,drag=false,px=0,py=0;
c.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;});addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;camA-=(e.clientX-px)*.005;camY=MU.clamp(camY-(e.clientY-py)*.4,-6,120);px=e.clientX;py=e.clientY;});
addEventListener('wheel',e=>{camR=MU.clamp(camR+e.deltaY*.05,150,240);},{passive:true});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
document.getElementById('legend').innerHTML=[[PAL.lampA,'status lamps','still reporting below'],[PAL.lampR,'mast lamps','blinking on the crowns'],[PAL.glint,'the water line','one level, sewer to street'],[PAL.drip,'drips','and the rings they leave'],[PAL.vineHi,'overgrowth','over the cut edge']]
  .map(r=>`<div class="row"><span class="sw" style="background:#${new THREE.Color(r[0]).getHexString()};box-shadow:0 0 10px #${new THREE.Color(r[0]).getHexString()}"></span><span>${r[1]}</span><span class="v">${r[2]}</span></div>`).join('');
for(const s of [scene,mirrorScene,overScene])s.traverse(o=>{o.frustumCulled=false;});

/* ---------- animate ---------- */
const clock=new THREE.Clock();let last=0;const tmpC=new THREE.Color(),_wc=new THREE.Color();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime(),dt=Math.min(0.05,t-last);last=t;
  if(turntable&&!drag)camA+=0.0007;
  camera.position.set(Math.cos(camA)*camR,camY,Math.sin(camA)*camR);camera.lookAt(target);dome.position.copy(camera.position);
  if(timeAuto)P=(P+dt/110)%1;else{let d=((targetP-P+0.5)%1+1)%1-0.5;P=((P+d*Math.min(1,dt*1.4))%1+1)%1;}
  if(floodAuto)F=0.5+0.5*Math.sin(t*0.045-0.4);else F+=(targetF-F)*Math.min(1,dt*1.2);
  const par=tparams(P);
  skyU.top.value.copy(par.top);skyU.bot.value.copy(par.bot);scene.background.copy(par.bot);scene.fog.color.copy(par.bot);scene.fog.density=par.dens;
  for(const A of AMB)A.m.color.copy(A.base).multiplyScalar(A.up?par.amb:par.ambU);
  for(const M of MIR){M.m.color.copy(M.src.color).multiplyScalar(M.k);}
  moonMat.opacity=0.32*par.moonO;haloMat.opacity=0.2*par.moonO;sunMat.opacity=0.55*par.sunO;starMat.opacity=0.8*par.star;
  // one water level for sewer and street
  waterY=MU.lerp(-25,12,F);clipBelow.constant=waterY;refl.position.y=2*waterY+0.04*Math.sin(t*1.1);
  waterPlane.position.y=waterY;datum.position.y=waterY;glints.position.y=waterY+0.05;foam.position.y=waterY+0.08*Math.sin(t*1.3);farWater.position.y=waterY;shaftPool.position.y=waterY;
  waterMat.color.copy(par.bot).multiplyScalar(par.wat).lerp(_wc.set(PAL.water),0.45);secMat.color.copy(waterMat.color).lerp(_wc.set(PAL.glint),0.08);
  const above=waterY>0;foam.material.opacity=above?0.5:0.25;
  phaseEl.textContent='— '+NAMES[Math.round(P*4)%4]+' · flood '+Math.round(F*100)+'% · '+(above?'street under '+waterY.toFixed(1)+' m':'sewers '+Math.round(MU.clamp((waterY-TF)/(TW+TS-TF),0,1)*100)+'% full')+' —';
  // light down the cistern shaft
  shaftVol.visible=waterY<-1;shaftVol.scale.y=Math.max(0.01,-waterY);shaftVol.material.opacity=0.09*par.shaft;shaftPool.material.opacity=0.3*par.shaft*(above?0:1);
  shaftVol.material.color.copy(par.bot).lerp(tmpC.set(0xFFFFFF),0.6);
  // fog
  for(const L of fogLayers){if(L.spd)L.o.rotation.y+=L.spd*dt;if(L.follow)L.o.position.y=waterY;L.o.material.opacity=L.op*par.fogL*(0.85+0.15*Math.sin(t*0.2+L.ph));L.o.material.color.copy(par.bot).lerp(tmpC.set(0xFFFFFF),0.2).multiplyScalar(par.fogK);}
  datum.material.opacity=0.35+0.4*par.star+0.2*(1-par.sunO);farWater.material.opacity=0.2+0.2*par.moonO;
  // lamps
  const cx=camera.position.x,cy=camera.position.y,cz=camera.position.z;
  for(let i=0;i<LN;i++){const L=LAMPS[i];let b;const ph=t*L.sp+L.ph;
    if(L.mode===0)b=0.85+0.15*Math.sin(t*9+L.ph);else if(L.mode===1)b=Math.sin(ph*3.2)>0?1:0.06;else if(L.mode===2){const q=(ph*0.8)%2;b=(q<0.12||(q>0.3&&q<0.42))?1:0.08;}
    else if(L.mode===3)b=0.25+0.75*Math.pow(0.5+0.5*Math.sin(ph*1.3),2);else b=(Math.sin(t*13.1+L.ph)*Math.sin(t*7.7+L.ph*2)>0.25)?0.15:0.9;
    const k=b*(0.4+0.6*par.lamp)*(L.y<waterY?0.22:1);lmCol[i*3]=L.c.r*k;lmCol[i*3+1]=L.c.g*k;lmCol[i*3+2]=L.c.b*k;}
  lmGeo.attributes.color.needsUpdate=true;
  // windows: drowned floors go dark
  for(let i=0;i<winN;i++){const wet=MU.clamp((winP[i*3+1]-waterY)/1.2,0,1),fl=winPh[i]>=0?(0.55+0.45*Math.sin(t*3.1+winPh[i])):1,k=par.win*wet*fl;winArr[i*3]=winBase[i*3]*k;winArr[i*3+1]=winBase[i*3+1]*k;winArr[i*3+2]=winBase[i*3+2]*k;}
  winObj.geometry.attributes.color.needsUpdate=true;
  // glints
  glints.material.opacity=0.45+0.4*(par.moonO*0.5+par.sunO*0.5);
  for(let i=0;i<GL;i++){const tw=0.2+0.8*Math.pow(Math.max(0,Math.sin(t*1.7+glPh[i])),3);glCol[i*3]=glB[i*3]*tw;glCol[i*3+1]=glB[i*3+1]*tw;glCol[i*3+2]=glB[i*3+2]*tw;}
  glints.geometry.attributes.color.needsUpdate=true;
  // drips
  for(let i=0;i<DN;i++){const d=DR[i];let hx=d.s.x,hy,hz=d.s.z,bri;
    if(!d.f){d.w-=dt;hy=d.s.y-0.08*(1-Math.max(0,d.w)/4);bri=0.35+0.4*(1-Math.max(0,Math.min(1,d.w)));if(d.s.y<waterY+0.3){if(!reseed(d))d.w=2;hx=d.s.x;hz=d.s.z;hy=d.s.y;bri=0;}else if(d.w<=0){d.f=true;d.y=d.s.y;d.vy=0;}}
    else{d.vy+=30*dt;d.y-=d.vy*dt;hy=d.y;bri=1;const floor=d.s.out?d.s.fl:Math.max(d.s.fl,waterY);
      if(d.y<=floor){if(!d.s.out&&floor===waterY)ripple(d.s.x,d.s.z,rand(1.4,3.2),1);d.f=false;reseed(d);d.w=rand(0.6,4.5);hx=d.s.x;hz=d.s.z;hy=d.s.y;bri=0.3;}}
    drPos[i*3]=hx;drPos[i*3+1]=hy;drPos[i*3+2]=hz;drCol[i*3]=0.78*bri;drCol[i*3+1]=0.95*bri;drCol[i*3+2]=0.92*bri;
    const len=d.f?Math.min(1.8,d.vy*0.06):0;drLn[i*6]=hx;drLn[i*6+1]=hy+len;drLn[i*6+2]=hz;drLn[i*6+3]=hx;drLn[i*6+4]=hy;drLn[i*6+5]=hz;}
  drGeo.attributes.position.needsUpdate=true;drGeo.attributes.color.needsUpdate=true;drLnGeo.attributes.position.needsUpdate=true;
  // ripples
  {let idx=0;for(const r of RIP){if(r.on){r.rr+=r.spd*dt;if(r.rr>r.max)r.on=false;}const fade=r.on?Math.pow(1-r.rr/r.max,1.3)*r.b:0;
    for(let k=0;k<RRP;k++){const a=k/RRP*Math.PI*2;rpPos[idx*3]=r.x+r.rr*Math.cos(a);rpPos[idx*3+1]=waterY+0.05;rpPos[idx*3+2]=r.z+r.rr*Math.sin(a);rpCol[idx*3]=0.55*fade;rpCol[idx*3+1]=0.85*fade;rpCol[idx*3+2]=0.8*fade;idx++;}}
   rpGeo.attributes.position.needsUpdate=true;rpGeo.attributes.color.needsUpdate=true;}
  // outfall stream
  {const g=20,flow=0.45+0.9*F,Tf=Math.sqrt(2*(OY+72)/g);
   for(let i=0;i<STN;i++){const s=ST[i];s.age+=dt;if(s.age>Tf)s.age-=Tf*(1+0.1*rng());const a=s.age,sp=0.15+a*0.3;
     stPos[i*3]=OX+s.j1*sp*1.2;stPos[i*3+1]=OY-0.5*g*a*a+s.j2*sp*0.5-OR*0.4;stPos[i*3+2]=-B-4.2-s.v*flow*a;}
   stGeo.attributes.position.needsUpdate=true;stream.material.opacity=0.35+0.5*F;splash.material.opacity=(0.04+0.09*F)*par.fogL;}
  // dangling chains
  for(const ch of chains){const th=ch.amp*Math.sin(t*0.9+ch.ph),ph2=ch.amp*0.6*Math.cos(t*0.7+ch.ph);for(let s=0;s<ch.n+3;s++){const l=Math.min(s,ch.n)*0.24,o=(ch.off+s)*3,hook=s>=ch.n?(s-ch.n+1):0;
    chPos[o]=ch.ax+Math.sin(th)*l+(s%2?0.06:-0.06)+hook*0.12;chPos[o+1]=ch.ay-Math.cos(th)*l-hook*0.12;chPos[o+2]=ch.az+Math.sin(ph2)*l;}}
  chGeo.attributes.position.needsUpdate=true;
  // swaying cables
  {let i=0;for(const cb of dCab){const sw=1.4*Math.sin(t*0.5+cb.ph),sg=cb.sag*(1+0.06*Math.sin(t*0.8+cb.ph));let p0=cb.a[0],p1=cb.a[1],p2=cb.a[2];
    for(let s=1;s<=DCS;s++){const f=s/DCS,q=catP(cb.a,cb.b,sg,f),o=sw*4*f*(1-f),x=q[0]+cb.px*o,z=q[2]+cb.pz*o;
      dcPos[i*6]=p0;dcPos[i*6+1]=p1;dcPos[i*6+2]=p2;dcPos[i*6+3]=x;dcPos[i*6+4]=q[1];dcPos[i*6+5]=z;p0=x;p1=q[1];p2=z;i++;}}dcGeo.attributes.position.needsUpdate=true;}
  // vines + leaves
  {let i=0,li=0;for(const v of vines){let x0=v.ax,y0=v.ay,z0=v.az;for(let s=1;s<=VS;s++){const f=s/VS,out=v.o*(0.3+f*(0.6+0.5*(0.5+0.5*Math.sin(t*0.6+v.ph)))),tg=v.sway*f*Math.sin(t*0.7+v.ph-f*1.4);
      const x=v.ax+v.nx*out+v.tx*tg,y=v.ay-f*v.len,z=v.az+v.nz*out+v.tz*tg+(v.o?0:0.5*v.sway*f*Math.cos(t*0.5+v.ph));
      vP[i*6]=x0;vP[i*6+1]=y0;vP[i*6+2]=z0;vP[i*6+3]=x;vP[i*6+4]=y;vP[i*6+5]=z;x0=x;y0=y;z0=z;i++;
      for(let q=0;q<LF;q++){lfPos[li*3]=x+lfJ[li*3];lfPos[li*3+1]=y+lfJ[li*3+1];lfPos[li*3+2]=z+lfJ[li*3+2];li++;}}}
   vGeo.attributes.position.needsUpdate=true;lfGeo.attributes.position.needsUpdate=true;}
  for(const cn of canopies){cn.o.rotation.z=0.025*Math.sin(t*0.9+cn.ph);cn.o.rotation.x=0.02*Math.sin(t*0.7+cn.ph*1.3);}
  // spirit motes, over the water or the street, whichever is higher
  {const base=Math.max(waterY,0);for(let m=0;m<MN;m++){const M=MO[m],ph=M.ph,th=ph+t*0.03*M.dir,rr=20+14*Math.sin(t*0.05+ph),y=base+3+10*(0.5+0.5*Math.sin(t*0.07+ph*2)),mx=rr*Math.cos(th),mz=rr*Math.sin(th),op=ss(Math.sin(t*0.11+ph*3)*1.6+0.4)*(0.35+0.65*par.star);
    for(let k=0;k<MP;k++){const o=(m*MP+k)*3,b=op*(k===0?1:0.55)*(0.8+0.2*Math.sin(t*3+k));moPos[o]=mx+moOff[o];moPos[o+1]=y+moOff[o+1]+0.2*Math.sin(t*1.3+ph);moPos[o+2]=mz+moOff[o+2];moCol[o]=0.85*b;moCol[o+1]=0.94*b;moCol[o+2]=0.98*b;}}
   moGeo.attributes.position.needsUpdate=true;moGeo.attributes.color.needsUpdate=true;}
  if(par.star>0.01){const arr=stars.geometry.attributes.color.array;for(let i=0;i<starPh.length;i++){const tw=0.5+0.5*Math.sin(t*1.2+starPh[i]);arr[i*3]=starBase[i*3]*tw;arr[i*3+1]=starBase[i*3+1]*tw;arr[i*3+2]=starBase[i*3+2]*tw;}stars.geometry.attributes.color.needsUpdate=true;}
  // pass 1: the world (the water surface marks the stencil); pass 2: reflections; pass 3: on the surface
  renderer.autoClear=true;renderer.render(scene,camera);
  renderer.autoClear=false;renderer.clearDepth();renderer.render(mirrorScene,camera);renderer.render(overScene,camera);renderer.autoClear=true;}
animate();
