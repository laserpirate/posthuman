<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* paper forest — a forest of folded paper airplanes hung on hundreds of threads that drop
   out of the haze above. The threads sway like kelp in a slow current (a travelling wave
   that grows toward each free end), the planes flutter and turn on them, a few spin, and
   now and then one comes loose and glides down to the litter on the floor. Kodama spirit
   lights and plankton motes drift and rise between the threads in slow eddies, gathering
   and dispersing; soft shafts of light wander down from above. Everything moves in the
   vertex shaders: one draw call per layer. Cycles: time (dawn/day/dusk/night) and flood
   (here: current strength). r128. */
const PAL={paper:0xF4F1EA,paperHi:0xFFFFFF,cream:0xEDE2C8,creamHi:0xF6EEDC,print:0xE4DBC6,ink:0x7E786C,grid:0xE2EAEE,gridLn:0x86AACA,
  thread:0xC9D6D2,silt:0x2E3A38,siltHi:0x56625C,spirit:0xCFFFE0,spiritW:0xFFF0C8,spiritB:0xB8EEFF,mote:0xD8E8E0,shaft:0xF2FFF6,pale:0xAEC2D6};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng=mulberry32(20261036);
const rand=(a=0,b=1)=>a+(b-a)*rng(),pick=a=>a[(rng()*a.length)|0],lerpC=(c1,c2,t)=>new THREE.Color(c1).lerp(new THREE.Color(c2),t),MU=THREE.MathUtils,ss=x=>{x=MU.clamp(x,0,1);return x*x*(3-2*x);};
function glowSprite(){const s=64,cv=document.createElement('canvas');cv.width=cv.height=s;const g=cv.getContext('2d'),gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.28,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(cv);}
const GLOW=glowSprite();
const C=h=>new THREE.Color(h);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x04100F);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.3,1200);
const renderer=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
const world=new THREE.Group();scene.add(world);
// software GL (SwiftShader etc.) gets a thinner forest; the seed stays fixed per tier
let LOWQ=/[?&]q=low/.test(location.search);
try{const gl=renderer.getContext(),ext=gl.getExtension('WEBGL_debug_renderer_info');const r=ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):'';if(/swiftshader|llvmpipe|software/i.test(r))LOWQ=true;}catch(e){}

/* ---------- shared uniforms + GLSL: current sway, fog toward the gradient sky ---------- */
const TOPY=130;// threads hang from here (always above the frame; they fade out from y 85)
const U={uT:{value:0},uPh:{value:0},uAmp:{value:1},uLean:{value:1},uDir:{value:new THREE.Vector2(1,0)},
  uTop:{value:new THREE.Color()},uBot:{value:new THREE.Color()},uDens:{value:0.016},uMul:{value:1},
  uSh:{value:[0,1,2,3,4,5].map(()=>new THREE.Vector4())},uSlant:{value:new THREE.Vector2(0.06,0.03)},uShC:{value:new THREE.Color(PAL.shaft)},uShI:{value:1},
  uCl:{value:[0,1,2,3,4].map(()=>new THREE.Vector4())},uClAmt:{value:0},uGlow:{value:1},uGlowC:{value:new THREE.Color(0x9CFFC0)},
  uScale:{value:1},uLitC:{value:new THREE.Color(1,1,1)},uPS:{value:0.1},uSpr:{value:1},uMote:{value:1}};
const GL_COMMON=`
uniform float uT,uPh,uAmp,uLean,uDens,uMul;uniform vec2 uDir;uniform vec3 uTop,uBot;
vec3 sway(vec3 a,vec4 s){float ph=uPh*s.y+s.x-a.y*0.045;float m=sin(ph)+0.35*sin(ph*2.13+1.7);float q=sin(ph*0.77+2.3);
  vec2 pp=vec2(-uDir.y,uDir.x);vec2 d=(uDir*(m*uAmp+uLean)+pp*(q*uAmp*0.45))*s.z;return vec3(d.x,0.0,d.y);}
vec3 fogCol(vec3 wp){float vh=normalize(wp-cameraPosition).y;return mix(uBot,uTop,smoothstep(-0.25,0.65,vh));}
float fogF(vec3 wp){float d=length(wp-cameraPosition)*uDens;return 1.0-exp(-d*d);}
`;
let cur={ph:0,amp:1,lean:1,dx:1,dz:0};
function swayJS(ax,ay,az,s0,s1,w){const ph=cur.ph*s1+s0-ay*0.045,m=Math.sin(ph)+0.35*Math.sin(ph*2.13+1.7),q=Math.sin(ph*0.77+2.3);
  const k=(m*cur.amp+cur.lean)*w,k2=q*cur.amp*0.45*w;return [cur.dx*k-cur.dz*k2,cur.dz*k+cur.dx*k2];}

/* ---------- sky dome (gradient, follows the camera) ---------- */
const dome=new THREE.Mesh(new THREE.SphereGeometry(900,24,12),new THREE.ShaderMaterial({uniforms:U,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying float vh;void main(){vh=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 uTop;uniform vec3 uBot;varying float vh;void main(){gl_FragColor=vec4(mix(uBot,uTop,smoothstep(-0.25,0.65,vh)),1.0);}'}));
dome.renderOrder=-10;dome.frustumCulled=false;scene.add(dome);

/* ---------- the threads ---------- */
const NSTR=LOWQ?190:430,RF=88,strings=[];
for(let i=0,tries=0;i<NSTR&&tries<20000;tries++){const a=rand(0,6.28),r=RF*Math.sqrt(rng()),x=r*Math.cos(a),z=r*Math.sin(a);
  let ok=true;for(const s of strings){if((s.x-x)**2+(s.z-z)**2<(LOWQ?20:10.5)){ok=false;break;}}if(!ok)continue;
  strings.push({x,z,bot:rand(0.5,1)<0.75?rand(1.5,22):rand(22,48),ph:rand(0,6.28),f:rand(0.75,1.3)});i++;}
const swW=(s,y)=>{const u=MU.clamp((TOPY-y)/(TOPY-s.bot),0,1);return u*u;};
{const p=[],st=[];for(const s of strings){const n=Math.ceil((TOPY-s.bot)/4.5);let prev=null;
    for(let k=0;k<=n;k++){const y=TOPY-(TOPY-s.bot)*k/n,v=[s.x,y,s.z,s.ph,s.f,swW(s,y),0];if(prev){p.push(...prev.slice(0,3),...v.slice(0,3));st.push(...prev.slice(3),...v.slice(3));}prev=v;}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('aStr',new THREE.Float32BufferAttribute(st,4));
  var strMat=new THREE.ShaderMaterial({uniforms:Object.assign({uStrC:{value:C(PAL.thread)},uStrA:{value:0.32}},U),transparent:true,depthWrite:false,
    vertexShader:GL_COMMON+`attribute vec4 aStr;uniform vec3 uStrC;uniform float uStrA;uniform float uGlow;uniform vec3 uGlowC;uniform vec4 uCl[5];varying vec3 vC;varying float vA;
      void main(){vec3 wp=position+sway(position,aStr);float g=0.0;for(int i=0;i<5;i++){vec3 d=wp-uCl[i].xyz;g+=uCl[i].w*exp(-dot(d,d)/120.0);}
        float f=fogF(wp);vC=mix(uStrC*(0.35+0.65*uMul)+uGlowC*g*uGlow*0.6,fogCol(wp),f);vA=uStrA*(1.0-smoothstep(80.0,118.0,wp.y))*(1.0-0.7*f);
        gl_Position=projectionMatrix*viewMatrix*vec4(wp,1.0);}`,
    fragmentShader:'varying vec3 vC;varying float vA;void main(){gl_FragColor=vec4(vC,vA);}'});
  var strObj=new THREE.LineSegments(g,strMat);strObj.frustumCulled=false;world.add(strObj);}

/* ---------- paper airplanes: one point cloud per plane, all in one geometry ---------- */
// local frame: nose +x, span z, up y. Two wings off a centre crease, a keel folded under, fold lines on each wing.
function planeCloud(sc,style){const P=[],N=[],Cc=[],S=[];
  const base=style===0?lerpC(PAL.paper,PAL.paperHi,rng()*0.6):style===1?lerpC(PAL.cream,PAL.creamHi,rng()):style===2?C(PAL.print):C(PAL.grid);
  const dh=rand(0.03,0.11),Nn=[0.56,0,0],T=[-0.44,0,0],WL=[-0.44,dh,-0.4],WR=[-0.44,dh,0.4],K=[-0.44,-0.17,0];
  const add=(q,n,col,sz)=>{P.push(q[0]*sc,q[1]*sc,q[2]*sc);N.push(n[0],n[1],n[2]);const g=0.9+0.1*rng();Cc.push(col.r*g,col.g*g,col.b*g);S.push(sz);};
  const nrm=(a,b,c2)=>{const u=new THREE.Vector3(b[0]-a[0],b[1]-a[1],b[2]-a[2]),v=new THREE.Vector3(c2[0]-a[0],c2[1]-a[1],c2[2]-a[2]),n=u.cross(v).normalize();if(n.y<0||(Math.abs(n.y)<0.05&&n.z<0))n.negate();return [n.x,n.y,n.z];};
  const bary=(a,b,c2,u,v)=>[a[0]+(b[0]-a[0])*u+(c2[0]-a[0])*v,a[1]+(b[1]-a[1])*u+(c2[1]-a[1])*v,a[2]+(b[2]-a[2])*u+(c2[2]-a[2])*v];
  const tri=(a,b,c2,n,cnt)=>{const nn=nrm(a,b,c2);for(let i=0;i<cnt;i++){let u=rng(),v=rng();if(u+v>1){u=1-u;v=1-v;}const q=bary(a,b,c2,u,v);
      let col=base;if(style===2&&(((q[0]*15+q[2]*0.7)%1+1)%1)<0.4&&rng()<0.75)col=lerpC(PAL.ink,PAL.print,rng()*0.4);add(q,nn,col,1);}};
  const line=(a,b,n,col,sp,sz)=>{const L=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]),k=Math.max(2,Math.round(L/sp));for(let i=0;i<=k;i++){const f=i/k;add([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f],n,col,sz);}};
  const nL=nrm(Nn,T,WL),nR=nrm(Nn,T,WR),nK=nrm(Nn,T,K);
  if(style===3){// drafting paper: the fill sits on a grid
    for(const W of [WL,WR]){const nn=W===WL?nL:nR;for(let gx=-0.4;gx<0.56;gx+=0.08)for(let gz=0.02;gz<0.4;gz+=0.08){const zz=gz*Math.sign(W[2]);const u=(0.56-gx)/1.0;if(Math.abs(zz)>u*0.4)continue;
        const y=dh*Math.abs(zz)/0.4;const onLn=rng()<0.5;add([gx+(onLn?rand(0,0.08):0),y,zz+(onLn?0:rand(0,0.08))*Math.sign(zz)],nn,rng()<0.6?lerpC(PAL.gridLn,PAL.grid,0.35):base,1);}}
    tri(Nn,T,K,nK,9);}
  else{const nf=LOWQ?15:24;tri(Nn,T,WL,nL,nf);tri(Nn,T,WR,nR,nf);tri(Nn,T,K,nK,LOWQ?6:9);}
  const crease=base.clone().multiplyScalar(0.72),edge=base.clone().lerp(C(0xFFFFFF),0.3);
  line(Nn,WL,nL,edge,0.1,1.15);line(Nn,WR,nR,edge,0.1,1.15);line(T,WL,nL,base,0.1,1);line(T,WR,nR,base,0.1,1);
  line(Nn,T,nL,crease,0.09,1.1);line(Nn,K,nK,base.clone().multiplyScalar(0.85),0.1,1);
  const mL=[-0.44,dh*0.5,-0.2],mR=[-0.44,dh*0.5,0.2];line([0.5,0,0],mL,nL,crease,0.1,0.95);line([0.5,0,0],mR,nR,crease,0.1,0.95);
  return {P,N,C:Cc,S};}
const planes=[];
function paperStyle(){const r=rng();return r<0.45?0:r<0.8?1:r<0.9?2:3;}
// a small library of folded clouds at unit scale, reused with a scale, tint and rotation per plane
// (building one cloud per plane took about 3.5 s on the main thread, enough to stall a crossfade)
const TPL=[];for(let i=0;i<(LOWQ?40:72);i++)TPL.push(planeCloud(1,paperStyle()));
const items=[];// {cl,sc,anc,str,rot,dim}
for(const s of strings){const lo=Math.max(s.bot+0.8,2.5),hi=74;if(lo>hi)continue;let y=hi-rand(0,14);const ys=[];while(y>lo){ys.push(y);y-=rand(4.5,13);}
  for(const ay of ys){if(rng()<(LOWQ?0.3:0.12))continue;const sc=rand(1.5,2.6),cl=pick(TPL);const spin=rng()<0.08;
    const str=[s.ph,s.f,swW(s,ay),0],rot=[rand(0,6.28),spin?(rng()<0.5?-1:1)*rand(0.35,1.0):rand(-0.05,0.05),rand(0.1,0.32),rand(-0.12,0.12)];
    items.push({cl,sc,anc:[s.x,ay-0.06*sc,s.z],str,rot,dim:rand(0.88,1.04),hang:true});}}
// the floor: dark silt and a litter of fallen planes, sinking into the fog
for(let i=0;i<(LOWQ?40:80);i++){const a=rand(0,6.28),r=rand(2,RF);items.push({cl:pick(TPL),sc:rand(1.05,1.7),anc:[r*Math.cos(a),0.12,r*Math.sin(a)],str:[0,0,0,0],rot:[rand(0,6.28),0,0,rng()<0.35?rand(1.2,1.5):rand(-0.25,0.25)],dim:rand(0.55,0.8)});}
const NSILT=LOWQ?3500:9000;
const NPLPTS=items.reduce((a,it)=>a+it.cl.S.length,0)+NSILT;
const PL={pos:new Float32Array(NPLPTS*3),nrm:new Float32Array(NPLPTS*3),col:new Float32Array(NPLPTS*3),anc:new Float32Array(NPLPTS*3),
  str:new Float32Array(NPLPTS*4),rot:new Float32Array(NPLPTS*4),life:new Float32Array(NPLPTS*3)};
{let j=0;for(const it of items){const cl=it.cl,n=cl.S.length,start=j;
    for(let i=0;i<n;i++,j++){const i3=i*3,j3=j*3,j4=j*4;
      PL.pos[j3]=cl.P[i3]*it.sc;PL.pos[j3+1]=cl.P[i3+1]*it.sc;PL.pos[j3+2]=cl.P[i3+2]*it.sc;
      PL.nrm[j3]=cl.N[i3];PL.nrm[j3+1]=cl.N[i3+1];PL.nrm[j3+2]=cl.N[i3+2];
      PL.col[j3]=cl.C[i3]*it.dim;PL.col[j3+1]=cl.C[i3+1]*it.dim;PL.col[j3+2]=cl.C[i3+2]*it.dim;
      PL.anc[j3]=it.anc[0];PL.anc[j3+1]=it.anc[1];PL.anc[j3+2]=it.anc[2];
      PL.str[j4]=it.str[0];PL.str[j4+1]=it.str[1];PL.str[j4+2]=it.str[2];PL.str[j4+3]=it.str[3];
      PL.rot[j4]=it.rot[0];PL.rot[j4+1]=it.rot[1];PL.rot[j4+2]=it.rot[2];PL.rot[j4+3]=it.rot[3];
      PL.life[j3]=-100;PL.life[j3+1]=1e9;PL.life[j3+2]=cl.S[i];}
    if(it.hang)planes.push({start,n,anc:it.anc,str:it.str,rot:it.rot});}
  const c=new THREE.Color(),c1=new THREE.Color(PAL.silt),c2=new THREE.Color(PAL.siltHi);
  for(let i=0;i<NSILT;i++,j++){const a=rand(0,6.28),r=105*Math.sqrt(rng()),x=r*Math.cos(a),z=r*Math.sin(a),h=0.4*Math.sin(x*0.08)*Math.cos(z*0.07)+rand(0,0.25);
    c.copy(c1).lerp(c2,rng());const j3=j*3;PL.nrm[j3+1]=1;PL.col[j3]=c.r;PL.col[j3+1]=c.g;PL.col[j3+2]=c.b;PL.anc[j3]=x;PL.anc[j3+1]=h;PL.anc[j3+2]=z;
    PL.life[j3]=-100;PL.life[j3+1]=1e9;PL.life[j3+2]=rand(0.9,1.6);}}
const NHANG=planes.length;
const PLANE_VS=GL_COMMON+`
attribute vec3 aNrm,aCol,aAnc,aLife;attribute vec4 aStr,aRot;
uniform float uPS,uScale,uShI,uGlow,uClAmt;uniform vec3 uLitC;uniform vec4 uSh[6];uniform vec2 uSlant;uniform vec3 uShC,uGlowC;uniform vec4 uCl[5];
varying vec3 vC;varying float vA;
mat3 rotY(float a){float c=cos(a),s=sin(a);return mat3(c,0.,-s,0.,1.,0.,s,0.,c);}
mat3 rotX(float a){float c=cos(a),s=sin(a);return mat3(1.,0.,0.,0.,c,s,0.,-s,c);}
mat3 rotZ(float a){float c=cos(a),s=sin(a);return mat3(c,s,0.,-s,c,0.,0.,0.,1.);}
void main(){
  float hang=step(0.0001,aStr.z),fl=uPh*2.3*aStr.y+aStr.x*3.0;
  float yaw=aRot.x+aRot.y*uT+0.45*sin(uPh*0.6+aStr.x*1.3)*hang;
  float roll=aRot.w+aRot.z*sin(fl),pitch=aRot.z*0.5*sin(fl*0.71+1.0)-0.08*hang;
  mat3 R=rotY(yaw)*rotZ(pitch)*rotX(roll);
  vec3 wp=aAnc+sway(aAnc,aStr)+R*position,n=R*aNrm;
  float lit=(0.72+0.5*abs(n.y))*mix(0.55,1.12,smoothstep(0.0,70.0,wp.y));
  float b=0.0;for(int i=0;i<6;i++){float h=clamp((140.0-wp.y)/140.0,0.0,1.0);vec2 ax=uSh[i].xy+uSlant*(140.0-wp.y);float r=mix(2.5,9.0,h)*uSh[i].z;b+=uSh[i].w*(1.0-smoothstep(0.25*r,r,length(wp.xz-ax)));}
  float g=0.0;for(int i=0;i<5;i++){vec3 d=wp-uCl[i].xyz;g+=uCl[i].w*exp(-dot(d,d)/90.0);}
  vec3 col=aCol*lit*uMul*uLitC+aCol*uShC*b*uShI*0.7+uGlowC*g*uGlow*(0.35+0.4*abs(n.y));
  vC=mix(col,fogCol(wp),fogF(wp));
  vec4 mv=viewMatrix*vec4(wp,1.0);
  vA=clamp((uT-aLife.x)/3.0,0.0,1.0)*clamp((aLife.y-uT)/3.0,0.0,1.0)*smoothstep(3.0,8.0,-mv.z);
  gl_Position=vA<0.01?vec4(0.0,0.0,-2.0,1.0):projectionMatrix*mv;
  gl_PointSize=clamp(uPS*aLife.z*uScale/-mv.z,1.0,8.0);}`;
const PLANE_FS=`varying vec3 vC;varying float vA;void main(){vec2 c=gl_PointCoord-0.5;if(dot(c,c)>0.25)discard;
  float h=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453);if(vA<0.999&&vA<h)discard;gl_FragColor=vec4(vC,1.0);}`;
const planeMat=new THREE.ShaderMaterial({uniforms:U,vertexShader:PLANE_VS,fragmentShader:PLANE_FS});
function planeGeo(B){const g=new THREE.BufferGeometry(),A=(k,a,n)=>g.setAttribute(k,new THREE.BufferAttribute(a instanceof Float32Array?a:new Float32Array(a),n));
  A('position',B.pos,3);A('aNrm',B.nrm,3);A('aCol',B.col,3);A('aAnc',B.anc,3);A('aStr',B.str,4);A('aRot',B.rot,4);A('aLife',B.life,3);return g;}
const plGeo=planeGeo(PL),planeObj=new THREE.Points(plGeo,planeMat);planeObj.frustumCulled=false;world.add(planeObj);

/* ---------- gliders: planes that come loose and glide down (CPU-driven, same material) ---------- */
const GS=LOWQ?4:6,GMAX=200,GL={pos:new Float32Array(GS*GMAX*3),nrm:new Float32Array(GS*GMAX*3),col:new Float32Array(GS*GMAX*3),anc:new Float32Array(GS*GMAX*3),
  str:new Float32Array(GS*GMAX*4),rot:new Float32Array(GS*GMAX*4),life:new Float32Array(GS*GMAX*3)};
for(let i=0;i<GS*GMAX;i++){GL.life[i*3]=-100;GL.life[i*3+1]=-50;GL.life[i*3+2]=1;}
const glGeo=planeGeo(GL),gliderObj=new THREE.Points(glGeo,planeMat);gliderObj.frustumCulled=false;world.add(gliderObj);
const gliders=[];for(let i=0;i<GS;i++)gliders.push({on:false,n:0});
let nextDetach=4;

/* ---------- light shafts from above: soft cones, one merged mesh ---------- */
const NSH=6,shafts=[];
{const pos=[],nr=[],id=[];for(let i=0;i<NSH;i++){const cg=new THREE.CylinderGeometry(2.5,9,140,22,1,true);cg.translate(0,70,0);const p=cg.attributes.position,nn=cg.attributes.normal,ix=cg.index.array;
    for(let k=0;k<ix.length;k++){const j=ix[k];pos.push(p.getX(j),p.getY(j),p.getZ(j));nr.push(nn.getX(j),nn.getY(j),nn.getZ(j));id.push(i);}
    shafts.push({R:rand(8,52),a:rand(0,6.28),w:rand(0.006,0.014)*(rng()<0.5?-1:1),ph:rand(0,6.28),sc:rand(0.8,1.6),I:rand(0.6,1)});}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nr,3));g.setAttribute('aId',new THREE.Float32BufferAttribute(id,1));
  var shaftObj=new THREE.Mesh(g,new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
    vertexShader:GL_COMMON+`attribute float aId;uniform vec4 uSh[6];uniform vec2 uSlant;varying vec3 vN,vW;varying float vI;
      void main(){vec4 s=vec4(0.0);for(int i=0;i<6;i++){if(abs(aId-float(i))<0.5)s=uSh[i];}vec3 p=position;p.xz*=s.z;p.xz+=s.xy+uSlant*(140.0-p.y);vI=s.w;vN=normal;vW=p;gl_Position=projectionMatrix*viewMatrix*vec4(p,1.0);}`,
    fragmentShader:GL_COMMON+`uniform vec3 uShC;uniform float uShI;varying vec3 vN,vW;varying float vI;
      void main(){vec3 v=normalize(cameraPosition-vW);float f=abs(dot(normalize(vec3(vN.x,0.0,vN.z)),normalize(vec3(v.x,0.0,v.z))));
        float a=vI*uShI*pow(f,2.2)*smoothstep(0.0,95.0,vW.y)*(1.0-smoothstep(105.0,140.0,vW.y))*(1.0-0.75*fogF(vW))*0.13;gl_FragColor=vec4(uShC*a,1.0);}`}));
  shaftObj.frustumCulled=false;shaftObj.renderOrder=3;world.add(shaftObj);}

/* ---------- kodama spirit lights + plankton motes: drift, rise, gather, disperse ---------- */
const NSP=LOWQ?150:280,NMO=LOWQ?1500:3000;
{const p=[],a=[],col=[];for(let i=0;i<NSP+NMO;i++){const sp=i<NSP,an=rand(0,6.28),r=(sp?62:95)*Math.sqrt(rng());p.push(r*Math.cos(an),rand(0,88),r*Math.sin(an));
    a.push(rand(0,6.28),sp?rand(0.5,1.3):rand(0.2,0.9),sp?rand(1.5,6):rand(0.5,3),sp?(rng()<0.75?1:2):0);
    const cc=sp?lerpC(pick([PAL.spirit,PAL.spirit,PAL.spiritW,PAL.spiritB]),0xFFFFFF,rng()*0.3):lerpC(PAL.mote,PAL.pale,rng());col.push(cc.r,cc.g,cc.b);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('aP',new THREE.Float32BufferAttribute(a,4));g.setAttribute('aCol',new THREE.Float32BufferAttribute(col,3));
  var sprObj=new THREE.Points(g,new THREE.ShaderMaterial({uniforms:Object.assign({uMap:{value:GLOW}},U),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:GL_COMMON+`attribute vec4 aP;attribute vec3 aCol;uniform vec4 uCl[5];uniform float uClAmt,uScale,uSpr,uMote;varying vec3 vC;
      void main(){float t=uT,sp=step(0.5,aP.w),ph=aP.x;vec3 p=position;
        p.y=mod(position.y+t*aP.y*mix(0.18,0.75,sp),88.0);float fade=smoothstep(0.0,8.0,p.y)*(1.0-smoothstep(70.0,88.0,p.y));
        float e=uPh*0.35*aP.y+ph;p.x+=aP.z*sin(e+p.y*0.06)+2.5*sin(t*0.031+p.z*0.025);p.z+=aP.z*cos(e*1.13+ph*1.7+p.y*0.05)+2.5*cos(t*0.027+p.x*0.025);
        p.xz+=uDir*uLean*0.6;
        if(sp>0.5){int ci=int(mod(floor(ph*10.0),5.0));vec4 cc=vec4(0.0);for(int i=0;i<5;i++){if(i==ci)cc=uCl[i];}
          float af=step(0.3,fract(ph*7.13));float rr=2.5+aP.z*1.5;vec3 o=cc.xyz+vec3(cos(t*0.4*aP.y+ph)*rr,sin(t*0.53*aP.y+ph*2.0)*rr*0.6,sin(t*0.4*aP.y+ph)*rr);
          float k=uClAmt*af;p=mix(p,o,k);fade=mix(fade,1.0,k);}
        vec4 mv=viewMatrix*vec4(p,1.0);gl_Position=projectionMatrix*mv;float d=-mv.z;
        float pulse=0.7+0.3*sin(t*(1.1+aP.y)+ph*3.0);
        float sz=sp>0.5?(aP.w>1.5?1.7:1.1)*(0.8+0.25*pulse):0.3;gl_PointSize=clamp(sz*uScale/d,1.5,sp>0.5?40.0:5.0);
        float vis=exp(-pow(d*uDens*0.75,2.0));float a=fade*vis*(sp>0.5?uSpr*pulse:uMote*0.55)*smoothstep(0.6,3.0,d);
        vC=aCol*a;}`,
    fragmentShader:'varying vec3 vC;void main(){float r=length(gl_PointCoord-0.5)*2.0;if(r>1.0)discard;float a=exp(-r*r*7.0)*0.65+exp(-r*r*45.0)*0.9;gl_FragColor=vec4(vC*a*(1.0-r),1.0);}'}));
  sprObj.frustumCulled=false;sprObj.renderOrder=4;world.add(sprObj);}
const clusters=[];for(let i=0;i<5;i++)clusters.push({R:rand(8,42),a:rand(0,6.28),w:rand(0.012,0.03)*(rng()<0.5?-1:1),y:rand(12,46),ph:rand(0,6.28)});

/* ---------- TIME + FLOOD (current) cycles ---------- */
const TK=[
 {p:0.00,top:0xC2A690,bot:0x10303A,dens:0.0165,mul:1.08,lit:0xFFE8D4,shI:0.85,shC:0xFFD9B4,spr:0.6,mote:0.7,glow:0.45},
 {p:0.25,top:0x96CCC8,bot:0x1E5260,dens:0.0150,mul:1.18,lit:0xF4FFFC,shI:1.0,shC:0xF2FFF6,spr:0.42,mote:0.6,glow:0.3},
 {p:0.50,top:0xB27E6C,bot:0x1A1E3C,dens:0.0165,mul:1.05,lit:0xFFD8C4,shI:0.75,shC:0xFFB27E,spr:0.8,mote:0.75,glow:0.6},
 {p:0.75,top:0x174A50,bot:0x03100F,dens:0.0155,mul:0.9,lit:0x9CD8D2,shI:0.42,shC:0x8FD8E0,spr:1.0,mote:0.9,glow:1.0}];
function tparams(p){p=((p%1)+1)%1;let i=0;for(let k=0;k<TK.length;k++)if(TK[k].p<=p)i=k;const A=TK[i],B=TK[(i+1)%TK.length];let span=B.p-A.p;if(span<=0)span+=1;let f=(p-A.p);if(f<0)f+=1;f=ss(f/span);
  const o={};for(const k2 of ['dens','mul','shI','spr','mote','glow'])o[k2]=MU.lerp(A[k2],B[k2],f);o.top=lerpC(A.top,B.top,f);o.bot=lerpC(A.bot,B.bot,f);o.shC=lerpC(A.shC,B.shC,f);o.lit=lerpC(A.lit,B.lit,f);return o;}
let P=0.75,timeAuto=false,targetP=0.75,F=0.35,floodAuto=true,targetF=0.35;
const NAMES=['dawn','day','dusk','night'];
function grpSet(sel,btn){document.querySelectorAll(sel).forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
document.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{grpSet('[data-t]',b);if(b.dataset.t==='auto')timeAuto=true;else{timeAuto=false;targetP=parseFloat(b.dataset.t);}}));
document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{grpSet('[data-f]',b);if(b.dataset.f==='auto')floodAuto=true;else{floodAuto=false;targetF=parseFloat(b.dataset.f);}}));
let turntable=true;const ttBtn=document.getElementById('tt');ttBtn.addEventListener('click',()=>{turntable=!turntable;ttBtn.textContent=(turntable?'◉':'○')+' turntable';ttBtn.classList.toggle('on',turntable);});
const phaseEl=document.getElementById('phase');

/* camera — inside the forest, looking across the threads; the thread tops stay above the frame */
const target=new THREE.Vector3(0,24,0);
let camA=0.6,camR=46,camY=16,drag=false,px=0,py=0;
c.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;});addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;camA-=(e.clientX-px)*.005;camY=MU.clamp(camY-(e.clientY-py)*.4,5,44);px=e.clientX;py=e.clientY;});
addEventListener('wheel',e=>{camR=MU.clamp(camR+e.deltaY*.05,24,72);},{passive:true});
function setScale(){U.uScale.value=renderer.getSize(new THREE.Vector2()).y*renderer.getPixelRatio()/(2*Math.tan(MU.degToRad(camera.fov/2)));}
setScale();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);setScale();});
document.getElementById('legend').innerHTML=[[PAL.paper,'paper planes','folded, hung on threads'],[PAL.thread,'threads','swaying in the current'],[PAL.spirit,'spirit lights','kodama, gathering + drifting'],[PAL.shaft,'light shafts','down from the haze'],[PAL.siltHi,'the floor','fallen planes, silt']]
  .map(r=>`<div class="row"><span class="sw" style="background:#${C(r[0]).getHexString()};box-shadow:0 0 10px #${C(r[0]).getHexString()}"></span><span>${r[1]}</span><span class="v">${r[2]}</span></div>`).join('');

/* ---------- detach: a hanging plane lets go and becomes a glider ---------- */
const gA=glGeo.attributes;
function detach(t){const g=gliders.find(q=>!q.on);if(!g)return;const gi=gliders.indexOf(g);
  let pl=null;for(let k=0;k<40;k++){const q=planes[(rng()*NHANG)|0];if(q.hidden>t||q.anc[1]<16)continue;
    const dx=q.anc[0]-camera.position.x,dz=q.anc[2]-camera.position.z,d=Math.hypot(dx,dz),fx=target.x-camera.position.x,fz=target.z-camera.position.z;
    if(d<10||d>48||(dx*fx+dz*fz)/(d*Math.hypot(fx,fz))<0.55)continue;pl=q;break;}
  if(!pl)return;
  // hide the hanging one (it fades back in a minute later)
  pl.hidden=t+75;const la=plGeo.attributes.aLife;for(let i=0;i<pl.n;i++)la.array[(pl.start+i)*3]=t+75;la.needsUpdate=true;
  const sw=swayJS(pl.anc[0],pl.anc[1],pl.anc[2],pl.str[0],pl.str[1],pl.str[2]);
  const yaw=pl.rot[0]+pl.rot[1]*t+0.45*Math.sin(cur.ph*0.6+pl.str[0]*1.3);
  Object.assign(g,{on:true,n:Math.min(GMAX,pl.n),x:pl.anc[0]+sw[0],y:pl.anc[1],z:pl.anc[2]+sw[1],hd:yaw,v:rand(1.6,2.6),turn:rand(0.08,0.22)*(rng()<0.5?-1:1),ph:rand(0,6.28),land:-1,t0:t,base:gi*GMAX});
  for(let i=0;i<GMAX;i++){const j=g.base+i,k=(pl.start+i)*3;
    if(i<g.n){GL.pos.set(PL.pos.subarray(k,k+3),j*3);GL.nrm.set(PL.nrm.subarray(k,k+3),j*3);GL.col.set(PL.col.subarray(k,k+3),j*3);GL.life.set([t-3,1e9,PL.life[k+2]],j*3);}
    else GL.life.set([-100,-50,1],j*3);GL.str.set([0,0,0,0],j*4);}
  for(const k of ['position','aNrm','aCol','aStr','aLife'])gA[k].needsUpdate=true;}
function stepGliders(t,dt){let any=false;
  for(const g of gliders){if(!g.on)continue;any=true;let bank;
    if(g.land<0){const r=Math.hypot(g.x,g.z);if(r>RF-8){const want=Math.atan2(-(-g.z),-g.x);/* heading toward centre */let d=Math.atan2(Math.sin(want-g.hd),Math.cos(want-g.hd));g.turn=MU.clamp(d,-0.35,0.35);}
      g.hd+=g.turn*dt;g.x+=Math.cos(g.hd)*g.v*dt;g.z+=-Math.sin(g.hd)*g.v*dt;g.x+=cur.dx*cur.lean*0.04*dt;g.z+=cur.dz*cur.lean*0.04*dt;
      g.y-=(0.55+0.35*Math.sin((t-g.t0)*0.9+g.ph))*dt;bank=-g.turn*1.6+0.08*Math.sin(t*2.1+g.ph);
      if(g.y<=0.15){g.y=0.15;g.land=t;g.bank0=bank;const e=t+28;for(let i=0;i<g.n;i++)GL.life[(g.base+i)*3+1]=e;gA.aLife.needsUpdate=true;}}
    else{bank=g.bank0*Math.max(0,1-(t-g.land)*2);if(t-g.land>31){g.on=false;continue;}}
    const pitch=g.land<0?-0.06+0.05*Math.sin((t-g.t0)*0.9+g.ph):0;
    for(let i=0;i<g.n;i++){const j=g.base+i;GL.anc[j*3]=g.x;GL.anc[j*3+1]=g.y;GL.anc[j*3+2]=g.z;GL.rot[j*4]=g.hd;GL.rot[j*4+1]=0;GL.rot[j*4+2]=0;GL.rot[j*4+3]=bank;}
  }
  if(any){gA.aAnc.needsUpdate=true;gA.aRot.needsUpdate=true;}}

/* ---------- animate ---------- */
const clock=new THREE.Clock();let last=0;
function animate(){requestAnimationFrame(animate);
  if(turntable&&!drag)camA+=0.0007;
  const t=clock.getElapsedTime(),dt=Math.min(0.05,t-last);last=t;
  camera.position.set(Math.cos(camA)*camR,camY,Math.sin(camA)*camR);camera.lookAt(target);dome.position.copy(camera.position);
  if(timeAuto)P=(P+dt/110)%1;else{let d=((targetP-P+0.5)%1+1)%1-0.5;P=((P+d*Math.min(1,dt*1.4))%1+1)%1;}
  if(floodAuto)F=0.5-0.5*Math.cos(t*0.045+1.3);else F+=(targetF-F)*Math.min(1,dt*1.2);
  const par=tparams(P);
  U.uT.value=t;U.uTop.value.copy(par.top);U.uBot.value.copy(par.bot);scene.background.copy(par.bot);U.uDens.value=par.dens;U.uMul.value=par.mul;
  U.uShI.value=par.shI;U.uShC.value.copy(par.shC);U.uLitC.value.copy(par.lit);U.uSpr.value=par.spr;U.uMote.value=par.mote;U.uGlow.value=par.glow;
  // the current: phase speed, sway amplitude and downstream lean all follow FLOOD
  cur.ph+=dt*(0.32+0.85*F);cur.amp=0.7+3.6*F;cur.lean=0.4+4.2*F;const da=0.7+0.5*Math.sin(t*0.012);cur.dx=Math.cos(da);cur.dz=Math.sin(da);
  U.uPh.value=cur.ph;U.uAmp.value=cur.amp;U.uLean.value=cur.lean;U.uDir.value.set(cur.dx,cur.dz);
  for(let i=0;i<NSH;i++){const s=shafts[i],a=s.a+s.w*t;U.uSh.value[i].set(s.R*Math.cos(a),s.R*Math.sin(a)*0.9,s.sc,s.I*(0.55+0.45*Math.sin(t*0.09+s.ph)));}
  U.uSlant.value.set(0.07*Math.sin(t*0.013),0.05*Math.cos(t*0.011));
  const ca=ss(0.5+0.6*Math.sin(t*0.06));U.uClAmt.value=ca;
  for(let i=0;i<5;i++){const k=clusters[i],a=k.a+k.w*t;U.uCl.value[i].set(k.R*Math.cos(a),k.y+5*Math.sin(t*0.05+k.ph),k.R*Math.sin(a),ca*(0.6+0.4*Math.sin(t*0.2+k.ph)));}
  if(t>nextDetach){nextDetach=t+rand(5,11);detach(t);}
  stepGliders(t,dt);
  phaseEl.textContent='— '+NAMES[Math.round(P*4)%4]+' · current '+Math.round(F*100)+'% —';
  renderer.render(scene,camera);}
animate();
</script></body></html>
