<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* gund ruin — a post-human Gund Hall seen from outside at night. Eight equal structural
   bays run the length of the building, framed by full-height concrete fins; the stepped
   roof of steel trusses and glazing cascades down across the section in four trays, read
   on the west as four horizontal tray bands stepping back up to the roof, which carries
   eight raised glazed roof units, one per bay. The east face is eight tall glazed bays over
   a ground band, with the narrower stepped service block at the end. Three non-adjacent
   bays have caved in, trusses dangle, slabs hang from their hinges, two roof units have
   tipped in, trees grow up through the trays and out of the holes, vines spill down the
   concrete. Quincy St is flooded
   and mirrors the building; lanterns rest on the trays and float up past a full moon,
   stars and shooting stars; rain follows the time of day. Stylized massing, not a
   survey. Cycles: time (dawn/day/dusk/night) and flood. r128. */
const PAL={concLo:0x2C323E,conc:0x8E95A2,concHi:0xC0C6CE,stain:0x403A36,steel:0x56626F,steelHi:0x9AA8B8,rust:0x7A4A30,
  glass:0x8FB8D4,glassHi:0xDDF2FF,tray:0x707784,moss:0x34603A,mossHi:0x7EA858,leaf:0x467E42,leafHi:0x9ACC6A,bark:0x4A3C30,
  lant:0xFFB860,flame:0xFFD890,moon:0xF4F6F8,moonLo:0xC6D2E0,halo:0xBFD0E0,pale:0xAEC2D6,asph:0x161A22,asphHi:0x343A44,
  lawn:0x1A2C1E,foam:0xC8DCE8,mote:0xB8F0C0,far:0x2A3442};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng=mulberry32(20261035);
const rand=(a=0,b=1)=>a+(b-a)*rng(),pick=a=>a[(rng()*a.length)|0],lerpC=(c1,c2,t)=>new THREE.Color(c1).lerp(new THREE.Color(c2),t),MU=THREE.MathUtils,ss=x=>{x=MU.clamp(x,0,1);return x*x*(3-2*x);};
function glowSprite(){const s=64,cv=document.createElement('canvas');cv.width=cv.height=s;const g=cv.getContext('2d'),gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.28,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(cv);}
const GLOW=glowSprite();
function mkGeo(pos,col){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));return g;}
function glowPoints(pos,col,size,op){return new THREE.Points(mkGeo(pos,col),new THREE.PointsMaterial({size,vertexColors:true,map:GLOW,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));}
function rockPoints(pos,col,size){return new THREE.Points(mkGeo(pos,col),new THREE.PointsMaterial({size,vertexColors:true}));}
function dynBuf(n){const a=new Float32Array(n*3),g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));return {a,g};}
const C=h=>new THREE.Color(h);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0E1828);scene.fog=new THREE.FogExp2(0x0E1828,0.0032);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.5,4000);
const renderer=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.localClippingEnabled=true;
const world=new THREE.Group();scene.add(world);
let waterY=1;

/* ---------- sky dome (gradient, follows the camera) ---------- */
const skyU={top:{value:new THREE.Color(0x03070F)},bot:{value:new THREE.Color(0x0E1828)}};
const dome=new THREE.Mesh(new THREE.SphereGeometry(1600,24,12),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying float vh;void main(){vh=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 top;uniform vec3 bot;varying float vh;void main(){gl_FragColor=vec4(mix(bot,top,smoothstep(0.0,0.5,vh)),1.0);}'}));
dome.renderOrder=-10;scene.add(dome);

/* ---------- accumulators ---------- */
const acc=()=>({p:[],c:[]});
const CON=acc(),DECK=acc(),GLS=acc(),TRY=acc(),VEG=acc(),GND=acc(),FAR=acc(),LS=acc(),VL=acc();
function put(B,q,col){B.p.push(q[0],q[1],q[2]);B.c.push(col.r,col.g,col.b);}
function seg(a,b,col,col2){col2=col2||col;LS.p.push(a[0],a[1],a[2],b[0],b[1],b[2]);LS.c.push(col.r,col.g,col.b,col2.r,col2.g,col2.b);}

/* ---------- massing (stylized): x runs along the 8 structural bays (column line N at -x to E),
   with the narrower service block (D..A) past E at +x; z runs across the section: the tall glazed
   east face at -z, the four trays stepping down toward +z, the west side on the flooded street ---------- */
const FL=3.6,NB=8,BW=12,XA=-55,XE=XA+NB*BW,XS=55,ZT=-10,ZF=20,NT=4,SD=(ZF-ZT)/NT,SZ=0;
const BX=[];for(let i=0;i<=NB;i++)BX.push(XA+i*BW);
const T=[];for(let k=0;k<NT;k++){const H=25.5-k*4.7;T.push({k,za:ZT+k*SD,zb:ZT+(k+1)*SD,H,F:H-5.4});}// roof step top H over tray floor F
const H0=T[0].H,stepOf=z=>MU.clamp(Math.floor((z-ZT)/SD),0,NT-1),prof=z=>T[stepOf(z)].H;
// caved bays (0 = N..M): 1 (M-L), 4 (J-H), 6 (G-F) — never adjacent. [bay, step, x0,x1 (of bay), z0,z1 (of step)]
const CAVED=[1,4,6];
const HOLES=[[1,0,.08,.92,0,1],[1,1,.22,.84,0,.72],[4,1,.14,.9,.22,1],[4,2,.1,.72,0,.85],[6,0,.18,.95,.3,1],[6,2,.3,.9,.12,1],[6,3,.4,.8,0,.45]]
  .map(h=>{const t=T[h[1]];return {b:h[0],k:h[1],x0:BX[h[0]]+h[2]*BW,x1:BX[h[0]]+h[3]*BW,z0:t.za+h[4]*SD,z1:t.za+h[5]*SD};});
const inHole=(k,x,z)=>{for(const h of HOLES)if(h.k===k&&x>h.x0&&x<h.x1&&z>h.z0&&z<h.z1)return true;return false;};
const holeD=(k,x,z)=>{let d=99;for(const h of HOLES){if(h.k!==k)continue;const dx=Math.max(h.x0-x,0,x-h.x1),dz=Math.max(h.z0-z,0,z-h.z1);d=Math.min(d,Math.hypot(dx,dz));}return d;};
const sag=(k,x,z)=>1.3*Math.max(0,1-holeD(k,x,z)/3.2);
const nearFin=(x,w)=>{const m=((x-XA)%BW+BW)%BW;return m<w||m>BW-w;};

/* ---------- exposed concrete ---------- */
function concCol(x,v,m){if(v<0.3+1.6*rng()&&rng()<0.55)return lerpC(PAL.moss,PAL.mossHi,rng());if(rng()<0.035)return lerpC(PAL.rust,PAL.stain,rng());
  const st=0.5+0.5*Math.sin(x*1.7)*Math.sin(x*0.43+1.1);let f=0.34+0.45*rng()-0.28*st;if(m<0.35)f+=0.32;return lerpC(PAL.concLo,PAL.conc,MU.clamp(f,0,1));}
function cface(P,u0,u1,v0,v1,st,skip,win){for(let u=u0;u<=u1+1e-6;u+=st)for(let v=v0;v<=v1+1e-6;v+=st){if(rng()<0.1)continue;
  const uu=u+rand(-.35,.35)*st,vv=MU.clamp(v+rand(-.35,.35)*st,v0,v1);if(skip&&skip(uu,vv))continue;const m=((vv%FL)+FL)%FL;
  if(win&&vv>4.2&&m>1.3&&m<2.6){if(rng()<0.8)continue;put(CON,P(uu,vv),lerpC(0x0C121A,PAL.glass,0.25*rng()));continue;}
  put(CON,P(uu,vv),concCol(uu,vv,m));}}
const finC=()=>lerpC(PAL.conc,PAL.concHi,0.45+0.55*rng()),hiC=C(PAL.concHi);
// the 9 fins: full-height concrete ribs on the bay lines, riding the stepped profile, pilasters on the east face,
// columns down to the street at the front of each tray
for(const x of BX){
  for(let z=ZT-0.9;z<=ZF+0.5;z+=0.42){const k=stepOf(z),t=T[k],top=prof(z)+0.9;
    for(let y=0;y<=top;y+=0.42){const yy=Math.min(top,y+rand(-.2,.2)),zz=z+rand(-.2,.2);
      const keep=yy>top-2.6||zz<ZT+1||(zz>t.zb-1.3&&(k===NT-1||yy>T[k+1].H-1.6));if(!keep||rng()<0.12)continue;
      put(CON,[x+rand(-.42,.42),yy,zz],yy<0.3+1.5*rng()&&rng()<0.5?lerpC(PAL.moss,PAL.mossHi,rng()):finC());}}
  for(const xs of [-0.45,0.45]){const X=x+xs;seg([X,0,ZT-0.9],[X,H0+0.9,ZT-0.9],hiC);
    for(const t of T){seg([X,t.H+0.9,Math.max(t.za,ZT-0.9)],[X,t.H+0.9,t.zb+0.5],hiC);
      seg([X,t.k<NT-1?T[t.k+1].H+0.9:0,t.zb+0.5],[X,t.H+0.9,t.zb+0.5],hiC);}
    seg([X,H0+0.9,ZT-0.9],[X,H0+0.9,T[0].za],hiC);}}
// end walls (the stepped section seen at N and at E)
for(const xe of [XA,XE])for(const t of T)cface((u,v)=>[xe,v,u],t.za,t.zb,0,t.H,0.6,xe===XE?(u,v)=>u<SZ+0.4&&v<24:null,true);
for(const xe of [XA,XE])for(const t of T){seg([xe,t.H,t.za],[xe,t.H,t.zb],hiC);seg([xe,t.k<NT-1?T[t.k+1].H:0,t.zb],[xe,t.H,t.zb],hiC);}
// tray bands: one concrete band per tray, stepping back up to the roof (the west elevation)
for(const t of T){const z=t.zb+0.15;
  for(let u=XA;u<=XE;u+=0.45)for(let v=t.F-1.1;v<=t.F+0.9;v+=0.45){if(rng()<0.12||(inHole(t.k,u,t.zb-0.4)&&rng()<0.45))continue;put(CON,[u+rand(-.15,.15),v+rand(-.15,.15),z],v<t.F-0.6&&rng()<0.3?lerpC(PAL.moss,PAL.mossHi,rng()):finC());}
  for(const y of [t.F-1.1,t.F+0.9])for(let i=0;i<NB;i++)seg([BX[i]+0.45,y,z+0.1],[BX[i+1]-0.45,y,z+0.1],hiC);}
// street level under the lowest tray: open arcade, recessed wall, columns mid-bay
cface((u,v)=>[u,v,ZF-3],XA,XE,0,T[NT-1].F-1.1,0.95);
for(let i=0;i<NB;i++){const x=BX[i]+BW/2;seg([x,0,ZF],[x,T[NT-1].F-1.1,ZF],hiC);}
// east face: ground band under the tall glazed bays
cface((u,v)=>[u,v,ZT-0.1],XA,XE,3.9,5.3,0.5);
for(const y of [3.9,5.3])seg([XA,y,ZT-0.2],[XE,y,ZT-0.2],hiC);
// service + stair block (grid D..A), stepping down away from the bays
const SB=[{x0:XE,x1:XE+5,h:24},{x0:XE+5,x1:XE+9.5,h:17},{x0:XE+9.5,x1:XS,h:10}];
for(const s of SB){for(const z of [ZT,SZ])cface((u,v)=>[u,v,z],s.x0,s.x1,0,s.h,0.6,null,true);
  for(let x=s.x0;x<=s.x1;x+=1.1)for(let z=ZT;z<=SZ;z+=1.1)put(CON,[x+rand(-.3,.3),s.h,z+rand(-.3,.3)],rng()<0.4?lerpC(PAL.moss,PAL.mossHi,rng()):lerpC(PAL.concLo,PAL.concHi,0.3+0.5*rng()));
  for(const z of [ZT,SZ]){seg([s.x0,s.h,z],[s.x1,s.h,z],hiC);seg([s.x1,0,z],[s.x1,s.h,z],hiC);}
  seg([s.x0,s.h,ZT],[s.x0,s.h,SZ],hiC);seg([s.x1,s.h,ZT],[s.x1,s.h,SZ],hiC);}
for(let i=0;i<SB.length;i++){const s=SB[i],lo=i<SB.length-1?SB[i+1].h:0;cface((u,v)=>[s.x1,v,u],ZT,SZ,lo,s.h,0.6,null,true);}

/* ---------- stepped roof: trusses, purlins, deck glazing (with caved-in bays) ---------- */
const stl=()=>lerpC(PAL.steel,PAL.steelHi,rng()*0.7),rst=()=>rng()<0.3?lerpC(PAL.rust,PAL.steel,rng()):stl();
for(const t of T){
  for(let x=XA+0.3;x<XE;x+=1.0)for(let z=t.za+0.3;z<t.zb;z+=1.0){const xx=x+rand(-.3,.3),zz=z+rand(-.3,.3);if(inHole(t.k,xx,zz)||nearFin(xx,0.5)||rng()<0.12)continue;
    const r=rng();put(DECK,[xx,t.H-sag(t.k,xx,zz)+rand(-.05,.05),zz],r<0.55?lerpC(PAL.glass,PAL.glassHi,rng()*0.5):r<0.78?lerpC(PAL.moss,PAL.mossHi,rng()):stl());}
  for(let i=0;i<NB;i++)for(const fx of [4,8]){const x=BX[i]+fx,NP=5,dz=SD/NP;
    for(let p=0;p<NP;p++){const z0=t.za+p*dz,z1=z0+dz,s0=sag(t.k,x,z0),s1=sag(t.k,x,z1);
      if(inHole(t.k,x,(z0+z1)/2)){
        if(!inHole(t.k,x,z0)){const L=rand(2.5,5);seg([x,t.H-s0,z0],[x+rand(-.7,.7),t.H-s0-L,z0+rand(.6,2.2)],rst());}
        if(!inHole(t.k,x,z1)){const L=rand(2.5,5);seg([x,t.H-s1,z1],[x+rand(-.7,.7),t.H-s1-L,z1-rand(.6,2.2)],rst());}
        continue;}
      const a=[x,t.H-s0,z0],b=[x,t.H-s1,z1],a2=[x,t.H-1.6-s0,z0],b2=[x,t.H-1.6-s1,z1];
      seg(a,b,rst());seg(a2,b2,rst());seg(p%2?a:a2,p%2?b2:b,rst());seg(a,a2,rst());}}
  // purlins along the bays + the roof edge over each tray band
  for(const z of [t.za+SD/3,t.za+2*SD/3,t.zb-0.1])for(let x=XA;x<XE-0.01;x+=BW/4){const x2=x+BW/4;if(inHole(t.k,x+1.5,Math.min(z,t.zb-0.5)))continue;
    seg([x,t.H-sag(t.k,x,z),z],[x2,t.H-sag(t.k,x2,z),z],z===t.zb-0.1?hiC:stl());}}
// caved bays: a roof slab hanging from its hinge, rubble on the tray below
for(const h of HOLES){const t=T[h.k],ang=rand(.55,.9),L=(h.z1-h.z0)*0.7;
  for(let s=0;s<1;s+=0.06)for(let x=h.x0+0.6;x<h.x1-0.4;x+=0.9){if(rng()<0.35)continue;const z=h.z0+s*L*Math.cos(ang),y=t.H-0.3-s*L*Math.sin(ang);if(y<t.F+0.4)continue;
    put(DECK,[x+rand(-.3,.3),y+rand(-.1,.1),z+rand(-.15,.15)],rng()<0.5?lerpC(PAL.glass,PAL.glassHi,rng()*0.4):stl());}
  for(let n=0;n<(h.x1-h.x0+h.z1-h.z0)*3;n++){const e=rng()<0.5,x=e?rand(h.x0,h.x1):(rng()<0.5?h.x0:h.x1)+rand(-.4,.4),z=e?(rng()<0.5?h.z0:h.z1)+rand(-.4,.4):rand(h.z0,h.z1);
    put(DECK,[x,t.H-rand(0.2,1.4),z],rng()<0.5?lerpC(PAL.glassHi,0xFFFFFF,rng()*0.5):lerpC(PAL.rust,PAL.steelHi,rng()));}
  for(let n=0;n<6;n++){const x=rand(h.x0+0.5,h.x1-0.5),z=rng()<0.5?h.z0:Math.min(h.z1,t.zb-0.2);seg([x,t.H-0.3,z],[x+rand(-1,1),t.H-rand(3,6),z+(z===h.z0?1:-1)*rand(.5,2)],rst());}
  const cx=(h.x0+h.x1)/2,cz=(h.z0+h.z1)/2,rx=(h.x1-h.x0)/2,rz=(h.z1-h.z0)/2;
  for(let i=0;i<rx*rz*4;i++){const a=rand(0,6.28),r=Math.sqrt(rng()),x=cx+rx*r*Math.cos(a),z=cz+rz*r*Math.sin(a);
    const q=rng();put(TRY,[x,t.F+2.2*(1-r*r)*rand(.4,1),z],q<0.3?lerpC(PAL.moss,PAL.mossHi,rng()):q<0.5?stl():lerpC(PAL.concLo,PAL.conc,rng()));}}

/* ---------- glazing: mullions + surviving panes ---------- */
function glazing(P,u0,u1,v0,v1,mw,keep,hole,vh){const nU=Math.max(1,Math.round((u1-u0)/mw)),du=(u1-u0)/nU,nV=Math.max(1,Math.round((v1-v0)/(vh||2.2))),dv=(v1-v0)/nV,mc=lerpC(PAL.concLo,PAL.steel,0.75);
  for(let i=0;i<=nU;i++){const u=u0+i*du;if(hole(u))continue;seg(P(u,v0),P(u,v1),mc);}
  for(let i=0;i<nU;i++){const ua=u0+i*du,ub=ua+du;if(hole(ua+du/2))continue;
    for(let j=0;j<nV;j++){const va=v0+j*dv,vb=va+dv;if(j>0&&rng()<0.6)seg(P(ua,va),P(ub,va),mc);

const meteorHeads=new THREE.Points(mhGeo,new THREE.PointsMaterial({size:3.6,vertexColors:true,map:GLOW,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));meteorHeads.frustumCulled=false;world.add(meteorHeads);
const mets=[];for(let i=0;i<SM;i++)mets.push({on:false,x:0,y:0,z:0,dx:0,dy:0,dz:0,v:0,life:1,age:0});
let nextMet=rand(2,6);

/* ---------- rain (intensity follows the time of day) ---------- */
const raN=480,ra=[],{a:raPos,g:raGeo}=dynBuf(raN*2),raCol=new Float32Array(raN*2*3);
for(let i=0;i<raN;i++){ra.push({x:rand(-150,150),y:rand(0,110),z:rand(-150,150),v:rand(1.6,2.6)});const cc=C(PAL.pale);for(let e=0;e<2;e++){raCol[i*6+e*3]=cc.r;raCol[i*6+e*3+1]=cc.g;raCol[i*6+e*3+2]=cc.b;}}
raGeo.setAttribute('color',new THREE.BufferAttribute(raCol,3));
const rainObj=new THREE.LineSegments(raGeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));rainObj.frustumCulled=false;world.add(rainObj);

/* ---------- TIME + FLOOD cycles ---------- */
const TK=[
 {p:0.00,top:0x2A3456,bot:0xC88A78,dens:0.0034,mul:0.85,star:0.2,moonO:0.4,lant:0.55,rain:0.55,wat:0.45,gls:0.8},
 {p:0.25,top:0x5E7EA0,bot:0xC4D2DC,dens:0.0026,mul:1.15,star:0.0,moonO:0.1,lant:0.12,rain:0.25,wat:0.55,gls:0.6},
 {p:0.50,top:0x221A3A,bot:0xA8607A,dens:0.0032,mul:0.82,star:0.35,moonO:0.6,lant:0.8,rain:0.45,wat:0.42,gls:0.85},
 {p:0.75,top:0x03070F,bot:0x14223A,dens:0.0030,mul:0.7,star:1.0,moonO:1.0,lant:1.0,rain:0.3,wat:0.55,gls:1.0}];
function tparams(p){p=((p%1)+1)%1;let i=0;for(let k=0;k<TK.length;k++)if(TK[k].p<=p)i=k;const A=TK[i],B=TK[(i+1)%TK.length];let span=B.p-A.p;if(span<=0)span+=1;let f=(p-A.p);if(f<0)f+=1;f=ss(f/span);
  const o={};for(const k2 of ['dens','mul','star','moonO','lant','rain','wat','gls'])o[k2]=MU.lerp(A[k2],B[k2],f);o.top=lerpC(A.top,B.top,f);o.bot=lerpC(A.bot,B.bot,f);return o;}
let P=0.75,timeAuto=false,targetP=0.75,F=0.35,floodAuto=true,targetF=0.35;
const NAMES=['dawn','day','dusk','night'];
function grpSet(sel,btn){document.querySelectorAll(sel).forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
document.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{grpSet('[data-t]',b);if(b.dataset.t==='auto')timeAuto=true;else{timeAuto=false;targetP=parseFloat(b.dataset.t);}}));
document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{grpSet('[data-f]',b);if(b.dataset.f==='auto')floodAuto=true;else{floodAuto=false;targetF=parseFloat(b.dataset.f);}}));
let turntable=true;const ttBtn=document.getElementById('tt');ttBtn.addEventListener('click',()=>{turntable=!turntable;ttBtn.textContent=(turntable?'◉':'○')+' turntable';ttBtn.classList.toggle('on',turntable);});
const phaseEl=document.getElementById('phase');

/* camera — the long side elevation from across the flooded street */
const target=new THREE.Vector3(0,11,5);
let camA=1.3,camR=116,camY=21,drag=false,px=0,py=0;
c.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;});addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;camA-=(e.clientX-px)*.005;camY=MU.clamp(camY-(e.clientY-py)*.4,8,85);px=e.clientX;py=e.clientY;});
addEventListener('wheel',e=>{camR=MU.clamp(camR+e.deltaY*.05,110,250);},{passive:true});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
document.getElementById('legend').innerHTML=[[PAL.lant,'lanterns','rising from the trays'],[PAL.glassHi,'stepped roof','trusses + glazing, caving in'],[PAL.conc,'concrete','the trays and the base'],[PAL.leafHi,'overgrowth','trees through the trays'],[PAL.foam,'the flood','Quincy St under water'],[PAL.moon,'full moon','stars, rain']]
  .map(r=>`<div class="row"><span class="sw" style="background:#${C(r[0]).getHexString()};box-shadow:0 0 10px #${C(r[0]).getHexString()}"></span><span>${r[1]}</span><span class="v">${r[2]}</span></div>`).join('');

/* ---------- animate ---------- */
const clock=new THREE.Clock(),tmpC=new THREE.Color();let last=0;
const dimMats=[conObj.material,deckObj.material,trayObj.material,vegObj.material,gndObj.material,farObj.material,lineObj.material,vineObj.material,...canopies.map(cn=>cn.o.material)];
function animate(){requestAnimationFrame(animate);
  if(turntable&&!drag)camA+=0.0007;
  const t=clock.getElapsedTime(),dt=Math.min(0.05,t-last);last=t;
  camera.position.set(Math.cos(camA)*camR,camY,Math.sin(camA)*camR);camera.lookAt(target);dome.position.copy(camera.position);
  if(timeAuto)P=(P+dt/110)%1;else{let d=((targetP-P+0.5)%1+1)%1-0.5;P=((P+d*Math.min(1,dt*1.4))%1+1)%1;}
  if(floodAuto)F=0.5-0.5*Math.cos(t*0.045+1.3);else F+=(targetF-F)*Math.min(1,dt*1.2);
  const par=tparams(P);
  skyU.top.value.copy(par.top);skyU.bot.value.copy(par.bot);scene.background.copy(par.bot);scene.fog.color.copy(par.bot);scene.fog.density=par.dens;
  for(const m of dimMats)m.color.setScalar(par.mul);for(const m of mirrorMats)m.color.setScalar(par.mul*0.8);
  glsObj.material.opacity=0.75*par.gls;glsRef.material.opacity=0.35*par.gls;
  moonMat.opacity=0.62*par.moonO;haloMat.opacity=0.2*par.moonO;starMat.opacity=0.9*par.star;
  waterY=0.2+F*4.4;
  waterMat.color.copy(par.bot).multiplyScalar(par.wat);
  waterPts.material.color.copy(par.bot).lerp(tmpC.set(0xFFFFFF),0.45);waterPts.material.opacity=0.26+0.16*(1-par.star*0.5);
  foam.position.y=waterY+0.08*Math.sin(t*1.3);foam.material.opacity=0.3+0.2*par.moonO;
  clipPlane.constant=waterY;mirror.position.set(0.2*Math.sin(t*1.1),2*waterY,0);
  lanterns.material.opacity=0.2+0.78*par.lant;lanRef.material.opacity=0.12+0.45*par.lant;
  rainObj.material.opacity=0.36*par.rain;
  phaseEl.textContent='— '+NAMES[Math.round(P*4)%4]+' · flood '+Math.round(F*100)+'% · rain '+Math.round(par.rain*100)+'% —';
  // water surface
  for(let i=0;i<wN;i++)wPos[i*3+1]=waterY+0.18*Math.sin(t*1.5+wPh[i])+0.12*Math.sin(wPos[i*3]*0.06+t*0.7);
  wGeo.attributes.position.needsUpdate=true;
  // moon glitter column on the water
  {let dx=MC.x-camera.position.x,dz=MC.z-camera.position.z;const L=Math.hypot(dx,dz);dx/=L;dz/=L;
    for(let i=0;i<GLN;i++){const g=glIt[i],w=0.5+g.d*0.035;glPos[i*3]=camera.position.x+dx*g.d-dz*g.j*w*(1+0.3*Math.sin(t*2+g.ph));glPos[i*3+1]=waterY+0.25;glPos[i*3+2]=camera.position.z+dz*g.d+dx*g.j*w*(1+0.3*Math.sin(t*2+g.ph));}
    glGeo.attributes.position.needsUpdate=true;glitter.material.opacity=0.55*par.moonO+0.08;}
  for(const L of fogLayers){L.o.rotation.y+=L.spd*dt;if(L.follow)L.o.position.y=waterY;L.o.material.opacity=L.op*(0.85+0.15*Math.sin(t*0.2+L.ph));L.o.material.color.copy(par.bot).lerp(tmpC.set(0xFFFFFF),0.25);}
  // lanterns: rest and flicker on the trays, then rise and drift
  for(let i=0;i<LN;i++){const l=lan[i];
    if(l.state===0){l.timer-=dt;if(l.timer<=0)l.state=1;lanPos[i*3]=l.x;lanPos[i*3+1]=l.y0+0.06*Math.sin(t*3+l.ph);lanPos[i*3+2]=l.z;continue;}
    l.y+=l.vy*dt;l.x+=0.5*dt*Math.sin(t*0.3+l.ph)+0.4*dt;l.z+=0.4*dt*Math.cos(t*0.27+l.ph);if(l.y>140)lanSpot(l);
    lanPos[i*3]=l.x+0.3*Math.sin(t*1.7+l.ph);lanPos[i*3+1]=l.y;lanPos[i*3+2]=l.z;}
  lanGeo.attributes.position.needsUpdate=true;
  // kodama motes
  for(let i=0;i<MN;i++){const m=motes[i];moPos[i*3]=m.x+m.r*Math.sin(t*0.4+m.ph);moPos[i*3+1]=m.y+0.8*Math.sin(t*0.7+m.ph*2);moPos[i*3+2]=m.z+m.r*Math.cos(t*0.35+m.ph);}
  moGeo.attributes.position.needsUpdate=true;moteObj.material.opacity=(0.15+0.6*par.star)*(0.7+0.3*Math.sin(t*2.3));
  // canopies sway (mirror copies follow)
  for(let i=0;i<canopies.length;i++){const cn=canopies[i],rz=0.025*Math.sin(t*0.9+cn.ph),rx=0.02*Math.sin(t*0.7+cn.ph*1.3);cn.o.rotation.z=rz;cn.o.rotation.x=rx;canRefs[i].rotation.z=rz;canRefs[i].rotation.x=rx;}
  // rain
  if(par.rain>0.02){for(let i=0;i<raN;i++){const p2=ra[i];p2.y-=p2.v*2.6;p2.x-=p2.v*0.5;if(p2.y<waterY){p2.y=110;p2.x=rand(-150,150);}raPos[i*6]=p2.x;raPos[i*6+1]=p2.y;raPos[i*6+2]=p2.z;raPos[i*6+3]=p2.x-1.2;raPos[i*6+4]=p2.y-4.5;raPos[i*6+5]=p2.z;}
    raGeo.attributes.position.needsUpdate=true;}
  // stars twinkle
  if(par.star>0.01){const arr=stars.geometry.attributes.color.array;for(let i=0;i<starPh.length;i++){const tw=0.5+0.5*Math.sin(t*1.2+starPh[i]);arr[i*3]=starBase[i*3]*tw;arr[i*3+1]=starBase[i*3+1]*tw;arr[i*3+2]=starBase[i*3+2]*tw;}stars.geometry.attributes.color.needsUpdate=true;}
  // shooting stars: seeded schedule, a few a minute
  if(t>nextMet){nextMet=t+rand(9,22);const m=mets.find(q=>!q.on);if(m){const az=camA+Math.PI+rand(-0.75,0.75),R=rand(260,340);m.x=camera.position.x+Math.cos(az)*R;m.z=camera.position.z+Math.sin(az)*R;m.y=camY+R*rand(0.2,0.45);
    const a2=rand(0,6.28);let dx=Math.cos(a2),dy=-rand(0.25,0.6),dz=Math.sin(a2);const l=Math.hypot(dx,dy,dz);m.dx=dx/l;m.dy=dy/l;m.dz=dz/l;m.v=rand(110,180);m.life=rand(0.6,1.1);m.age=0;m.on=true;}}
  {const vis=MU.clamp(par.star*1.3,0,1);for(let i=0;i<SM;i++){const m=mets[i];let env=0,hx=0,hy=-999,hz=0,L=0;if(m.on){m.age+=dt;if(m.age>m.life)m.on=false;else{env=Math.sin(Math.PI*m.age/m.life)*vis;const d=m.v*m.age;hx=m.x+m.dx*d;hy=m.y+m.dy*d;hz=m.z+m.dz*d;L=Math.min(d,42);}}
    for(let j=0;j<STS;j++){const o=(i*STS+j)*6,u0=j/STS,u1=(j+1)/STS,f0=Math.pow(1-u0,2)*env,f1=Math.pow(1-u1,2)*env;
      mlPos[o]=hx-m.dx*L*u0;mlPos[o+1]=hy-m.dy*L*u0;mlPos[o+2]=hz-m.dz*L*u0;mlPos[o+3]=hx-m.dx*L*u1;mlPos[o+4]=hy-m.dy*L*u1;mlPos[o+5]=hz-m.dz*L*u1;
      mlCol[o]=0.85*f0;mlCol[o+1]=0.92*f0;mlCol[o+2]=f0;mlCol[o+3]=0.85*f1;mlCol[o+4]=0.92*f1;mlCol[o+5]=f1;}
    mhPos[i*3]=hx;mhPos[i*3+1]=hy;mhPos[i*3+2]=hz;mhCol[i*3]=env;mhCol[i*3+1]=env;mhCol[i*3+2]=env;}
   mlGeo.attributes.position.needsUpdate=true;mlGeo.attributes.color.needsUpdate=true;mhGeo.attributes.position.needsUpdate=true;mhGeo.attributes.color.needsUpdate=true;}
  renderer.render(scene,camera);}
animate();
</script></body></html>
