{

const REMY_VS=`

// a solid core just under the fur, so the gaps between points show dark fur, not the sky
{const sg=new THREE.SphereGeometry(1,20,14),cm=new THREE.MeshBasicMaterial({color:0xA5581E});

    vec3 body=mix(vec3(0.03,0.04,0.12),vec3(0.10,0.07,0.22),bands)*(0.25+1.1*lit);vec3 atm=mix(uRingB,uRingA,lit)*pow(1.0-f,3.0)*(0.4+1.4*lit);
    gl_FragColor=vec4(body+atm,1.0);}`}));
planet.position.set(-700,-560,-760);planet.renderOrder=-8;scene.add(planet);
// light beams streaking diagonally across, now and then
const beams=[];
for(let i=0;i<3;i++){const m=new THREE.ShaderMaterial(Object.assign({uniforms:{uHead:{value:-1},uI:{value:0},uCol:{value:C(i===1?0xFF9AE8:0xA8F2FF)}},depthTest:false,
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'uniform float uHead,uI;uniform vec3 uCol;varying vec2 vUv;void main(){float d=vUv.x-uHead;float a=d<0.0?exp(d*5.0):exp(-d*60.0);a*=exp(-pow((vUv.y-0.5)*5.0,2.0));gl_FragColor=vec4(uCol*a*uI,1.0);}'},ADD));
  const b=new THREE.Mesh(new THREE.PlaneGeometry(1,1),m);b.scale.set(900,5,1);b.renderOrder=-5;scene.add(b);beams.push({mesh:b,m,t0:-100,dur:2.6,next:rand(3,12)+i*5});}
function launchBeam(B,t){const ang=rand(0.35,0.7)*(rng()<0.5?1:-1);B.mesh.rotation.z=-ang;B.mesh.position.set(rand(-120,120),rand(-40,90),-260-rand(0,120));B.t0=t;B.dur=rand(1.8,3.2);B.next=t+rand(9,22);B.m.uniforms.uI.value=rand(0.45,0.9);}
// a giant ghost cat traced as a constellation: dots and thin lines, very faint, drifting
const ghost=new THREE.Group();scene.add(ghost);
{const H=[[0,0.62],[0.22,0.6],[0.4,0.98],[0.52,0.5],[0.64,0.28],[0.62,0.04],[0.47,-0.16],[0.22,-0.3],[0,-0.33]],B=[[0.47,-0.16],[0.66,-0.55],[0.8,-1.15],[0.62,-1.48],[0.22,-1.52],[0,-1.5]];
  const EYE=[[0.17,0.24],[0.3,0.25]],NOSE=[[0,0.04],[0.08,0.1]];
  const lp=[],dp=[];const S=150;const seg=(L)=>{for(const s of [1,-1]){for(let i=0;i<L.length-1;i++){lp.push(L[i][0]*S*s,L[i][1]*S,0,L[i+1][0]*S*s,L[i+1][1]*S,0);}for(const q of L)dp.push(q[0]*S*s,q[1]*S,0,1);}};
  seg(H);seg(B);seg(EYE);seg(NOSE);
  for(let i=0;i<60;i++)dp.push(rand(-0.85,0.85)*S,rand(-1.5,1)*S,0,0.4);
  const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
  const ln=new THREE.LineSegments(lg,new THREE.LineBasicMaterial(Object.assign({color:0x9DB4FF,opacity:0.085},ADD)));ln.renderOrder=-7;ghost.add(ln);
  const P=new Float32Array(dp.length/4*3),A=new Float32Array(dp.length/4);for(let i=0;i<A.length;i++){P[i*3]=dp[i*4];P[i*3+1]=dp[i*4+1];P[i*3+2]=0;A[i]=dp[i*4+3];}
  const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(P,3));dg.setAttribute('aB',new THREE.BufferAttribute(A,1));
  const dots=new THREE.Points(dg,new THREE.ShaderMaterial(Object.assign({uniforms:U,vertexShader:'attribute float aB;uniform float uT;varying float vA;void main(){vA=aB*(0.24+0.1*sin(uT*0.9+position.x));gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);gl_PointSize=2.0+aB*2.0;}',
    fragmentShader:'varying float vA;void main(){float r=length(gl_PointCoord-0.5)*2.0;if(r>1.0)discard;gl_FragColor=vec4(vec3(0.8,0.88,1.0)*vA*(1.0-r*r),1.0);}'},ADD)));dots.renderOrder=-7;ghost.add(dots);
  ghost.position.set(430,210,-900);}

/* ================= controls: TIME (mood), PULSE, AURA, GLOW ================= */
const MOODS=[
 {nebA:0x6A2BD8,nebB:0xD23CB4,bg:0x07031A,ringA:0x8FF0FF,ringB:0xA070FF,ringC:0xFF5AC8,nebI:1.0,star:1.0},
 {nebA:0x1E44C8,nebB:0x2FB8E0,bg:0x020818,ringA:0xA0F8FF,ringB:0x5C7CFF,ringC:0x9A5CFF,nebI:0.95,star:1.15},
 {nebA:0x9A2478,nebB:0xF07048,bg:0x11030E,ringA:0xFFE2B8,ringB:0xFF6AB4,ringC:0xFF8C5A,nebI:1.0,star:0.85},
 {nebA:0x261246,nebB:0x4A2068,bg:0x010104,ringA:0x9FE8FF,ringB:0x6A5CC8,ringC:0xB04CA8,nebI:0.55,star:1.35}];
const MNAMES=['astral','deep','ember','void'];
let mood=0,moodF=0,moodAuto=false,moodTarget=0;
const mc=(k,f)=>{const i=Math.floor(f)%4,j=(i+1)%4,u=ss(f-Math.floor(f));return C(MOODS[i][k]).lerp(C(MOODS[j][k]),u);};
let pulseAuto=true,pulsePer=4,auraAuto=false,auraT=1,aura=1,glowT=1,glow=1;
function grpSet(sel,btn){document.querySelectorAll(sel).forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
document.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{grpSet('[data-t]',b);if(b.dataset.t==='auto')moodAuto=true;else{moodAuto=false;moodTarget=parseFloat(b.dataset.t);}}));
document.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{grpSet('[data-p]',b);if(b.dataset.p==='auto')pulseAuto=true;else{pulseAuto=false;pulsePer=parseFloat(b.dataset.p);}}));
document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{grpSet('[data-a]',b);if(b.dataset.a==='auto')auraAuto=true;else{auraAuto=false;auraT=parseFloat(b.dataset.a);}}));
document.querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>{grpSet('[data-g]',b);glowT=parseFloat(b.dataset.g);}));
let turntable=true;const ttBtn=document.getElementById('tt');ttBtn.addEventListener('click',()=>{turntable=!turntable;ttBtn.textContent=(turntable?'◉':'○')+' turntable';ttBtn.classList.toggle('on',turntable);});
const phaseEl=document.getElementById('phase');

/* camera — straight on, at the height of his eyes. Orbit wider by hand (camA clamped to +-60 deg) */
const target=new THREE.Vector3(0,18.2,0);
let camA=0,camR=48,camY=20.1,drag=false,px=0,py=0;
c.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;});addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;camA-=(e.clientX-px)*.005;camY=MU.clamp(camY-(e.clientY-py)*.4,4,40);px=e.clientX;py=e.clientY;});
addEventListener('wheel',e=>{camR=MU.clamp(camR+e.deltaY*.05,24,95);},{passive:true});
function setScale(){U.uScale.value=renderer.getSize(new THREE.Vector2()).y*renderer.getPixelRatio()/(2*Math.tan(MU.degToRad(camera.fov/2)));}
setScale();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);setScale();});

/* ================= animate ================= */
const SWAY=MU.degToRad(15),SPIN=0.0001,SWAY_K=(2*Math.PI/(38*60))/SPIN;// one sway every ~38 s at turntable 1
let swayPh=0,lastA=camA;
const clock=new THREE.Clock();let last=0,pph=0,blinkT=-100,nextBlink=rand(6,12),flareT=-100,nextFlare=rand(12,22),twT=-100,twSide=1,nextTw=rand(5,10),arcTick=0;
function animate(){requestAnimationFrame(animate);
  if(turntable&&!drag)camA+=0.0001;
  // the turntable's small per-step increments become the sway phase; manual orbit stays in camA
  {const d=camA-lastA;if(d!==0&&Math.abs(d)<=SPIN*4.5){swayPh+=d*SWAY_K;camA=lastA;}camA=MU.clamp(camA,-1.05,1.05);lastA=camA;}
  const t=clock.getElapsedTime(),dt=Math.min(0.05,t-last);last=t;
  const A=camA+SWAY*Math.sin(swayPh);
  camera.position.set(Math.sin(A)*camR,camY,Math.cos(A)*camR);camera.lookAt(target);
  // mood (TIME)
  if(moodAuto)moodF=(moodF+dt/70)%4;else{let d=((moodTarget-moodF+2)%4+4)%4-2;moodF=((moodF+d*Math.min(1,dt*1.2))%4+4)%4;}
  U.uNebA.value.copy(mc('nebA',moodF));U.uNebB.value.copy(mc('nebB',moodF));scene.background.copy(mc('bg',moodF));
  U.uRingA.value.copy(mc('ringA',moodF));U.uRingB.value.copy(mc('ringB',moodF));U.uRingC.value.copy(mc('ringC',moodF));
  {const i=Math.floor(moodF)%4,j=(i+1)%4,u=ss(moodF-Math.floor(moodF));U.uNebI.value=MU.lerp(MOODS[i].nebI,MOODS[j].nebI,u);U.uStarI.value=MU.lerp(MOODS[i].star,MOODS[j].star,u);}
  // pulse (eyes + ring + waves share one phase)
  const per=pulseAuto?4+0.6*Math.sin(t*0.05):pulsePer;pph+=dt/per;U.uPPh.value=pph;const pulse=0.5+0.5*Math.cos(pph*2*Math.PI);U.uPulse.value=pulse;
  const at=auraAuto?1+0.4*Math.sin(t*0.09):auraT;aura+=(at-aura)*Math.min(1,dt*1.5);U.uAura.value=aura;
  glow+=(glowT-glow)*Math.min(1,dt*2);
  // blink every 15-25 s: the lids close, the glow dims and comes back
  if(t>nextBlink){blinkT=t;nextBlink=t+rand(15,25);}
  const bu=(t-blinkT)/0.42;const open=bu>=0&&bu<1?1-Math.sin(bu*Math.PI):1;
  const gb=bu<0?1:bu<1?0.15+0.85*open*0.3:0.15+0.85*ss((t-blinkT-0.42)/1.4);
  for(const m of eyeMats)m.uniforms.uOpen.value=Math.max(open,0.02);
  // brighter flare every 20-40 s
  if(t>nextFlare){flareT=t;nextFlare=t+rand(20,40);}
  const fu=t-flareT;U.uFlare.value=fu<0?0:fu<0.3?fu/0.3:Math.exp(-(fu-0.3)*2.2);
  U.uGlowE.value=glow*gb;
  // breathing, ear twitches
  U.uBreath.value=0.016*Math.sin(t*2*Math.PI/5.2);
  if(t>nextTw){twT=t;twSide=rng()<0.5?1:-1;nextTw=t+rand(6,15);}
  const tu=(t-twT)/0.5,tw=tu>=0&&tu<1?0.3*Math.sin(tu*Math.PI*2)*(1-tu):0;U.uTwR.value=twSide>0?tw:0;U.uTwL.value=twSide<0?tw:0;
  U.uT.value=t;
  if(++arcTick%3===0)stepArcs(t,aura,pulse);
  for(const B of beams){if(t>B.next)launchBeam(B,t);const u=(t-B.t0)/B.dur;B.m.uniforms.uHead.value=u<=1.2?-0.1+u*1.2:-1;}
  ghost.position.x=430+25*Math.sin(t*0.013);ghost.position.y=210+12*Math.cos(t*0.011);ghost.rotation.z=0.06*Math.sin(t*0.009);
  phaseEl.textContent='— '+MNAMES[Math.round(moodF)%4]+' · pulse '+per.toFixed(1)+' s —';
  renderer.render(scene,camera);}
animate();
</script></body></html>
